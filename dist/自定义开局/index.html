主镇天魔。',tags:['玄盟盟主','正道','万法']}]}]},{id:'reg-dongtu',name:'东土',description:'海上孤悬之自由海疆。西陲巨蕈菌海封死通往中原之陆路，唯余海路；东溟万岛千礁星罗，临渊城为跨域门户。境内宗门尽皆中立，世称“日出之地”。',children:[{id:'eco-dt-jujun',name:'巨蕈菌海',description:'西陲·孢雾屏障。擎天巨蕈连绵成海，孢雾终年弥漫、夜放幽光；封死东土通往中原之陆路，琉璃丹宗于此设采药营。',tags:['孢雾屏障','巨蕈','险地'],kingdoms:[],sects:[]},{id:'eco-dt-linyuan',name:'临渊水乡',description:'中部·河口水乡。悬河、天江于此交汇入海，泽国千回；临渊城建于水上，为各域跨海登陆之门户，青龙信仰中心。',tags:['河口水乡','自由港','跨域门户'],kingdoms:[{name:'临渊城',brief:'建于水上的超大型修仙城市·自由港，跨域门户，青龙信仰中心。',tags:['自由港','跨域门户']}],sects:[{name:'天衍楼',brief:'中立·情报枢纽，以阵法、符箓、卜算闻名，办“天衍大比”；居临渊城。',tags:['中立','术修','情报']},{name:'合欢宗',brief:'中立宗门，信阴阳交合、七情六欲乃通大道之根本；居临渊城（醉月楼）。',tags:['中立','双修']}]},{id:'eco-dt-liufang',name:'流芳岛',description:'东部·灵药仙岛。灵雾缭绕、四时如春，奇花异草仙植遍生；琉璃丹宗坐镇，凡间誉为“药王岛”。',tags:['灵药仙岛','丹道','中立'],kingdoms:[],sects:[{name:'琉璃丹宗',brief:'中立炼丹大宗，神陆最大丹药供应商；以药济世、以丹证道。',tags:['中立','丹道']}]},{id:'eco-dt-penglai',name:'蓬莱三仙岛',description:'东部远岛·隐世圣地。蓬莱、方丈、瀛洲三岛以虹桥相连，随灵潮时隐时现、凡舟难近；东土修真之巅。',tags:['隐世仙岛','剑修','上古仙宗'],kingdoms:[],sects:[{name:'蓬莱仙宗',brief:'隐世上古仙宗，清修问道、御剑参玄；东土修真之天花板。',tags:['中立','剑修','隐世']}]},{id:'eco-dt-shuanghua',name:'霜花岛',description:'东部·月华冰霜。海面薄冰铺展、霜花成簇如玉，月华灵蕴最盛；全女宗广寒宫隐于此。',tags:['冰霜月华','全女宗','中立'],kingdoms:[],sects:[{name:'广寒宫',brief:'中立全女宗，主修冰霜、太阴、月华，养女子元阴之力；与合欢宗为死敌。',tags:['中立','全女','冰霜']}]},{id:'eco-dt-biluo',name:'碧落珊瑚海',description:'东南·蔚蓝珊瑚海。珊瑚礁星罗、海岛百数，水下有鱼人珊瑚聚落；珠崖城与鱼人通商而富。',tags:['珊瑚海','鱼人通商','海珍'],kingdoms:[{name:'珠崖城',brief:'碧落珊瑚海缘之海珍贸易港城，与鱼人通商而富。',tags:['海珍港城']}],sects:[]},{id:'eco-dt-liexing',name:'列星海',description:'东溟中央·散修海疆。千岛万礁星罗，海商、海寇行舟其间；聚仙城散修坊市与扶桑城东瀛海邦并立。',tags:['散修海疆','万岛千礁','法外坊市'],kingdoms:[{name:'聚仙城',brief:'列星海中散修坊市大城，鱼龙混杂、法外自由，黑市情报之渊薮。',tags:['散修坊市','法外']},{name:'扶桑城',brief:'东瀛风海岛城邦，信“诸天百神”，神社鸟居遍布、剑士民风。',tags:['东瀛海邦','神道']}],sects:[]}]},{id:'reg-beijing',name:'北境',description:'草原、苔原、冰川峡湾与极北沙漠并存；愈北愈寒，凡国凡修各踞一隅。',children:[{id:'eco-bj-xuesong',name:'雪松峡湾',description:'东北沿海·冰川峡湾。鲸语者公孙氏世代立国，崇北方玄武；龙首楼船游弋峡湾。',tags:['冰川峡湾','海族','玄武信仰'],kingdoms:[{name:'沧澜王朝',brief:'海上世袭王朝，公孙 ',formula:'coef',coefRange:[0,.2]}]},oe=new Set(['傀儡','灵兽']),se=[0,.3],le={炼气:1,练气:1,筑基:2,金丹:3,元婴:4,化神:5},ae={凡:0,黄:.25,玄:.5,地:.75,天:1};function ce(e){return le[e]??1}function ie(e){return ae[e]??0}function re(e,t,n){const o='percent'===e.type?'%':'';if('d20'===e.formula){const e=Math.max(1,Math.floor(t/2+2*n));return{min:e,max:e,suggested:e,fixed:!0,unit:o}}if('pct'===e.formula){const e=Math.max(0,Math.floor(5*t+20*n));return{min:e,max:e,suggested:e,fixed:!0,unit:o}}if('coef'===e.formula&&e.coefRange){const[s,l]=e.coefRange,a=Math.pow(10,t),c=1+n,i=Math.max(0,Math.floor(a*s*c)),r=Math.max(0,Math.floor(a*l*c));return{min:i,max:r,suggested:Math.max(0,Math.floor(a*((s+l)/2)*c)),fixed:i===r,unit:o}}return null}function ue(e,t){return!(!t||t.fixed)&&e>t.max}const me=[{id:'story-zayou',name:'入宗试灵',subtitle:'测灵根，定门第',desc:'入宗大典之日，于测灵盘前验灵根深浅；宗门据灵根优劣分派内门、外门，资质上佳者更得长老收为亲传、择师而授。',cost:0,glyph:'试',recommend:'寻常修行 / 砺心问道',类型:'宗门',constraints:{灵根禁止:['无']},settings:{时间:{年:7203,月:1,日:5,时辰:'辰时'},宗门:'入宗受试·待分派门第',初始境界:{大境界:'炼气',小境界:'初期'}},body:'入宗大典之日，测灵广场上人头攒动。\n你随着一众怀揣憧憬的少年男女鱼贯而入，广场中央立着一座古朴的青玉测灵盘，盘面五色微光流转不定。\n司礼执事立于盘侧，唱名声此起彼伏：「灵根驳杂，分入外门，充作杂役——」「真灵入品，外门亲传——」「上品灵根，内门嫡传，长老择徒而授——」\n每一声唱报都牵动着阶下众人的呼吸：被点入内门者喜形于色，落入外门者亦如蒙大赦，唯有测不出灵根者，黯然退场。\n终于轮到你。执事抬眼扫了你一眼，淡淡道："上前，将手按在盘心，凝神，莫要分心。"\n你深吸一口气，缓步上前，将掌心轻轻覆上那温润微凉的玉盘——'},{id:'story-yinyu',name:'隐玉初识',subtitle:'于市井间结识高人',desc:'本欲只在市井度日，却于茶肆偶遇游方仙师，赠你一卷残页。',cost:0,glyph:'机',recommend:'寻常修行',类型:'散修',constraints:{灵根禁止:['无']},settings:{时间:{年:7156,月:11,日:12,时辰:'酉时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'你正坐在茶肆角落，看着雪粒打在窗棂上发呆。\n邻桌一位灰衣老者忽然冲你笑了笑：\n"小友与剑有缘。"\n他随手在桌上推过一卷油黄的残页，又自顾自饮尽杯中酒，转眼便消失在风雪中——'},{id:'story-fuchou',name:'血门遗孤',subtitle:'负仇前行',desc:'门派在魔修夜袭中被屠尽，只你一人带着师门信物逃出生天。',cost:0,glyph:'仇',recommend:'砺心问道 / 逆天改命',类型:'散修',constraints:{灵根禁止:['无']},settings:{时间:{年:7188,月:7,日:22,时辰:'寅时'},宗门:'散修（前 · 雾隐山门）',初始境界:{大境界:'炼气',小境界:'后期'}},body:'山门毁于一夜之间。\n你伏在血泥里装死，听着师姐的最后一声怒吼，听着那道沉重的拐杖从身边经过。\n直到一切归于死寂。\n你紧紧攥着那枚被血浸透的玉牌，在黎明前从断壁残垣中爬出来——',tags:['仇怨']},{id:'story-dadao',name:'已悟大道',subtitle:'前世今生',desc:'你似乎记得前世种种。一切尚未开始，便仿佛已是结局。',cost:0,glyph:'道',recommend:'小道悠游',类型:'特殊',settings:{时间:{年:7301,月:3,日:3,时辰:'卯时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'你在朝霞中睁开眼。\n窗外是再熟悉不过的灵溪，远处晨钟敲响——\n这一切，你似乎在某个梦里见过千百次。\n你抬手轻抚胸口的玉牌，那里仿佛还残留着上一世火焚之后的余温——',tags:['传说']},{id:'story-tianxuan-zayou',name:'万剑坪 · 剑师赠石',subtitle:'风雪中的萍水之缘',desc:'天玄剑宗杂役弟子，于万剑坪扫雪时偶遇大师兄墨诗行下山历练；离去前他随手抛下一枚下品灵石。',cost:0,glyph:'剑',recommend:'砺心问道',类型:'宗门',constraints:{locationIds:['eco-xy-wuyan'],灵根禁止:['无']},settings:{时间:{年:7204,月:12,日:18,时辰:'辰时'},宗门:'天玄剑宗（外门杂役）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'天玄剑宗宗门广场，万剑坪上积了一层新霜，几名杂役弟子正低头清扫，你就在其中。\n宗主莫决云站在大殿前的石阶上，负手而立，灰白长衫随风飘荡；大师兄墨诗行斜倚在一处石碑，腰间挂着个酒葫芦，双目半阖。\n"光天化日，醉酒喧哗，成何体统？"莫决云的声音不大，却清晰传遍了整个万剑坪，隐隐压过呼啸的风声。\n墨诗行换了个更舒适的姿势倚靠在石碑上，随手拍掉落在肩头的雪花。\n"师尊此言差矣。今朝有酒今朝醉，明日愁来明日愁。这雪景配佳酿，正如宝剑配英雄，岂不美哉？"\n莫决云眉头微皱，袖袍一挥，一道无形剑气扫过，将墨诗行身旁的积雪激起三尺高，墨诗行却是丝毫不避。\n"冥顽不灵。今日起，你便下山历练去吧，未得突破机缘，不得回宗。"\n墨诗行眼睛一亮，立刻站直了身子，对着莫决云恭敬地行了一礼，"弟子谨遵师命，定不负师尊厚望。"\n他说完，甚至没等莫决云再说什么，转身便向山门方向走去，路过你身边时，脚步稍稍顿了一下。\n墨诗行腰间的葫芦随着步伐轻轻晃动，发出清脆的响声，飘来些许淡淡的酒香。\n"宠辱两相忘，所欲随心安……这位小友，扫雪虽枯燥，却也是一种修行啊。"墨诗行笑了笑，从袖中摸出一枚下品灵石，轻轻一抛，恰好落在你手中。\n"拿去打壶热酒暖暖，这冰天雪地的，莫要冻坏了道基，哈哈哈！"说罢，他掐起法诀，御剑飞去，很快就消失在漫天风雪之中。'},{id:'story-lingfeng-yueye',name:'回音谷 · 月下合奏',subtitle:'初入聆风斋的雅会',desc:'入聆风斋不久，月夜独抚琴于回音谷，恰遇手持玉笛的夏未央，二人合奏一曲。',cost:0,glyph:'琴',recommend:'小道悠游 / 寻常修行',类型:'宗门',constraints:{locationIds:['eco-bj-nanfeng'],灵根禁止:['无']},settings:{时间:{年:7212,月:8,日:16,时辰:'亥时'},宗门:'聆风斋',初始境界:{大境界:'炼气',小境界:'初期'}},body:'夜色稍沉，一弯新月挂在回音谷的夜空；水汽氤氲，濡湿了岸边的青苔。\n你坐于河边石上，膝上横着古琴，指尖勾挑，并无定谱，只随风势起落。泠泠七弦，偶尔惊起栖息在芦苇荡中的几只水鸟，水鸟振翅掠过水面，摇散月光点点。\n忽有笛声自林梢落下，那笛音清越，不争不抢，只轻轻填补琴音将歇的空隙，留住了那将要散去的余韵。\n你按住琴弦，抬眼望去，林间小径转角处，一袭淡藕色纱裙随风微动。来人手持一支玉笛，笛身通体洁白，惟有末端坠着明黄流苏。\n"扰了道友雅兴，方才听这琴音，似有江流宛转绕芳甸之意，却又多了几分随性。道友是新入斋的？"\n你起身，向女子拱手一礼，"在下你，初入聆风斋，见此地月色正好，情难自禁，不想惊动了师姐。"\n那女子行至水边，并未站在高处受礼，而是在一旁的青石上坐下，将玉笛横在膝头。\n"万物有声，这水浪拍岸是声，虫鸣鸟叫是声，道友的琴音自然也是声，既然都在这天地间，那便算不得惊扰。"\n"我方才在林中，听道友琴中似有未尽之意，恰好我有支曲子也缺了些许意境，不知道友可愿合奏一曲？"\n你重新落座，双手抚上琴弦，无需言语确认调式，指尖落下，便是回应。\n琴音起时如山涧滴泉，清冽透亮；笛声随之而入，绵长悠远，似风过松林。\n曲终，余音散入风中，水面复归平静。\n"今夜的风，倒是比往日柔和了些。"夏未央轻抚笛身，站起身来，理了理被风吹乱的鬓发。\n"若是道友喜欢此地，往后也可常来。聆风斋夏未央，记下了道友今夜的琴。"'},{id:'story-liuli-baicao',name:'百草峰 · 药园新邻',subtitle:'与赵芳萤同顷锄药',desc:'琉璃丹宗外门弟子，于百草峰偏角药园锄药；隔壁新搬来一位怯生生的小师妹赵芳萤。',cost:0,glyph:'丹',recommend:'寻常修行',类型:'宗门',constraints:{locationIds:['eco-dt-liufang'],灵根禁止:['无']},settings:{时间:{年:7197,月:4,日:9,时辰:'辰时'},宗门:'琉璃丹宗（外门杂役）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'流芳山脉绵延几百里，晨辉破云，金光洒落百草峰，峰顶云蒸霞蔚，隐约可见有内门弟子御物在天，或坐于葫芦、或立于飞剑，但那都是与杂役无缘的风景。\n琉璃丹宗，百草峰，集中种植低阶灵草灵药的区域，其中一片小药园。\n你提起锄头歇息片刻，直起腰，炼气初期的灵气在经脉里转了小半周天，消解了些许疲乏。这块药田便是其在琉璃丹宗的一亩三分地，种的皆是炼气期丹药的基础辅材。\n隔壁那荒废了大半个月的小药园，今日有了动静。\n竹篱那边，一名看上去豆蔻年华的少女，身上的杂役布袍宽大了些许，袖口挽了几道，露出细瘦的手腕。她半蹲在土地上，对着刚栽下去有些蔫头耷脑的草药比划。\n"绿高高，这里的土很软和，你要争气，把根扎深点。"\n声音顺着晨风飘过竹篱，落入你耳中。那少女并未察觉旁人目光，只是从沟渠舀起少许泉水，淋给草药。\n"喝了水就不许枯了，等你长出新叶子，我就喊你绿壮壮。"\n你手中锄头轻顿，碰上一块硬土，发出了响声，少女转头，眸子里映出你提着锄头的身影。\n她连忙站起身来，双手在身前交叠，朝着你深深行了一礼，因为动作太急，头顶那条用来束发的粗布条歪了一些，几缕碎发散在额前。\n"前、前辈好。"她头垂得很低，露出白净纤细的后颈，声音有些发怯，"我是新来这块药田的赵芳萤，若是吵到前辈修行，还请前辈恕罪。"'},{id:'story-nanjiang-fox',name:'十万大山 · 邂逅狐妖',subtitle:'采药途中偶入仙芝幽谷',desc:'为寻"灵山仙芝"在十万大山边缘盘桓数日，误入幽谷，遇见正对木桩独自练习答词的青丘狐族少女苏凝香。',cost:0,glyph:'狐',recommend:'寻常修行 / 砺心问道',类型:'散修',constraints:{regionIds:['reg-nanjiang'],灵根禁止:['无']},settings:{时间:{年:7220,月:6,日:1,时辰:'辰时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'中期'}},body:'晨曦微露，南疆特有的湿热水汽尚未完全散去，在林间凝成轻纱般的薄雾。\n你身负竹篓，脚穿皮靴，踏入幽深的小径，这里人迹罕至，寻常采药人不敢涉足，但你为了寻找那传闻中的"灵山仙芝"，已在十万大山边缘盘桓了数日。\n你拨开眼前遮蔽视线的阔叶，视野豁然开朗，前方是一处静谧的幽谷，谷中溪水潺潺，两岸开满了不知名的野花，随风摇曳，落英缤纷。花丛中央，坐着一位身着浅粉襦裙的少女，她背对着你，正对着一根木桩念念有词。\n"公子大恩，小女子无以为报，惟有……"少女声音稍顿，歪了歪头，似在回忆什么，随后换了一种语调，略带娇羞，"惟有以身相许，愿随君走遍天涯海角。"\n你不慎踩断了一截枯枝，咔嚓轻响，在这静谧幽谷中显得尤为突兀。\n少女身形微颤，蓦然回首，面容娇憨，双颊晕红，溪水般清澈的眼眸中带着些许惊慌。\n"你是谁？你是......来这里赏风景的吗？"\n你拱手一礼，"在下你，乃山中采药之人，误闯姑娘……清修之地，多有得罪，还望见谅。"\n少女闻言，眼中警惕稍退，取而代之的是好奇，似在确认对方的善意。\n"采药人……"她低声重复，随即起身，笨拙地回了一礼，"小女子苏凝香，这厢有礼了。"'},{id:'story-hehuan-yuanyang',name:'鸳鸯池 · 合欢宗入门',subtitle:'欢媚殿后初见双修场',desc:'被人劝入合欢宗，腰牌未热，便被引至鸳鸯池畔——温泉氤氲，琼浆四溢，初识"合欢双修"之名。',cost:0,glyph:'合',recommend:'小道悠游 / 寻常修行',类型:'宗门',constraints:{locationIds:['eco-dt-linyuan'],灵根禁止:['无']},settings:{时间:{年:7245,月:3,日:28,时辰:'戌时'},宗门:'合欢宗',初始境界:{大境界:'炼气',小境界:'中期'}},body:'天色已暗，华灯初上。数百盏绯色宫灯高悬，将腾起的袅袅热气染成暧昧的粉红。空气中弥漫着甜腻异香，如兰似麝，只稍稍吸入肺腑，便觉腹热气躁。\n你手里捏着刚领到的腰牌，还未从被人劝进此地的经历中回过神来。身后是通往欢媚殿的回廊，眼前是一幅活色生香的画卷。\n此处，合欢宗大浴场，唤作鸳鸯池——起名倒是直白，放眼望去，哪里是什么修仙福地，分明是毫无遮掩的欢场。温热泉水中，无数晶莹剔透的肉体各自纠缠——这里不仅是沐浴之地，更是合欢宗弟子的修炼场。\n你视线稍偏，便又见池水中的某处玉台，数名女修围坐一圈，中间躺着一位面色潮红的俊秀青年。\n"这就是新入门的小师弟？元阳倒是充沛得紧……让师姐们好好尝尝。"\n"这就是……修仙？"你喃喃自语，声音很快就被周遭此起彼伏的浪叫声淹没。\n乳白色的温泉，泛着暖意的迷蒙水雾，不远处的水床上，许多不着寸缕的少男少女正在嬉戏。',tags:['合欢']},{id:'story-fan-zhigen',name:'巷尾灯火 · 后天植根',subtitle:'凡夫之身偶遇仙缘',desc:'凡人之身，偶遇一位流落街巷的老叟。彼此有缘之下，老叟以一门近乎失传的秘法为你接续灵根，自此踏上修真路。',cost:0,glyph:'续',recommend:'寻常修行 / 砺心问道',类型:'特殊',constraints:{physiqueTier:['凡体']},settings:{时间:{年:7268,月:10,日:7,时辰:'亥时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'夜雨敲檐，巷尾的旧屋灯火微弱。\n你替母亲煎完了药，正欲熄灯，门口忽地传来轻而沙哑的咳声——一名衣衫褴褛的老叟扶着门框，似乎已撑不住身子。\n"小友……一碗清水……一处避风之所，可乎？"\n你让出门来，老叟入屋，跌坐在炕沿，借着灯光，他抬起一双竟未浑浊的眸子，仔细打量了你半晌。\n"你命中无根，本不可修。然——老朽身怀一门接续灵根的秘法，已无来日施展。今夜你引我入屋，便是因缘。"\n他从怀中摸出一截枯瘦如柴的指头，指尖结着一缕灰白的灵气，伸至你眉心。\n"忍住灼意，七寸气海若开，从此凡尘不复你归处。"\n一道温热自眉心直贯丹田。窗外的雨声渐远，屋内的烛火忽然明亮起来——\n凡夫之躯，自此续上仙缘。',tags:['特殊']},{id:'story-fan-renjian',name:'粟米人间 · 纯凡之路',subtitle:'不入修真路',desc:'不入修真之列，安守凡人本分；于市井间度日，于沙场上历劫。凡躯亦能见识修真世道。',cost:0,glyph:'俗',recommend:'砺心问道 / 逆天改命',类型:'特殊',constraints:{physiqueTier:['凡体']},settings:{时间:{年:7222,月:5,日:18,时辰:'巳时'},宗门:'散修',初始境界:{大境界:'凡人',小境界:'初期'}},body:'熹微之光透过窗纸落在你的桌案上，照亮一份未抄完的契书。\n隔壁的粥摊已摆出了第一锅热粥，蒸气混着柴香缓缓浮起。\n你是凡夫，不通修真，不识灵气；这世间的修士御剑入云，于你而言不过是天上传闻。\n但市井烟火，自有你的去处——账册要算，柴米要买，旁边卖花的少女今晨还托你带一壶酒。\n你整了整布袍，揣好沉甸甸的几枚铜钱，跨过门槛，迎着晨光踏入这熙攘的街市。\n凡人有凡人的活法。修真世界的风浪与你似远还近，但只要心里有秤，凡途亦能不亏己心。',tags:['特殊','纯凡']}],de=e=>e?me.find(t=>t.id===e):void 0;function pe(e,t){const n=e.constraints;if(!n)return!0;if(n.locationIds?.length&&(!t.locationId||!n.locationIds.includes(t.locationId)))return!1;if(n.regionIds?.length){if(!t.locationId)return!1;const e=U(t.locationId);if(!e.region||!n.regionIds.includes(e.region.id))return!1}if(n.性别&&t.性别!==n.性别)return!1;if(n.元阳元阴必须&&!t.元阳元阴)return!1;if(n.灵根五行任意?.length&&!t.root.elements.some(e=>n.灵根五行任意.includes(e)))return!1;if(n.灵根禁止?.length&&t.root.elements.some(e=
