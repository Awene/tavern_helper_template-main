山为林海中央拔起的圣峰，问道仙宗坐镇；天江下游穿林，东缘巨蕈林通东土。',tags:['古林','玄盟盟主','通东土'],kingdoms:[],sects:[{name:'问道仙宗',brief:'玄盟盟主，兼容诸道、万法可修；依古盟世代护持乾元圣朝；主镇天魔。',tags:['玄盟盟主','正道','万法']}]}]},{id:'reg-dongtu',name:'东土',description:'海上孤悬之自由海疆。西陲巨蕈菌海封死通往中原之陆路，唯余海路；东溟万岛千礁星罗，临渊城为跨域门户。境内宗门尽皆中立，世称“日出之地”。',children:[{id:'eco-dt-jujun',name:'巨蕈菌海',description:'西陲·孢雾屏障。擎天巨蕈连绵成海，孢雾终年弥漫、夜放幽光；封死东土通往中原之陆路，琉璃丹宗于此设采药营。',tags:['孢雾屏障','巨蕈','险地'],kingdoms:[],sects:[]},{id:'eco-dt-linyuan',name:'临渊水乡',description:'中部·河口水乡。悬河、天江于此交汇入海，泽国千回；临渊城建于水上，为各域跨海登陆之门户，青龙信仰中心。',tags:['河口水乡','自由港','跨域门户'],kingdoms:[{name:'临渊城',brief:'建于水上的超大型修仙城市·自由港，跨域门户，青龙信仰中心。',tags:['自由港','跨域门户']}],sects:[{name:'天衍楼',brief:'中立·情报枢纽，以阵法、符箓、卜算闻名，办“天衍大比”；居临渊城。',tags:['中立','术修','情报']},{name:'合欢宗',brief:'中立宗门，信阴阳交合、七情六欲乃通大道之根本；居临渊城（醉月楼）。',tags:['中立','双修']}]},{id:'eco-dt-liufang',name:'流芳岛',description:'东部·灵药仙岛。灵雾缭绕、四时如春，奇花异草仙植遍生；琉璃丹宗坐镇，凡间誉为“药王岛”。',tags:['灵药仙岛','丹道','中立'],kingdoms:[],sects:[{name:'琉璃丹宗',brief:'中立炼丹大宗，神陆最大丹药供应商；以药济世、以丹证道。',tags:['中立','丹道']}]},{id:'eco-dt-penglai',name:'蓬莱三仙岛',description:'东部远岛·隐世圣地。蓬莱、方丈、瀛洲三岛以虹桥相连，随灵潮时隐时现、凡舟难近；东土修真之巅。',tags:['隐世仙岛','剑修','上古仙宗'],kingdoms:[],sects:[{name:'蓬莱仙宗',brief:'隐世上古仙宗，清修问道、御剑参玄；东土修真之天花板。',tags:['中立','剑修','隐世']}]},{id:'eco-dt-shuanghua',name:'霜花岛',description:'东部·月华冰霜。海面薄冰铺展、霜花成簇如玉，月华灵蕴最盛；全女宗广寒宫隐于此。',tags:['冰霜月华','全女宗','中立'],kingdoms:[],sects:[{name:'广寒宫',brief:'中立全女宗，主修冰霜、太阴、月华，养女子元阴之力；与合欢宗为死敌。',tags:['中立','全女','冰霜']}]},{id:'eco-dt-biluo',name:'碧落珊瑚海',description:'东南·蔚蓝珊瑚海。珊瑚礁星罗、海岛百数，水下有鱼人珊瑚聚落；珠崖城与鱼人通商而富。',tags:['珊瑚海','鱼人通商','海珍'],kingdoms:[{name:'珠崖城',brief:'碧落珊瑚海缘之海珍贸易港城，与鱼人通商而富。',tags:['海珍港城']}],sects:[]},{id:'eco-dt-liexing',name:'列星海',description:'东溟中央·散修海疆。千岛万礁星罗，海商、海寇行舟其间；聚仙城散修坊市与扶桑城东瀛海邦并立。',tags:['散修海疆','万岛千礁','法外坊市'],kingdoms:[{name:'聚仙城',brief:'列星海中散修坊市大城，鱼龙混杂、法外自由，黑市情报之渊薮。',tags:['散修坊市','法外']},{name:'扶桑城',brief:'东瀛风海岛城邦，信“诸天百神”，神社鸟居遍布、剑士民风。',tags:['东瀛海邦','神道']}],sects:[]}]},{id:'reg-beijing',name:'北境',description:'草原、苔原、冰川峡湾与极北沙漠并存；愈北愈寒，凡国凡修各踞一隅。',children:[{id:'eco-bj-xuesong', '热带雨林','蛊毒','道盟'],kingdoms:[{name:'百越国',brief:'部落联邦南境，蛇方·鬼方·母方三部，被五毒教实际控制、充作凡人来源。',tags:['部落联邦','南境']}],sects:[{name:'五毒教',brief:'道盟成员，淬毒炼蛊、驭世间万毒之大宗，居神木殿。',tags:['道盟','蛊毒']}]},{id:'eco-nj-cuiyu',name:'翠玉丘',description:'北部·亚热带丘陵·灵泉密布。地脉异变天成万灵熄窟与化兽渊；千形宗造物殿据此繁育畸兽，百越北四部世代采药、御灵兽为生。',tags:['亚热带丘陵','活体改造','道盟'],kingdoms:[{name:'百越国',brief:'部落联邦北境，凤翎·雀羽·兽鸣·翠灵四部，世代采药御兽，受千形宗盘剥。',tags:['部落联邦','北境']}],sects:[{name:'千形宗',brief:'道盟成员，繁育畸变魔兽、活体改造之大宗，居造物殿；近百年强势崛起。',tags:['道盟','改造','畸兽']}]},{id:'eco-nj-shiwan',name:'十万大山',description:'西南·原始山脉·妖族禁地。万妖盟七族盘踞，凡国不入；与道盟平级、互不侵犯。',tags:['原始山脉','妖族禁地','万妖盟'],kingdoms:[],sects:[{name:'万妖盟',brief:'妖族独立联盟，无盟主、七族共治；与道盟平级、互不侵犯。',tags:['妖族','联盟','禁地']}]},{id:'eco-nj-yongheng',name:'永恒谷',description:'中南·死气谷地。幽冥府通幽阁立于谷心九幽泉；大祀王朝大祀城建于谷口，为道盟附属国之都畿。',tags:['死气谷地','亡灵','道盟','神权奴隶'],kingdoms:[{name:'大祀王朝',brief:'残酷神权奴隶王朝，幽冥府公开附属；都畿大祀城建于永恒谷边缘。',tags:['神权奴隶','幽冥府附属']}],sects:[{name:'幽冥府',brief:'道盟成员，摄死气、炼尸傀之大宗，居通幽阁；大祀王朝宗主。',tags:['道盟','亡灵']}]},{id:'eco-nj-yunmeng',name:'云梦泽',description:'东部·楚地大泽·王朝腹心。楚天王朝郢都建于泽中水上宫殿；湘灵阁九歌殿即道盟议事中枢。',tags:['湿地大泽','楚巫','道盟中枢'],kingdoms:[{name:'楚天王朝',brief:'楚地巫祝王朝、湘灵阁附庸；君王治政、大祝司神，都郢城建于云梦泽腹心。',tags:['王朝','楚巫','道盟附庸']}],sects:[{name:'湘灵阁',brief:'道盟盟主，上古巫族失落血裔之大宗，居九歌殿；楚天王朝宗主，大祝由阁中指派。',tags:['道盟','盟主','巫族']}]},{id:'eco-nj-jinxiu',name:'锦绣稻乡',description:'中北·楚天粮仓。千里梯田与平原，灵稻三季；楚天稻官府掌粮政，凡修稀少。',tags:['粮仓','稻田','楚天'],kingdoms:[{name:'楚天王朝',brief:'王朝西境粮仓，稻官府主理粮政；大祝行宫坐镇稻祭。',tags:['王朝','粮仓']}],sects:[]},{id:'eco-nj-shenmu',name:'神木莽原',description:'西中·上古神木林·树灵禁地。半开灵智的主神木盘踞林心；凡修不入，凡国无染。',tags:['上古神木','树灵禁地','无主'],kingdoms:[],sects:[]},{id:'eco-nj-zhusui',name:'朱髓孤屿',description:'远海·异种植物孤岛·大祀圣地。岛中央龙骸谷为大祀活祭祭场；朱髓木、瓶腹木、灵脂香独此一岛。',tags:['远海孤岛','异种植物','大祀飞地','祭地'],kingdoms:[{name:'大祀王朝',brief:'远海圣岛，纵目祭师团驻守；活祭船团每年押送奴隶上岸至龙骸谷。',tags:['王朝飞地','祭地']}],sects:[]}]},{id:'reg-xiyu',name:'西域',description:'西临海，中多荒漠，东有无垠雪山纵贯南北；西有古波斯式王朝，东有上古羲皇古朝。',children:[{id:'eco-xy-rouwfeng',name:'柔风海湾',description:'西·温带海岸+港湾。柔风港万商云集；圣火塔常燃，胡商海船与商道古碑并存。',tags:['海港','商道','祆教'], ',label:'灵气上限',type:'number',group:'资源池',formula:'coef',coefRange:[.5,.5]},{key:'遁速',label:'遁速',type:'number',group:'资源池',formula:'coef',coefRange:[.5,2]},{key:'防御力',label:'防御力',type:'number',group:'数值',formula:'coef',coefRange:[0,.2]}],灵兽:[{key:'气血',label:'气血上限',type:'number',group:'资源池',formula:'coef',coefRange:[5,15]},{key:'灵气',label:'灵气上限',type:'number',group:'资源池',formula:'coef',coefRange:[.5,.5]},{key:'遁速',label:'遁速',type:'number',group:'资源池',formula:'coef',coefRange:[.5,2]},{key:'防御力',label:'防御力',type:'number',group:'数值',formula:'coef',coefRange:[0,.2]}]},se=new Set(['傀儡','灵兽']),le=[0,.3],ae={炼气:1,练气:1,筑基:2,金丹:3,元婴:4,化神:5},ce={凡:0,黄:.25,玄:.5,地:.75,天:1};function ie(e){return ae[e]??1}function re(e){return ce[e]??0}function ue(e,t,n){const o='percent'===e.type?'%':'';if('d20'===e.formula){const e=Math.max(1,Math.floor(t/2+2*n));return{min:e,max:e,suggested:e,fixed:!0,unit:o}}if('pct'===e.formula){const e=Math.max(0,Math.floor(5*t+20*n));return{min:e,max:e,suggested:e,fixed:!0,unit:o}}if('coef'===e.formula&&e.coefRange){const[s,l]=e.coefRange,a=Math.pow(10,t),c=1+n,i=Math.max(0,Math.floor(a*s*c)),r=Math.max(0,Math.floor(a*l*c));return{min:i,max:r,suggested:Math.max(0,Math.floor(a*((s+l)/2)*c)),fixed:i===r,unit:o}}return null}function me(e,t){return!(!t||t.fixed)&&e>t.max}const de=[{id:'story-zayou',name:'入宗试灵',subtitle:'测灵根，定门第',desc:'入宗大典之日，于测灵盘前验灵根深浅；宗门据灵根优劣分派内门、外门，资质上佳者更得长老收为亲传、择师而授。',cost:0,glyph:'试',recommend:'寻常修行 / 砺心问道',类型:'宗门',constraints:{灵根禁止:['无']},settings:{时间:{年:7203,月:1,日:5,时辰:'辰时'},宗门:'入宗受试·待分派门第',初始境界:{大境界:'炼气',小境界:'初期'}},body:'入宗大典之日，测灵广场上人头攒动。\n你随着一众怀揣憧憬的少年男女鱼贯而入，广场中央立着一座古朴的青玉测灵盘，盘面五色微光流转不定。\n司礼执事立于盘侧，唱名声此起彼伏：「灵根驳杂，分入外门，充作杂役——」「真灵入品，外门亲传——」「上品灵根，内门嫡传，长老择徒而授——」\n每一声唱报都牵动着阶下众人的呼吸：被点入内门者喜形于色，落入外门者亦如蒙大赦，唯有测不出灵根者，黯然退场。\n终于轮到你。执事抬眼扫了你一眼，淡淡道："上前，将手按在盘心，凝神，莫要分心。"\n你深吸一口气，缓步上前，将掌心轻轻覆上那温润微凉的玉盘——'},{id:'story-yinyu',name:'隐玉初识',subtitle:'于市井间结识高人',desc:'本欲只在市井度日，却于茶肆偶遇游方仙师，赠你一卷残页。',cost:0,glyph:'机',recommend:'寻常修行',类型:'散修',constraints:{灵根禁止:['无']},settings:{时间:{年:7156,月:11,日:12,时辰:'酉时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'你正坐在茶肆角落，看着雪粒打在窗棂上发呆。\n邻桌一位灰衣老者忽然冲你笑了笑：\n"小友与剑有缘。"\n他随手在桌上推过一卷油黄的残页，又自顾自饮尽杯中酒，转眼便消失在风雪中——'},{id:'story-fuchou',name:'血门遗孤',subtitle:'负仇前行',desc:'门派在魔修夜袭中被屠尽，只你一人带着师门信物逃出生天。',cost:0,glyph:'仇',recommend:'砺心问道 / 逆天改命',类型:'散修',constraints:{灵根禁止:['无']},settings:{时间:{年:7188,月:7,日:22,时辰:'寅时'},宗门:'散修（前 · 雾隐山门）',初始境界:{大境界:'炼气',小境界:'后期'}},body:'山门毁于一夜之间。\n你伏在血泥里装死，听着师姐的最后一声怒吼，听着那道沉重的拐杖从身边经过。\n直到一切归于死寂。\n你紧紧攥着那枚被血浸透的玉牌，在黎明前从断壁残垣中爬出来——',tags:['仇怨']},{id:'story-dadao',name:'已悟大道',subtitle:'前世今生',desc:'你似乎记得前世种种。一切尚未开始，便仿佛已是结局。',cost:0,glyph:'道',recommend:'小道悠游',类型:'特殊',settings:{时间:{年:7301,月:3,日:3,时辰:'卯时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'你在朝霞中睁开眼。\n窗外是再熟悉不过的灵溪，远处晨钟敲响——\n这一切，你似乎在某个梦里见过千百次。\n你抬手轻抚胸口的玉牌，那里仿佛还残留着上一世火焚之后的余温——',tags:['传说']},{id:'story-tianxuan-zayou',name:'万剑坪 · 剑师赠石',subtitle:'风雪中的萍水之缘',desc:'天玄剑宗杂役弟子，于万剑坪扫雪时偶遇剑脉传人墨诗行奉命下山历练；临行前她留下一枚下品灵石。',cost:0,glyph:'剑',recommend:'砺心问道',类型:'宗门',constraints:{locationIds:['eco-xy-wuyan'],灵根禁止:['无']},settings:{时间:{年:7204,月:12,日:18,时辰:'辰时'},宗门:'天玄剑宗（外门杂役）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'天玄剑宗宗门广场，万剑坪上积了一层新霜，几名杂役弟子正低头清扫，你就在其中。\n宗主莫决云立在大殿前的石阶上，负手而立，灰白长衫随风飘荡；剑脉传人墨诗行一袭玄青剑袍，独立于万剑坪中央，长剑斜引残雪，凝立不动，仿佛已在这风雪里站了整整一夜。\n"一夜未收势，那一剪，可有「诗」了？"莫决云的声音不大，却清晰传遍整个万剑坪，隐隐压过呼啸的风声。\n墨诗行缓缓收剑入鞘，墨眸清冷，望着漫天风雪，声音很淡。\n"回师尊，还差一分。这一剪弟子练了三年，招已至极，剑里却始终少一口气——不是不够利，是没有诗。"\n莫决云眉头微不可察地一动，袖袍轻拂，将她身旁三尺积雪荡开，她却连眼也未眨。\n"闭死在山上，剑意反被磨钝了。今日起，你下山历练去——去人间寻你那一口「诗」，寻不到，便不必回宗。"\n墨诗行怔了一瞬，随即端正行了一礼，声音依旧清冷，却比方才多了一分郑重，"弟子……领命。"\n她转身向山门走去，长发束得极高，背上长剑映着雪光，玄青剑袍掠过一地素白。行至你身边，脚步无端顿了一顿。\n她垂眸看了看你冻得发红的手，又看了看你脚下那一小片被扫得干干净净的雪地，墨眸里掠过一丝极淡的东西。\n"一处一处，扫得不厌，这也是剑意。"墨诗行说着，从袖中取出一枚下品灵石，轻轻搁进你掌心，"心沉得下来，扫帚也能通道。这枚，权当谢你让我看了这一片干净的雪地。"\n语尽，她不再多言，足尖轻点，掐诀御剑而起，一道青光没入风雪，转瞬不见。'},{id:'story-lingfeng-yueye',name:'回音谷 · 月下合奏',subtitle:'初入聆风斋的雅会',desc:'入聆风斋不久，月夜独抚琴于回音谷，恰遇手持玉笛的夏未央，二人合奏一曲。',cost:0,glyph:'琴',recommend:'小道悠游 / 寻常修行',类型:'宗门',constraints:{locationIds:['eco-bj-nanfeng'],灵根禁止:['无']},settings:{时间:{年:7212,月:8,日:16,时辰:'亥时'},宗门:'聆风斋',初始境界:{大境界:'炼气',小境界:'初期'}},body:'夜色稍沉，一弯新月挂在回音谷的夜空；水汽氤氲，濡湿了岸边的青苔。\n你坐于河边石上，膝上横着古琴，指尖勾挑，并无定谱，只随风势起落。泠泠七弦，偶尔惊起栖息在芦苇荡中的几只水鸟，水鸟振翅掠过水面，摇散月光点点。\n忽有笛声自林梢落下，那笛音清越，不争不抢，只轻轻填补琴音将歇的空隙，留住了那将要散去的余韵。\n你按住琴弦，抬眼望去，林间小径转角处，一袭淡藕色纱裙随风微动。来人手持一支玉笛，笛身通体洁白，惟有末端坠着明黄流苏。\n"扰了道友雅兴，方才听这琴音，似有江流宛转绕芳甸之意，却又多了几分随性。道友是新入斋的？"\n你起身，向女子拱手一礼，"在下你，初入聆风斋，见此地月色正好，情难自禁，不想惊动了师姐。"\n那女子行至水边，并未站在高处受礼，而是在一旁的青石上坐下，将玉笛横在膝头。\n"万物有声，这水浪拍岸是声，虫鸣鸟叫是声，道友的琴音自然也是声，既然都在这天地间，那便算不得惊扰。"\n"我方才在林中，听道友琴中似有未尽之意，恰好我有支曲子也缺了些许意境，不知道友可愿合奏一曲？"\n你重新落座，双手抚上琴弦，无需言语确认调式，指尖落下，便是回应。\n琴音起时如山涧滴泉，清冽透亮；笛声随之而入，绵长悠远，似风过松林。\n曲终，余音散入风中，水面复归平静。\n"今夜的风，倒是比往日柔和了些。"夏未央轻抚笛身，站起身来，理了理被风吹乱的鬓发。\n"若是道友喜欢此地，往后也可常来。聆风斋夏未央，记下了道友今夜的琴。"'},{id:'story-liuli-baicao',name:'百草峰 · 药园新邻',subtitle:'与赵芳萤同顷锄药',desc:'琉璃丹宗外门弟子，于百草峰偏角药园锄药；隔壁新搬来一位怯生生的小师妹赵芳萤。',cost:0,glyph:'丹',recommend:'寻常修行',类型:'宗门',constraints:{locationIds:['eco-dt-liufang'],灵根禁止:['无']},settings:{时间:{年:7197,月:4,日:9,时辰:'辰时'},宗门:'琉璃丹宗（外门杂役）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'流芳山脉绵延几百里，晨辉破云，金光洒落百草峰，峰顶云蒸霞蔚，隐约可见有内门弟子御物在天，或坐于葫芦、或立于飞剑，但那都是与杂役无缘的风景。\n琉璃丹宗，百草峰，集中种植低阶灵草灵药的区域，其中一片小药园。\n你提起锄头歇息片刻，直起腰，炼气初期的灵气在经脉里转了小半周天，消解了些许疲乏。这块药田便是其在琉璃丹宗的一亩三分地，种的皆是炼气期丹药的基础辅材。\n隔壁那荒废了大半个月的小药园，今日有了动静。\n竹篱那边，一名看上去豆蔻年华的少女，身上的杂役布袍宽大了些许，袖口挽了几道，露出细瘦的手腕。她半蹲在土地上，对着刚栽下去有些蔫头耷脑的草药比划。\n"绿高高，这里的土很软和，你要争气，把根扎深点。"\n声音顺着晨风飘过竹篱，落入你耳中。那少女并未察觉旁人目光，只是从沟渠舀起少许泉水，淋给草药。\n"喝了水就不许枯了，等你长出新叶子，我就喊你绿壮壮。"\n你手中锄头轻顿，碰上一块硬土，发出了响声，少女转头，眸子里映出你提着锄头的身影。\n她连忙站起身来，双手在身前交叠，朝着你深深行了一礼，因为动作太急，头顶那条用来束发的粗布条歪了一些，几缕碎发散在额前。\n"前、前辈好。"她头垂得很低，露出白净纤细的后颈，声音有些发怯，"我是新来这块药田的赵芳萤，若是吵到前辈修行，还请前辈恕罪。"'},{id:'story-nanjiang-fox',name:'十万大山 · 邂逅狐妖',subtitle:'采药途中偶入仙芝幽谷',desc:'为寻"灵山仙芝"在十万大山边缘盘桓数日，误入幽谷，遇见正对木桩独自练习答词的青丘狐族少女苏凝香。',cost:0,glyph:'狐',recommend:'寻常修行 / 砺心问道',类型:'散修',constraints:{regionIds:['reg-nanjiang'],灵根禁止:['无']},settings:{时间:{年:7220,月:6,日:1,时辰:'辰时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'中期'}},body:'晨曦微露，南疆特有的湿热水汽尚未完全散去，在林间凝成轻纱般的薄雾。\n你身负竹篓，脚穿皮靴，踏入幽深的小径，这里人迹罕至，寻常采药人不敢涉足，但你为了寻找那传闻中的"灵山仙芝"，已在十万大山边缘盘桓了数日。\n你拨开眼前遮蔽视线的阔叶，视野豁然开朗，前方是一处静谧的幽谷，谷中溪水潺潺，两岸开满了不知名的野花，随风摇曳，落英缤纷。花丛中央，坐着一位身着浅粉襦裙的少女，她背对着你，正对着一根木桩念念有词。\n"公子大恩，小女子无以为报，惟有……"少女声音稍顿，歪了歪头，似在回忆什么，随后换了一种语调，略带娇羞，"惟有以身相许，愿随君走遍天涯海角。"\n你不慎踩断了一截枯枝，咔嚓轻响，在这静谧幽谷中显得尤为突兀。\n少女身形微颤，蓦然回首，面容娇憨，双颊晕红，溪水般清澈的眼眸中带着些许惊慌。\n"你是谁？你是......来这里赏风景的吗？"\n你拱手一礼，"在下你，乃山中采药之人，误闯姑娘……清修之地，多有得罪，还望见谅。"\n少女闻言，眼中警惕稍退，取而代之的是好奇，似在确认对方的善意。\n"采药人……"她低声重复，随即起身，笨拙地回了一礼，"小女子苏凝香，这厢有礼了。"'},{id:'story-wudu-init',name:'走出瘴林 · 万毒祖窟',subtitle:'入门测验中的一场豪赌',desc:'于雨瘴林中参加五毒教入门测验，饥寒交迫、四下皆毒；走投无路吞下一枚《百毒经》未载的五彩怪果，醒来识海凭空多了一门神识蛊法，与一句唤你前往"万毒祖窟"的低语。',cost:0,glyph:'蛊',recommend:'砺心问道 / 逆天改命',类型:'特殊',剧情:!0,constraints:{locationIds:['eco-nj-yuzhang'],灵根禁止:['无'],门派归属:['','散修','五毒教']},settings:{时间:{年:7231,月:4,日:9,时辰:'巳时'},宗门:'五毒教（入门试炼）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'雨瘴林深处，湿热的瘴气黏在皮肤上，久久不散。\n这是五毒教入门测验的最后一关——独自走出这片吃人的林子。已是第三日，你炼气初期那点微薄的灵气早被瘴毒磨得所剩无几，饥火与寒意一齐啃着五脏六腑。\n偏偏这林中"食物"并不算少：紫红的浆果、肥厚的菌伞、爬满藤蔓的甜藕……你翻开随身那卷《百毒经》一一比对，翻到最后，指尖发凉——无一例外，全是剧毒。原来这一关考的从不是"能不能找到吃的"，而是"明知有毒，你敢不敢碰"。\n就在你几乎要倒下去的时候，一丛腐叶间露出一枚拳头大的果子，五彩斑斓、流转着近乎妖异的光泽。你翻遍《百毒经》，从头到尾——竟没有半个字提到它。\n未载于经，便是未知；未知，便是不知死活。可你也确实，再没有别的路了。\n你盯着那枚怪果看了很久，终于闭上眼，一口咬了下去——赌这一把。\n意识坠入无边的黑。\n……\n再睁眼时，天光已亮。饥寒尽退，那点被磨尽的灵气竟也悄然复原，四肢百骸说不出的通泰，仿佛什么东西在体内被彻底洗过一遍。\n只是——你的识海里，凭空多了一门功法。它的名字自己浮上心头：《噬心蛊经》。神识为针，种蛊噬心，诡异得与《百毒经》里任何一页都不相干。\n而在识海深处，一段沙哑而遥远的低语，正贴着神魂反复回响，挥之不去——\n"来……万毒祖窟……找我……"\n你摸了摸怀里那块入门时宗门发下的司南之石——它一如往常，只认得南北，却半点指不出那"万毒祖窟"在何方。',tags:['五毒教','奇遇']},{id:'story-hehuan-yuanyang',name:'鸳鸯池 · 合欢宗入门',subtitle:'欢媚殿后初见双修场',desc:'被人劝入合欢宗，腰牌未热，便被引至鸳鸯池畔——温泉氤氲，琼浆四溢，初识"合欢双修"之名。',cost:0,glyph:'合',recommend:'小道悠游 / 寻常修行',类型:'宗门',constraints:{locationIds:['eco-dt-linyuan'],灵根禁止:['无']},settings:{时间:{年:7245,月:3,日:28,时辰:'戌时'},宗门:'合欢宗',初始境界:{大境界:'炼气',小境界:'中期'}},body:'天色已暗，华灯初上。数百盏绯色宫灯高悬，将腾起的袅袅热气染成暧昧的粉红。空气中弥漫着甜腻异香，如兰似麝，只稍稍吸入肺腑，便觉腹热气躁。\n你手里捏着刚领到的腰牌，还未从被人劝进此地的经历中回过神来。身后是通往欢媚殿的回廊，眼前是一幅活色生香的画卷。\n此处，合欢宗大浴场，唤作鸳鸯池——起名倒是直白，放眼望去，哪里是什么修仙福地，分明是毫无遮掩的欢场。温热泉水中，无数晶莹剔透的肉体各自纠缠——这里不仅是沐浴之地，更是合欢宗弟子的修炼场。\n你视线稍偏，便又见池水中的某处玉台，数名女修围坐一圈，中间躺着一位面色潮红的俊秀青年。\n"这就是新入门的小师弟？元阳倒是充沛得紧……让师姐们好好尝尝。"\n"这就是……修仙？"你喃喃自语，声音很快就被周遭此起彼伏的浪叫声淹没。\n乳白色的温泉，泛着暖意的迷蒙水雾，不远处的水床上，许多不着寸缕的少男少女正在嬉戏。',tags:['合欢']},{id:'story-fan-zhigen',name:'巷尾灯火 · 后天植根',subtitle:'凡夫之身偶遇仙缘',desc:'凡人之身，偶遇一位流落街巷的老叟。彼此有缘之下，老叟以一门近乎失传的秘法为你接续灵根，自此踏上修真路。',cost:0,glyph:'续',recommend:'寻常修行 / 砺心问道',类型:'特殊',constraints:{physiqueTier:['凡体']},settings:{时间:{年:7268,月:10,日:7,时辰:'亥时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'夜雨敲檐，巷尾的旧屋灯火微弱。\n你替母亲煎完了药，正欲熄灯，门口忽地传来轻而沙哑的咳声——一名衣衫褴褛的老叟扶着门框，似乎已撑不住身子。\n"小友……一碗清水……一处避风之所，可乎？"\n你让出门来，老叟入屋，跌坐在炕沿，借着灯光，他抬起一双竟未浑浊的眸子，仔细打量了你半晌。\n"你命中无根，本不可修。然——老朽身怀一门接续灵根的秘法，已无来日施展。今夜你引我入屋，便是因缘。"\n他从怀中摸出一截枯瘦如柴的指头，指尖结着一缕灰白的灵气，伸至你眉心。\n"忍住灼意，七寸气海若开，从此凡尘不复你归处。"\n一道温热自眉心直贯丹田。窗外的雨声渐远，屋内的烛火忽然明亮起来——\n凡夫之躯，自此续上仙缘。',tags:['特殊']},{id:'story-fan-renjian',name:'粟米人间 · 纯凡之路',subtitle:'不入修真路',desc:'不入修真之列，安守凡人本分；于市井间度日，于沙场上历劫。凡躯亦能见识修真世道。',cost:0,glyph:'俗',recommend:'砺心问道 / 逆天改命',类型:'特殊',constraints:{physiqueTier:['凡体']},settings:{时间:{年:7222,月:5,日:18,时辰:'巳时'},宗门:'散修',初始境界:{大境界:'凡人',小境界:'初期'}},body:'熹微之光透过窗纸落在你的桌案上，照亮一份未抄完的契书。\n隔壁的粥摊已摆出了第一锅热粥，蒸气混着柴香缓缓浮起。\n你是凡夫，不通修真，不识灵气；这世间的修士御剑入云，于你而言不过是天上传闻。\n但市井烟火，自有你的去处——账册要算，柴米要买，旁边卖花的少女今晨还托你带一壶酒。\n你整了整布袍，揣好沉甸甸的几枚铜钱，跨过门槛，迎着晨光踏入这熙攘的街市。\n凡人有凡人的活法。修真世界的风浪与你似远还近，但只要心里有秤，凡途亦能不亏己心。',tags:['特殊','纯凡']}],pe=e=>e?de.find(t=>t.id===e):void 0;function ye(e,t){const n=e.constraints;if(!n)return!0;if(n.locationIds?.length&&(!t.locationId||!n.locationIds.includes(t.locationId)))return!1;if(n.regionIds?.length){if(!t.locationId)return!1;const e=Q(t.locationId);if(!e.region||!n.regionIds.includes(e.region.id))return!1}if(n.性别&&t.性别!==n.性别)return!1;if(n.元阳元阴必须&&!t.元阳元阴)return!1;if(n.灵根五行任意?.length&&!t.root.elements.some(e=>n.灵根五行任意.includes(e)))return!1;if(n.灵根禁止?.length&&t.root.elements.some(e=>n.灵根禁止.includes(e)))return!1;if(n.灵根品阶?.length){const e=b(t.root);if(!n.灵根品阶.some(t=>e.includes(t)))return!1}return!(n.physiqueTier?.length&&!n.physiqueTier.includes(t.physique.tier))&&!(n.门派归属?.length&&!n.门派归属.includes(t.门派归属??''))}function ge(e){return''===e?'无':'散修'===e?'散修':`${e}弟子`}function fe(e){if(!e)return[];const t=[];if(e.locationIds?.length){const n=e.locationIds.map(e=>R(e)?.name).filter(Boolean);n.length&&t.push(`出生地：${n.join('
