r\n          来源: string;\r\n        }\r\n      }\r\n    check:\r\n      - 详见<rule ref="状态规则"/>\r\n  功法: &cultivation\r\n    type: |-\r\n      {\r\n        [功法名称: string]: {\r\n          使用中: boolean; # 由外部脚本处理,禁止修改\r\n          *quality\r\n          *RealmName\r\n          *elements\r\n          类型: \'心法\'|\'攻击\'|\'幻术\'|\'神识\'|\'咒法\'|\'身法\'|\'护体\'|\'阵法\';\r\n          *cost\r\n          *label\r\n          *utility\r\n          描述: string;\r\n        }\r\n      }\r\n    check:\r\n      - 仅在更换功法时更新\r\n  灵石: &cash\r\n    type: number\r\n    check:\r\n      - 默认兑换为下品灵石计算\r\n      - 交易、拾取、消耗时更新数量\r\n  物品: &item\r\n    type: |-\r\n      {\r\n        [物品名: string]: {\r\n          *quality\r\n          *RealmName\r\n          类型: \'秘籍\'|\'配方\'|\'符箓\'|\'丹药\'|\'素材\'|\'工具\';\r\n          *cost\r\n          *elements\r\n          *label\r\n          数量: number;\r\n          *utility\r\n          描述: string;\r\n        }\r\n      }\r\n    check:\r\n      - 交易、拾取、消耗时更新\r\n      - 数量为0时移除该key\r\n      - 严禁把武器/防具/饰品写入物品，它们应写入 *装备*\r\n      - 类型必须是上述枚举之一；无法归类的杂物不写入变量\r\n  装备: &equipment\r\n    type: |-\r\n      {\r\n        [装备名: string]: {\r\n          *quality\r\n          *RealmName\r\n          类型: \'法宝\'|\'护甲\'|\'饰品\';\r\n          *cost\r\n          *elements\r\n          *label  # 法宝→[攻击力:N]、护甲→[防御力:N]\r\n          *utility\r\n          描述: string;\r\n          位置: string; #装备位于身体上的位置,如:上装、下装、饰品、手部、储物袋等\r\n        }\r\n      }\r\n    check:\r\n      - 交易、拾取、消耗、赠送时更新\r\n      - 武器(剑/刀/枪/弓/扇/法器/飞剑等) → 类型=\'法宝\',攻击力为数字\r\n      - 衣物(道袍/护甲/护腕/腰带等) → 类型=\'护甲\',防御力为数字\r\n      - 戒指/项链/玉牌/玉佩/储物袋 → 类型=\'饰品\'\r\n      - 类型必须是上述枚举之一,禁止写"武器""杂物"等枚举外的值\r\n  "${傀儡|灵兽}": &combat_unit\r\n    type: |-\r\n      {\r\n        [名称: string]: {\r\n          使用中: boolean; # 由外部脚本处理,禁止修改\r\n          *quality\r\n          *RealmName\r\n          *elements\r\n          *label\r\n          描述: string;\r\n          资源池: *resource_pool\r\n          防御力: number;\r\n          技能: {\r\n            [技能名: string]: {\r\n              攻击力: number;\r\n              *cost\r\n              *utility\r\n            };\r\n          };\r\n        }\r\n      }\r\n    check:\r\n      - 获得/炼制/购买/捕获时添加\r\n      - 损毁/遗失/出售/死亡时移除\r\n  关系列表:\r\n    type: |-\r\n      # 关系列表条目以 类型 区分:\'人物\'(NPC) / \'傀儡\' / \'灵兽\' (后两者代表无主战斗单位,如野生妖兽、遗弃傀儡等)\r\n      {\r\n        [名称: string]:\r\n          # === 类型=\'人物\' (NPC) ===\r\n          | {\r\n              类型: \'人物\';\r\n              在场: boolean;\r\n              种族: *race\r\n              身份: *status\r\n              修炼进度: *realmDetails\r\n              寿元: *age\r\n              灵根: *root\r\n              体质: *body\r\n              技艺: *skill\r\n              资源池: *resource_pool\r\n              状态效果: *buff\r\n              功法: { [功法名称: string]: *cultivation };\r\n              灵石: *cash\r\n              物品: { [物品名: string]: *item };\r\n              装备: { [装备名: string]: *equipment };\r\n              ${傀儡|灵兽}: { [名称: string]: *combat_unit };\r\n              性格: string;\r\n              外貌: string; # 实质变化时更新\r\n              着装: string; # 更衣时更新\r\n              道侣: boolean; # 是否为<user>的道侣\r\n              好感度: number; # -100~100,变化区间±5,重大事件±10,初始值-30~30\r\n            }\r\n          # === 类型=\'傀儡\'|\'灵兽\' (无主战斗单位) ===\r\n          | {\r\n              类型: \'傀儡\' | \'灵兽\';\r\n              在场: boolean;\r\n              *quality\r\n              *RealmName\r\n              *elements\r\n              *label\r\n              描述: string;\r\n              资源池: *resource_pool\r\n              防御力: number;\r\n              技能: {\r\n                [技能名: string]: {\r\n                  攻击力: number;\r\n                  *cost\r\n                  *utility\r\n                };\r\n              };\r\n              状态效果: *buff\r\n              好感度: number;\r\n            }\r\n      }\r\n    check:\r\n      - 类型=\'人物\': 角色出场（有<char_info>面板时）添加,死亡删除\r\n      - 类型=\'傀儡\'|\'灵兽\': 野生妖兽/无主傀儡 出场（有<item_info>面板时）添加\r\n      - 驯服流程: 驯服后从 关系列表 移除并以 *combat_unit 形式写     for (let i = 0; i < w; i++) tickets.push(item);\r\n  });\r\n  tickets.sort(() => 0.5 - Math.random());\r\n  const seen = new Set();\r\n  const result = [];\r\n  for (const t of tickets) {\r\n    if (result.length >= n) break;\r\n    if (!seen.has(t.name)) {\r\n      seen.add(t.name);\r\n      result.push(t);\r\n    }\r\n  }\r\n  return result;\r\n};\r\n\r\nconst _pickedNameStrategies = _weightedPickN(_nameStrategies, 2);\r\nconst _renderStrategy = s => {\r\n  const list = s.pool ? _pickN(s.pool, 4) : s.examples;\r\n  return `      • 【${s.name}】${s.desc}(如:${list.join("、")})`;\r\n};\r\n\r\nconst nameStrategies = `起名策略(仅参考,禁止生搬):\r\n${_pickedNameStrategies.map(_renderStrategy).join("\\n")}\r\n      • 禁止姓名直接关联职业`;\r\n_%>\r\n<rule name="角色生成规则">\r\n# 非<user>角色生成流程\r\n流程逻辑:\r\n  1. 触发: 在正文叙事中(禁止于正文开头生成);\r\n     - (A) NPC 人物: 除<user>外的任何主要角色**初次**登场(含化形)之时\r\n     - (B) 无主灵兽/傀儡: 野生妖兽/遗弃傀儡 出现/被发现 之时\r\n\r\n# === (A) NPC 人物生成 ===\r\n# 步骤一: 前置思考与计算\r\n\x3c!--\r\n/* 思考字数: 400~700token */\r\n  Step1_基础定位:\r\n    - <%= nameStrategies %>\r\n    - 境界定位: 依据当前场景、势力强度、剧情合理性确定大境界与小境界\r\n    - 根据<talent>确定灵根与体质;根据体质评级决定【三维总和(S)】->分配三维(强制列出分配结果)\r\n    - 决定毛色:体毛、瞳色,基于五行。颜色示例：<%= visualColorRef %>\r\n    - 分析衣着:[头部][文胸][内裤][袜类][上装][下装][外搭][足部][饰品]<%= clothingContent %>\r\n  Step2_资源计算 (强制列出完整算式):\r\n    - 气血上限 = floor( 10^L × (1 + 根骨×0.1) )\r\n    - 灵气上限 = floor( 10^L × (1 + 气感×0.1) )\r\n    - 遁速 = floor( 10^L × (1 + 根骨×0.02) )\r\n    - 初始现值 = 对应上限 (出场默认满状态)\r\n    - 天谴:\r\n      | 身份 | 基础天谴 |\r\n      | --- | --- |\r\n      | 正派 | 0 |\r\n      | 散修 | floor(10^(L-1) × 0.5) |\r\n      | 邪修 | floor(10^L × 0.5) |\r\n      | 极端罪业 | floor(10^L × 1~3) |\r\n    - 丹毒:\r\n      | 身份 | 基础丹毒 |\r\n      | --- | --- |\r\n      | 天骄 | 0 |\r\n      | 散修 | floor(10^(L-1) × 0.5~1) |\r\n      | 丹修/资质低下 | floor(10^L × 1~3) |\r\n  Step3_技艺初始值 (强制列出算式):\r\n    - 仅对角色身份/职业强相关的技艺赋予初始值,其余默认0\r\n    - 基准公式: floor( 10^L × 职业系数 )\r\n        核心专精职业 系数: 0.3~0.5\r\n        兼修         系数: 0.1~0.2\r\n        基本掌握     系数: 0.05\r\n    - 示例: 筑基期(L=2)炼丹师核心炼丹 = floor(100×0.4) = 40\r\n  Step4_人物携带装备道具 (强制列出算式):\r\n    - 分析人物身份层级,以及其功法、装备、傀儡/灵兽、消耗品各生成多少件，强制列出数量\r\n    | 身份层级 | 功法数量 | 装备数量 | 傀儡/灵兽数量 | 消耗品数量 | 品质区间 |\r\n    | :--- | :--- | :--- | :--- | :--- | :--- |\r\n    | 散修 | 2~3 | 1~2 | 0~1 | 0~1 | 凡~黄 |\r\n    | 精英修士 | 4~6 | 4~6 | 0~2 | 1~2 | 黄~玄 |\r\n    | 长老/圣子 | 4~6 | 6~8 | 0~2 | 1~2 | 玄~地 |\r\n    | 掌门/元老 | 4~6 | 6~8 | 0~3 | 1~3 | 地~天 |\r\n    - 灵石: floor( 10^(L+1) × rand(0.5~2.0))\r\n    - 功法生成优先级: 心法>攻击>护体>身法>其他，遵循<rule ref="物品功法生成规则"/>\r\n--\x3e\r\n\r\n# 步骤二: 面板模板\r\n  模板规则:若内容为空则不生成可省略键名;禁止英文翻译;仅 | 符号开头可写多行字符串;数组强制使用行内格式(如 [a, b] 严禁使用 - 换行);YAML格式注意缩进;括号内为填写指引,禁止输出括号及其内容本身; 符合字数规范;\r\n  插入位置:<gametxt>中此角色出场位置,禁止插入于<gametxt>外,每个角色单独生成一个独立面板\r\n  <char_info>\r\n  类型: 人物\r\n  姓名:\r\n  种族:\r\n  身份:\r\n  性格: |\r\n    (40~80token,与身份/境界无关,自由生成)\r\n  外貌: |\r\n    (80~150token,客观白描角色裸体状态,包括双眼、发色、四肢身材,女性无疤痕且描述女性性器（如<%= physiologicalDescription %>）,禁比喻、不评价)\r\n  着装: |\r\n    (60~120token,客观白描衣着搭配,复杂化丰富化,禁比喻、不评价)\r\n  背景故事: |\r\n    (80~150token,出身、如何踏上修行之路、修真经历)\r\n  寿元:\r\n    年龄: number\r\n    寿命: number\r\n    外观年龄: number\r\n  灵根:\r\n    名称: \r\n    灵根五行: [] (填写行内数组,例如 [水, 火])\r\n    灵根品阶: \r\n  体质:\r\n    名称:\r\n    描述:\r\n    悟性: number\r\n    根骨: number\r\n    气感: number\r\n    元阴/元阳: (并入体质;填写true或false,按角色性别保留元阴或元阳作为键名;无此性征则省略,mvu 处理时补 null)\r\n  修炼进度:\r\n    境界: (大境界加小境界,如:筑基中期)\r\n    当前进度: number (默认 0)\r\n    进度上限: number (= 10^L × 100)\r\n    天谴: number (默认 0,有罪业者酌情)\r\n    丹毒: number (默认 0,长期服丹/丹修者酌情)\r\n  技艺:\r\n    生产类:\r\n      炼丹: number\r\n      炼器: number\r\n      制符: number\r\n      驯兽: number\r\n      培育: number\r\n      医术: number\r\n    战斗类:\r\n      御物: number\r\n      咒法: number\r\n      幻术: number\r\n      阵法: number\r\n      神识: number\r\n      炼体: number\r\n  资源池:\r\n    气血:\r\n      现值: number\r\n      上限: number\r\n    灵气:\r\n      现值: number\r\n      上限: number\r\n    遁速: number\r\n  功法:\r\n    (填写功法名称):\r\n      使用中: true\r\n      品质:\r\n      境界:\r\n      五行:\r\n      类型: (心法|攻击|幻术|神识|咒法|身法|护体|阵法)\r\n      消耗:\r\n      标签: []\r\n      效果:\r\n        (填写效果名): (填写效果描述,单行)\r\n      描述:\r\n  物品:\r\n    (填写物品名称):\r\n      品质:\r\n      境界:\r\n      类型: (秘籍|配方|符箓|丹药|素材|工具)\r\n      五行:\r\n      标签: []\r\n      数量: number\r\n      效果:\r\n        (填写效果名): (填写效果描述,单行)\r\n      描述:\r\n  装备:\r\n    (填写装备名称):\r\n      品质:\r\n      境界:\r\n      类型: (法宝|护甲|饰品)\r\n      五行:\r\n      消耗: (无消耗时省略此键)\r\n      标签: [] (法宝→[攻击力:N];护甲→[防御力:N];饰品按需)\r\n      效果:\r\n        (填写效果名): (填写效果描述,单行)\r\n      描述:\r\n      位置: (手部|上装|下装|头部|足部|文胸|内裤|袜类|外搭|腰间|项链|戒指|储物袋)\r\n  傀儡:\r\n    (填写傀儡名称):\r\n      品质:\r\n      境界:\r\n      五行:\r\n      标签: []\r\n      描述:\r\n      资源池:\r\n        气血:\r\n          现值: number (= 上限)\r\n          上限: number (= floor(10^L × (0.5~1) × (1+Q)))\r\n        灵气:\r\n          现值: number\r\n          上限: number (= floor(10^L × 0.5 × (1+Q)))\r\n        遁速: number (= floor(10^L × (0.5~2) × (1+Q)))\r\n      防御力: number (= floor(10^L × (0~0.2) × (1+Q)))\r\n      技能:\r\n        (填写技能名):\r\n          攻击力: number (= floor(10^L × (0~0.3) × (1+Q)))\r\n          消耗: (灵气:N|气血:N|无)\r\n          效果:\r\n            (填写效果名): (填写效果描述,单行)\r\n  灵兽:\r\n    (填写灵兽名称):\r\n      品质:\r\n      境界:\r\n      五行:\r\n      标签: []\r\n      描述:\r\n      资源池:\r\n        气血:\r\n          现值: number (= 上限)\r\n          上限: number (= floor(10^L × (5~15) × (1+Q)))\r\n        灵气:\r\n          现值: number\r\n          上限: number\r\n        遁速: number\r\n      防御力: number\r\n      技能:\r\n        (填写技能名):\r\n          攻击力: number\r\n          消耗:\r\n          效果:\r\n            (填写效果名): (填写效果描述,单行)\r\n  灵石: number\r\n  </char_info>\r\n\r\n# === (B) 无主灵兽/傀儡生成 ===\r\n# 步骤一: 前置思考与计算\r\n\x3c!--\r\n/* 思考字数: 150~250token */\r\n  Step1_境界与品质:\r\n    - 境界定位: 依据当前场景决定境界L、品质Q\r\n  Step2_数值计算 (强制列出算式,参考 *RULE_物品生成系数表):\r\n    - 气血上限 = floor(10^L × hp_coef × (1+Q))\r\n    - 灵气上限 = floor(10^L × 0.5 × (1+Q))\r\n    - 遁速 = floor(10^L × dun_coef × (1+Q))\r\n    - 防御力 = floor(10^L × def_coef × (1+Q))\r\n    - 技能攻击力 = floor(10^L × atk_coef × (1+Q))\r\n    - 技能数量: 凡/黄=1, 玄/地=2, 天=3\r\n  Step3_好感度:\r\n    - 好感度: 默认 0\r\n--\x3e\r\n# 步骤二: 面板模板\r\n  <item_info>\r\n    {实体名称}\r\n    | 类型: [傀儡|灵兽] |\r\n    | 品质: [凡|黄|玄|地|天] |\r\n    | 境界: [境界,如:炼气初期] |\r\n    | 五行: [金|木|水|火|土|阴|阳|混沌] |\r\n    | 标签: [野生|无主][其他描述性标签...] |\r\n    | 描述: [一句话特征,30~80字] |\r\n    {资源池}\r\n    | 气血: 现值[X] / 上限[Y] |\r\n    | 灵气: 现值[X] / 上限[Y] |\r\n    | 遁速: [X] |\r\n    {防御}\r\n    | 防御力: [X] |\r\n    {技能} (条数:凡/黄=1, 玄/地=2, 天=3)\r\n    | [技能名1] | 攻击力: [X] | 消耗: [灵气:N|气血:N|无] | 效果: [效果名: 效果]... |\r\n    | [技能名2] | ... | (按品质决定数量)\r\n  </item_info>\r\n\r\n</rule>\r\n<%_ } _%>'],['领悟规则','<rule name="领悟规则">\r\n# 参数声明：\r\n  L=境界系数 Q=品质系数 R=灵根系数\r\n  Vu = 角色基准值 = 10^角色L\r\n  Vt = 目标基准值 = 10^L\r\n  [Z%] = 相关增减益% (检定属性: 悟性)\r\n  [W] = 相关增减值 (检定属性: 悟性)\r\n\r\n# 核心触发条件: \r\n  激活: 1. <user>明确进行研读秘籍、参悟阵图、观摩石碑等行为\r\n\r\n# 第一阶段: 匹配、五行与进度限制\r\n  逻辑与规则:\r\n    1. 目标总进度 (Y):\r\n      - 实体秘籍/书卷: Y = max(1, ceil(L / 2)) \r\n      - 非秘籍类(石碑/影像/壁画/传功等): Y = 1\r\n    2. 进度上限锁 (Max_X):\r\n      - 公式: Max_X = max(0, Y - max(0, ceil(目标L - 角色L)))\r\n      - 说明: 研读比自己境界高的内容时，可读上限减少  \r\n    3. 五行相性补正 (E_mod):\r\n      - 判别目标五行属性(若无明确属性或残缺，默认判定为混沌)\r\n      - 若角色拥有与目标五行相同的灵根 -> 相性吻合，E_mod = 0.8\r\n      - 若角色无对应五行灵根(或目标为混沌而角色无混沌灵根) -> 相性排斥，E_mod = 1.2\r\n    4. 完整度补正: \r\n      [原本] 难度乘数 = 1.0；[抄本] 难度乘数 = 1.2；[残缺] 难度乘数 = 1.5  \r\n\r\n# 第二阶段: 参悟检定\r\n  逻辑与规则:\r\n    1. 消耗: 仅消耗时间(默认 2~4 个时辰)\r\n    2. 领悟能效 (P): \r\n      公式: P = floor( (Vu + [悟性]×10 + 关联[技艺]) × (1+[Z%]) ) + [W]\r\n    3. 参悟难度 (D):\r\n      公式: D = floor( Vt × (1+[Q系数]) × 完整度补正 × E_mod ) + d20\r\n    4. 差值结算 (Δ): Δ = P - D\r\n\r\n# 第三阶段: 结果判定与连带机制\r\n  根据差值 Δ 与 D 的比例，决定本次参悟结果：\r\n    - 参悟成功 (Δ ≥ 0): 进度 +1  \r\n      * 阶段奖励: 若更新后的 X < Y，获得少许感悟，对应[技艺]提升 Max(1, floor((Vt)×0.02)) 点，最大不可超过 [Max_S] = 10^(角色L + 1)\r\n      * 自动衔接: 若更新后的 X < Max_X，衔接下一轮参悟，输出下一轮检定，直到 X 达到 Max_X 或判定失败中止  \r\n    - 晦涩难明 (Δ < 0 且 Δ > -D × 0.5): 进度 +0 中止研读  \r\n    - 走火入魔 (Δ ≤ -D × 0.5 或 强行跨越2阶): 进度 +0 中止研读\r\n      * 惩罚结算: 扣除气血 floor(Vt × 0.2)，并获得负面状态[心神受创(悟性-5, 持续至治愈, 可叠加)]  \r\n\r\n# 第四阶段: 大成奖励分发\r\n  当进度 X = Y 时，该物品被彻底领悟，不可再获得进度，并依据类型发放最终奖励：\r\n    1. 境界限制规则(重要):\r\n       所有领悟生成的[功法]、[配方]、[秘法]，其最终境界(L)强制不可超过【角色当前境界L】  \r\n    2. 功法与技艺: \r\n       - 角色习得功法，格式遵循<rule ref="物品功法生成规则"/>\r\n       - 对应技艺提升 Max(1, floor((Vt/Vu) × 10)) 点，最大不可超过 [Max_S] = 10^(角色L + 1)\r\n    3. 生产技艺类 (丹方/器谱/阵图):\r\n       - 获得[配方]\r\n    4. 隐秘造化类 (古卷/石碑/传闻):\r\n       - 情报揭示: 获得高阶妖兽的[弱点]、隐藏秘境的[空间坐标]、大能洞府的[阵眼信物]等  \r\n\r\n# 面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\r\n  \x3c!--\r\n    - ${确认目标类型(实体秘籍/非秘籍)，提取目标L与Q，确认完整度类型}\r\n    - ${计算Max_X所需的目标L与角色当前L的差值来源}\r\n    - ${确认角色灵根五行与目标五行，决定E_mod取值(0.8/1.2)}\r\n    - ${确认P所依赖的悟性值与关联技艺值来源于<status_current_variables>}\r\n    - ${若本次成功后X=Y，确认大成奖励类型，功法类须确认生成境界不超过角色当前L}\r\n  --\x3e\r\n  <action_info>\r\n    {参悟分析}\r\n    | 目标:[秘籍/传承名称] | 境界: L=[目标L], Q=[Q系数] | 完整度:[原本/抄本/残缺/无] |\r\n    | 五行相性: 目标[五行] vs 角色灵根[有/无] -> E_mod =[0.8/1.2] |\r\n    | 进度参数: 目标总需 Y=[Y] | 越阶上限锁 Max_X=[数值] |\r\n    | 当前进度: [旧X] / [Y] |\r\n    {数值对抗}\r\n    | 角色悟性/技艺: P = floor(([Vu] +[悟性]×10 + [技艺]) × (1+[Z%])) +[W] = [P总值] |\r\n    | 参悟难度: D = floor(Vt[X] × (1+Q) × 补正[X] × E_mod[X]) + d20[骰值] = [D总值] |\r\n    | 差值: P[P总值] - D[D总值] = Δ[数值] |\r\n    {结算与反馈}\r\n    | 判定结果:[参悟成功 / 晦涩难明 / 走火入魔] |\r\n    | 惩罚变更: [无 / 气血-[X], 获得状态 心神受创(悟性-5, 可叠加)] |\r\n    | 进度更新: [阅读进度: 新X/Y] |\r\n    (若 新X < Y 且成功:)\r\n    | 阶段收获: 基础提升 Max(1, floor([Vt]×0.02))=[基础值] | 实际提升 min([基础值], Max(0, [Max_S]-[旧值]))=[提升值] | [技艺]: [旧值]+[提升值]=[新值]/[Max_S] |\r\n    (若 新X < Max_X 且 成功:)\r\n    | 系统连带: [进度未达上限，自动触发下一轮参悟...] | (随后直接附带新一轮面板)\r\n    (若 新X = Max_X 且 Max_X < Y:)\r\n    | 境界瓶颈:[内容过于深奥，受限于当前境界(L差)，进度暂时锁死] |\r\n    (以下仅当 新X = Y 时输出)\r\n    {领悟大成奖励}\r\n    | 奖励类型:[功法习得 / 配方解锁 / 情报揭示] |\r\n    | 境界降阶(受限于角色L): 目标L=[X] -> 最终生成L=[X] |\r\n    | 具体获得:[详细奖励内容] |\r\n    | 终末精进: 基础提升 Max(1, floor([Vt]/[Vu]×10))=[基础值] | 实际提升 min([基础值], Max(0, [Max_S]-[旧值]))=[提升值] | [技艺]: [旧值]+[提升值]=[新值]/[Max_S] |\r\n  </action_info>\r\n</rule>\r\n'],['生产制作规则','<rule name="生产制作规则">\r\n# 参数声明：\r\n  L=境界系数 Q=品质系数 R=灵根系数\r\n\r\n# 核心指令: 仅当<user>明确进行炼丹、炼器、制符、阵盘刻录、傀儡制造等生产行为时激活\r\n\r\n# 核心概念声明：\r\n  [Vt] = 目标产物基准值 = 10^主材L\r\n  [Vu] = 角色基准值 = 10^角色L\r\n  [B] = 批量制作乘数 (单次投入的素材份数，默认为1)\r\n\r\n# 第一阶段: 生产分析与素材共鸣计算\r\n  逻辑与规则:\r\n    1. 技艺与器具限制:\r\n      - 炼丹: 需[丹炉];可加成[火焰]\r\n      - 炼器/制傀: 需[器鼎/锻台/刻刀];可加成[火焰]\r\n      - 制符: 需[符笔]；禁用[火焰]\r\n      - 阵法: 需[阵盘/刻刀]；禁用[火焰]\r\n    2. 主材锚定与品质区间:\r\n      - 按单份素材配置计算,若未明确,取投入物中[L]最高者为主素材（若L相同取Q最高者）\r\n      - 目标境界L = 主材L\r\n      - 锁定品质区间: 下限(Min_Q) = 所有素材中最差品质；上限(Max_Q) = 所有素材中最好品质\r\n    3. 五行生克与素材灵气 (单份正面加成 P_mat_single):\r\n      - 基础灵气公式: 10^[素材L] × (1 + [Q系数])\r\n      - 辅材与主材的生克系数(E): 辅生主(1.5) | 主生辅(1.2) | 无生克(1.0) | 主克辅(0.5) | 辅克主(0.5)\r\n      - 君臣佐使限制: 辅材中仅取算后数值最高的 前3项 计入正面影响，第4项起因灵气冗余 P=0\r\n    4. 杂质排异累积 (单份反面难度 D_mat_single):\r\n      - 无论是主材还是辅材，每一件投入的素材都会增加提纯与压制难度\r\n      - 单个素材杂质难度 = 10^[该素材L] × 0.5\r\n\r\n# 面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\r\n  \x3c!--\r\n    - ${确认所需工具是否存在于<status_current_variables>，缺失则无法激活}\r\n    - ${从<status_current_variables>提取炼制者相关技艺值、工具/火焰/功法/阵法各项加值来源}\r\n    - ${确认批量B与素材清单，依规则锁定主材(L最高/Q最高)与品质区间[Min_Q, Max_Q]}\r\n    - ${回顾<生产制作协议>君臣佐使限制，确认辅材中哪些计入正面影响、哪些截断为0}\r\n    - ${确认是否拥有配方，决定无配方惩罚是否计入D}\r\n    - ${确认是否为首次炼制，决定技艺精进是否触发}\r\n  --\x3e\r\n  <action_info>\r\n    {生产分析}\r\n    | 技艺: [炼丹/炼器/制符/阵法] | 工具: [加值] | 装备: [加值] | 火焰: [加值] |\r\n    | 批量(B): [数量] 份素材同炼 | 极值检索: 阵法加成=[最高值] | 功法加成=[最高值] |\r\n    | 素材定性(单份): 主素材=[素材名 (L=[X], Q=[品质], 五行=[素材五行])] |\r\n    | 品质区间: 下限=[Min_Q] | 上限=[Max_Q] |\r\n    | 产物界定: 目标境界L=[主材L] | 基准值Vt=[10^主材L] |\r\n    {单份素材能效与杂质计算}\r\n    | 主材能效: 10^[L] × (1+[Q系数]) = [P_main] |\r\n    | 辅材排序: [排第1高的辅材P值], [排第2的P值], [排第3的P值] (其余截断为0) |\r\n    | 单份有效加成(P_mat): P_main + 辅材前三项 = [数值] |\r\n    | 单份杂质累积(D_mat): 投入素材总数[N] -> Σ(10^[素材L] × 0.5) = [数值] |\r\n  </action_info>\r\n\r\n# 第二阶段: 数值对抗与差值计算\r\n  逻辑与规则:\r\n    1. 正面影响 (Power):\r\n      公式: P = [Vu] + [对应技艺数值] + [工具加值] + [火焰加值] + [阵法加成] + [功法加成] + ([P_mat单份] × B)\r\n      (注: 同类加成取最高一项)\r\n    2. 反面影响 (Difficulty):\r\n      公式: D = ([Vt] × 2.0 × B) + ([D_mat单份] × B) + [无配方惩罚(若无则加 Vt×0.5×B)]\r\n    3. 差值结算 (Δ):\r\n      公式: Δ = P - D\r\n\r\n  面板模板:\r\n  <action_info>\r\n    {数值对抗}\r\n    | 炼制者能力(P_char): [Vu] + 技艺[X] + 工具[X] + 火焰[X] + 阵法[X] + 功法[X] = [数值] |\r\n    | 总体素材能效: P_mat单份[X] × 批量[B] = [P_mat_total] |\r\n    | 正面影响(P): P_char + P_mat_total = [P总值] |\r\n    | 总体杂质与基础难度: (Vt[X]×2.0×[B]) + (D_mat[X]×[B]) = [D_mat_total] |\r\n    | 反面影响(D): [D_mat_total] + 惩罚[X] = [D总值] |\r\n    | 差值判定: P[P总值] - D[D总值] = Δ[数值] |\r\n  </action_info>\r\n\r\n# 第三阶段: 产出结算与技艺精进\r\n  逻辑与规则:\r\n    1. 成功判定与品质推演 (品质数组: 凡/黄/玄/地/天):\r\n      - 判定基准阈值 (T) = Vt × B\r\n      - Δ < 0 : 炼制失败 (素材尽毁)\r\n      - Δ ≥ 0 : 成功,基础品质 = [Min_Q]\r\n      - Δ ≥ 0.5 × T : 优秀,品质提升1阶 (如: 黄->玄)\r\n      - Δ ≥ 1.0 × T : 极品,品质提升2阶 (如: 黄->地)\r\n      - 封顶限制: 最终品质不可超过 [Max_Q],若超过则强制降至 Max_Q\r\n    2. 数量生成规则 (仅在成功时计算，此为【单份素材】的产出基数，向下取整):\r\n      - 法宝/阵盘: 固定 1 个\r\n      - 傀儡: 1 + floor(Δ / (0.5 × T)) 个\r\n      - 丹药/符箓: min(1 + floor(Δ / (0.2 × T)),10) 个\r\n      - 最终总产出 = 【单份产出】 × 批量【B】\r\n    3. 成品效果数量规则 (与最终推演的品质挂钩):\r\n      - 凡/黄阶: 1个基础效果\r\n      - 玄/地阶: 2个效果\r\n      - 天阶: 3个效果\r\n    4. 首次配方精进技艺 (仅非失败的“首次炼制”触发，与批量B无关):\r\n      - 技艺提升公式: 获得数值 = Max(1, floor( (10^主材L / 10^角色L) × 10 ))\r\n\r\n  面板模板:\r\n  <action_info>\r\n    {产出结算}\r\n    | 判定阈值(T): Vt[X] × B[X] = [T] |\r\n    | 结果: Δ=[数值] vs T=[T] -> [失败 / 成功 / 优秀 / 极品] |\r\n    (若失败:)\r\n    | 状态: 灵气暴走，炼制失败，素材尽毁 |\r\n    (若成功及以上:)\r\n    | 品质推演: 基础[Min_Q] + 升阶推演 -> 封顶受限[Max_Q] -> 最终品质: [最终阶级] |\r\n    | 效果数量: [1/2/3] (依最终品质) |\r\n    | 产出详情: [产物名称(境界L, 最终品质)] |\r\n    | 数量: 单份产量[X] × 批量[B] = 总计 [总数量] [单位] |\r\n    {技艺精进}\r\n    | 首次配方: [是/否] |\r\n    | 技艺提升: [对应技艺]增加 Max(1, floor([Vt]/[Vu] × 10)) = [获得数值] 点 |\r\n  </action_info>\r\n</rule>'],['时间推进规则','<rule name="时间推进规则">\n触发机制: 仅当叙事中时间跨度≥1年时触发，用于推演世界状态变迁\n\n# 第一阶段: 变迁参考表\n\n  境界变化: 推演各角色的进阶/跨阶事件时,耗时区间参照 <realm_power_level/> 中的「境界耗时」表\n\n  文明演进:\n  | 时间跨度 | 典型表现 |\n  | --- | --- |\n  | 1~5年 | 王朝政令更迭、局部战乱、城镇人口流动 |\n  | 5~30年 | 小国兴衰、新城建立或旧城荒废、民间信仰转变 |\n  | 30~100年 | 王朝更替、民族迁徙、文化习俗演变 |\n  | 100~500年 | 大国覆灭或崛起、语言分化、城市荒废或新建 |\n  | 500~3000年 | 民族融合或消亡、文明断层、历史神话化 |\n  | 3000年以上 | 语言面目全非、旧时代文明仅余遗迹与传说 |\n  注: 修仙王朝（统治者为修士）发生的变化较小\n\n  世界变迁:\n  | 时间跨度 | 典型表现 |\n  | --- | --- |\n  | 1~5年 | 势力消长、人事更迭、局部战乱平息或爆发 |\n  | 5~30年 | 宗门兴衰、灵脉枯竭或新生、秘境开闭 |\n  | 30~100年 | 小宗门陨落、势力版图重划、部分地域面目全非 |\n  | 100~500年 | 大宗门覆灭或崛起、山河改道、上古遗迹重现 |\n  | 500~3000年 | 大陆格局重塑、种族兴衰、旧势力彻底湮没 |\n  | 3000年以上 | 地形演变、海陆易位、旧时代彻底成为神话 |\n\n# 第二阶段: 人物变化事件表\n  每位人物在时间推进中可触发一次或多次事件（时间越长，事件链越长）\n  事件链格式: [事件A] -> [事件B] -> ...\n\n  | 事件类型 | 触发倾向 | 结算说明 |\n  | --- | --- | --- |\n  | 无变化 | 任意 | 修为略有精进但无实质突破，状态维持 |\n  | 小境界突破 | 修为充足、无天谴 | 境界小进 |\n  | 大境界突破 | 积累充足、有机缘 | 境界大进，实力质变 |\n  | 取得机缘 | 任意 | 获得物品，需注明具体所得 |\n  | 探秘受损 | 中低阶修士 | 秘境险境中受创，可能损失物品/境界倒退 |\n  | 走火入魔 | 修炼激进/天谴高 | 境界倒退，可能获得永久减益状态 |\n  | 被人追杀 | 有仇敌/持宝在身 | 损失物品/灵石，可能受伤/流亡/陨落 |\n  | 势力变动 | 宗门动荡时期 | 身份/所属势力发生变化，如：叛出宗门、被驱逐、晋升长老 |\n  | 仇怨结下 | 竞争/夺宝 | 新增敌对关系，后续事件链可能触发被追杀 |\n  | 陨落 | 寿元耗尽/历劫失败/战败 | 从关系列表中移除，需注明陨落原因 |\n  | 隐世闭关 | 高阶修士/受创后 | 从叙事视野中消失，下落不明，后续可能重出 |\n\n  约束:\n    - 事件链长度: 1~30年=1事件；30~100年=2~4事件；100年以上=4~6事件\n    - 连锁逻辑: 事件须符合因果，如[取得机缘]->[被人追杀夺宝]合理，[陨落]后不可再有事件\n    - 寿元判定: 每次推进须对照寿命上限判断人物是否自然坐化（年龄≥寿命则必然陨落）\n    - 不确定性: 非亲历事件以"据说""传闻"等语气呈现，而非既成事实\n\n# 面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\n  \x3c!--\n    - ${确认应当参与时间推进的角色}\n    - ${从<status_current_variables>提取对应角色状态}\n    - ${此次时间跨度对应何种程度变化}\n  --\x3e\n  <time_info>\n    {时间推进}\n    | 跨度: [X年X月] |\n    {人物推演}\n    | [人物名] ([当前境界] / 年龄[X]/寿命[X]) |\n    | 事件链: [事件A] -> [事件B] -> ... |\n    | 境界变化: [旧境界] -> [新境界 / 维持] |\n    | 寿元变化: 年龄 [旧]->[新] / 寿命 [旧]->[新] | 判定: [健在/自然坐化/陨落(原因)] |\n    | 物品变动: 获得[XXX] / 失去[XXX] / 无 |\n    | ... (每位关系列表人物各占一组) |\n    {文明演进}\n    | [国度/民族名]: [变化描述] |\n    | ... |\n    {世界变迁}\n    | [地点/势力名]: [变化描述] |\n    | ... |\n  </time_info>\n  叙事指导: 以<user>视角感知世界变化，通过他人口述、神识探查、旧地重游等方式自然呈现；陨落人物可留下遗物、传说或未竟之事等\n</rule>'],['突破规则','<rule name="突破规则">\r\n<%_ { _%>\r\n<%_\r\n// ============ ① 读取 MVU 变量 (stat_data 由 <status_current_variable> 全量输出) ============\r\nconst _tb_修炼 = getMessageVar(\'stat_data.修炼进度\', { defaults: {} }) || {};\r\nconst _tb_境界 = _tb_修炼.境界 || \'凡人\';\r\nconst _tb_气感 = Number(getMessageVar(\'stat_data.体质.气感\')) || 0;\r\nconst _tb_世界 = getMessageVar(\'stat_data.地点.世界\') || \'凡界\';\r\nconst _tb_灵气 = getMessageVar(\'stat_data.资源池.灵气\', { defaults: {} }) || {};\r\nconst _tb_灵气现值 = Number(_tb_灵气.现值) || 0;\r\nconst _tb_灵气上限 = Number(_tb_灵气.上限) || 0;\r\nconst _tb_功法 = getMessageVar(\'stat_data.功法\', { defaults: {} }) || {};\r\nconst _tb_心法 = Object.values(_tb_功法).find(g => g && g.使用中 && (g.类型 === \'心法\' || !g.类型)) || {};\r\nconst _tb_修行速度 = Number((_tb_心法.效果 || {})[\'修行速度\']) || 0;\r\nconst _tb_物品 = getMessageVar(\'stat_data.物品\', { defaults: {} }) || {};\r\nconst _tb_有筑基丹 = Object.entries(_tb_物品).some(([名, 物]) => 名.includes(\'筑基丹\') && Number(物 && 物.数量) > 0);\r\nconst _tb_技艺 = getMessageVar(\'stat_data.技艺\', { defaults: {} }) || {};\r\nconst _tb_技艺列表 = [];\r\nfor (const _类 of Object.keys(_tb_技艺)) {\r\n  for (const _名 of Object.keys(_tb_技艺[_类] || {})) {\r\n    _tb_技艺列表.push({ 名: `${_类}.${_名}`, 值: Number(_tb_技艺[_类][_名]) || 0 });\r\n  }\r\n}\r\nconst _tb_最高技艺 = _tb_技艺列表.sort((a, b) => b.值 - a.值)[0] || null;\r\n\r\n// ============ ② 境界推导 (参照<rule ref="核心系数总表"/>) ============\r\nconst _tb_大境界定义 = [\r\n  { 名: \'炼气\', 匹配: [\'炼气\', \'练气\'], L: 1 },\r\n  { 名: \'筑基\', 匹配: [\'筑基\'], L: 2 },\r\n  { 名: \'金丹\', 匹配: [\'金丹\'], L: 3 },\r\n  { 名: \'元婴\', 匹配: [\'元婴\'], L: 4 },\r\n  { 名: \'化神\', 匹配: [\'化神\'], L: 5 },\r\n  { 名: \'返虚\', 匹配: [\'返虚\', \'炼虚\', \'练虚\'], L: 6 },\r\n  { 名: \'合体\', 匹配: [\'合体\'], L: 7 },\r\n  { 名: \'大乘\', 匹配: [\'大乘\'], L: 8 },\r\n  { 名: \'渡劫\', 匹配: [\'渡劫\'], L: 9 },\r\n];\r\nconst _tb_小境界加成 = { 初期: 0, 中期: 0.2, 后期: 0.4 };\r\nconst _tb_小境界序 = [\'初期\', \'中期\', \'后期\'];\r\n\r\nconst _tb_解析 = (境界名) => {\r\n  if (!境界名 || 境界名 === \'凡人\') return { 大境界: \'凡人\', 小境界: \'无\', L: 0, 大境界L: 0, 是后期: false, 序号: -1 };\r\n  const 定义 = _tb_大境界定义.find(d => d.匹配.some(k => 境界名.includes(k)));\r\n  if (!定义) return { 大境界: \'凡人\', 小境界: \'无\', L: 0, 大境界L: 0, 是后期: false, 序号: -1 };\r\n  const 小境界 = _tb_小境界序.find(k => 境界名.includes(k)) || \'初期\';\r\n  return { 大境界: 定义.名, 小境界, L: 定义.L + _tb_小境界加成[小境界], 大境界L: 定义.L, 是后期: 小境界 === \'后期\', 序号: 定义.L - 1 };\r\n};\r\n\r\nconst _tb_现在 = _tb_解析(_tb_境界);\r\nconst _tb_凡人 = _tb_现在.序号 === -1;\r\nconst _tb_可跨大境 = _tb_凡人 || _tb_现在.是后期;\r\nconst _tb_下一大境 = _tb_大境界定义[_tb_现在.序号 + 1] || null;\r\nconst _tb_目标大境 = _tb_凡人 ? \'炼气\' : (_tb_现在.是后期 ? (_tb_下一大境 ? _tb_下一大境.名 : \'\') : _tb_现在.大境界);\r\n\r\n// ============ ③ 大境界历劫规则 (按目标大境界裁剪, 仅输出当前相关一条) ============\r\nconst _tb_历劫表 = {\r\n  炼气: `炼气(凡人->炼气初期):\r\n    - 规则: 检索[灵根], 若为"无灵根"则自动失败; 否则自动成功`,\r\n  筑基: `筑基(炼气后期->筑基初期):\r\n    - 必须在物品中存在[筑基丹], 否则自动失败 (当前: ${_tb_有筑基丹 ? \'有\' : \'无\'})\r\n    - 凝气海判定: 难度[D]额外增加 (体质[气感] × 2) (当前气感=${_tb_气感})`,\r\n  金丹: `金丹(筑基后期->金丹初期) - "三聚九转":\r\n    - 挂起常规流程, 强制进入为期3回合的【聚气阶段】\r\n    - 每回合系统自动尝试3次灵气压缩(共9次对应9转)\r\n    - 灵气消耗: 第 N 转固定消耗 = floor(10^L × N × 0.1) (金丹期L=3.0)\r\n    - 判定逻辑: 若当前灵气 ≥ 消耗, 则该转成功并扣除, 继续下一转; 若不足, 则本回合剩余注入立刻中止\r\n    - 回合间隙: 每回合结束时暂停, <user>可执行1次战术动作(如服用1次恢复丹药), 随后进入下一回合\r\n    - 结算: 3回合结束时按最终成功总次数结算为【N转金丹】(N=1~9), N=0则突破失败\r\n    (当前灵气: ${_tb_灵气现值}/${_tb_灵气上限})`,\r\n  元婴: `元婴(金丹后期->元婴初期) - "碎丹与心魔":\r\n    - 强制转入<rule ref="战斗规则"/>\r\n    - 碎丹反噬: 开战时<user>获得不可驱散状态[碎丹虚弱] -> 气血与灵气现值减半(持续至突破结束)\r\n    - 宿敌生成: 召唤【心魔】(除无虚弱状态外, 一切与<user>完全一致)\r\n    - 幻术干扰: 每回合开始前, 心魔额外对<user>发动一次【幻术意图】攻击(视为心魔的一次额外行动)\r\n    - 胜负条件: 击败心魔|存活5回合 -> 突破成功; 战败 -> 突破失败+走火入魔`,\r\n  化神: `化神(元婴后期->化神初期) - "法则融合":\r\n    - 需明确选择一项自身[技艺]进行严苛法则检定(默认取最高一项) (当前最高: ${_tb_最高技艺 ? `${_tb_最高技艺.名}=${_tb_最高技艺.值}` : \'未知\'})\r\n    - 法则难度: D_law = floor(10^L × 2) + 天谴 + 丹毒\r\n    - 检定公式: 自身该[技艺]数值 × (1+[Z%]) + d20 vs D_law`,\r\n  返虚: `返虚(化神后期->返虚初期)及以上(灵界):\r\n    - 通过基准判定后进入大境界历劫(结合该境界特性演绎, 失败则走火入魔/修为倒退)`,\r\n};\r\n\r\nlet _tb_历劫段 = \'\';\r\nif (!_tb_目标大境) {\r\n  _tb_历劫段 = \'已至渡劫后期, 进一步突破(飞升仙界)超出本文档范围\';\r\n} else if (_tb_世界 === \'凡界\' && [\'返虚\', \'合体\', \'大乘\', \'渡劫\'].includes(_tb_目标大境)) {\r\n  _tb_历劫段 = \'返虚(化神后期->返虚初期)及以上: 需飞升灵界方可进行(凡界灵气不足以承载)\';\r\n} else if (_tb_可跨大境) {\r\n  _tb_历劫段 = _tb_历劫表[_tb_目标大境] || `【${_tb_目标大境}】历劫(规则未详述): 通过基准判定后进入历劫, 结合该境界特性演绎, 失败则走火入魔/修为倒退`;\r\n}\r\n\r\n// ============ ④ 大境界奖励 (按目标大境界裁剪) ============\r\nconst _tb_奖励表 = {\r\n  炼气: \'\',\r\n  筑基: \'筑基奖励: 悟性/根骨/气感 增加 floor([气感] × 0.2)\',\r\n  金丹: \'金丹奖励: 获得永久状态 [N转金丹] (效果: 修行速度常驻 +N×5%)\',\r\n  元婴: \'元婴奖励: 悟性/根骨/气感 增加 15 点\',\r\n  化神: \'化神奖励: 心法品质升阶(至多天阶)融合法则效果, 用于突破判定的[技艺]增加 50000 点\',\r\n};\r\nlet _tb_大境奖励段 = \'\';\r\nif (_tb_可跨大境) {\r\n  _tb_大境奖励段 = \'\\n      * 淬毒重生: 丹毒 -> floor(丹毒×0.5) (丹毒随污垢逼出体外)\\n      * 寿元暴增: 15 × 突破后L^3\';\r\n  if (_tb_奖励表[_tb_目标大境]) _tb_大境奖励段 += `\\n      * ${_tb_奖励表[_tb_目标大境]}`;\r\n}\r\n\r\n// ============ ⑤ 拼装输出 ============\r\nconst _tb_第二阶段 = _tb_可跨大境 ? `  ${_tb_历劫段}` : `  当前为[${_tb_境界}], 未至大境界跨越门槛(需后期圆满), 本轮仅执行小境界晋升判定`;\r\n\r\nconst _tb_output = `# 突破规则(动态适配: 仅输出与当前境界相关部分)\r\n# 参数声明:\r\n  L=境界系数 R=灵根系数 E_local=局部环境系数\r\n  [P]=突破能效总值 | [D]=突破难度阻力 | [天谴值]/[丹毒值]=人物累积阻力(取自<status_current_variable>修炼进度), 直接抬高[D]\r\n  [Z%] = 匹配当前计算属性的 max(相关增益%) - max(相关减益%)\r\n  [W] = 匹配当前计算属性的 max(相关增值) - max(相关减值)\r\n  [M] = 资质与环境乘数 = (1 + R + E_local + [Z%])\r\n  [X/Y] = 当前修为进度 / 晋升阈值  [Y] = 10^L × 100\r\n  （注: Z%与W为动态求值,仅检索与"降低突破难度"或"增加突破概率"相关的状态加成; E_local依当前场景灵气浓度判断,参照<rule ref="核心系数总表"/>局部环境系数表）\r\n\r\n# 核心触发条件:\r\n  激活: 1. <user>明确宣告进行突破 2. 当期修为[X] ≥ 晋升阈值[Y]\r\n  禁止: 非<user>的突破行为(仅以叙述呈现)\r\n\r\n# 小境界判定:\r\n  1. 适用范围: 所有小境界晋升(如初期->中期)与大境界跨越的前置基准检定\r\n  2. 能效公式: [P] = floor((10^L + 心法[修行速度]×10) × [M]) + d20  (当前修行速度=${_tb_修行速度})\r\n  3. 难度公式: [D] = Max(1, floor(10^L × 1.5) + [天谴值] + [丹毒值] - [W])\r\n  4. 判定标准:\r\n    - [P] ≥ [D] -> 小境界进入【突破成功结算】; 大境界进入【大境界历劫】\r\n    - [P] < [D] -> 跳至【突破失败结算】\r\n\r\n  基准判定面板:\r\n  <action_info>\r\n    {突破基准判定}\r\n    | 目标境界: [名](L=[L]) | R=[X] | E_local=[X] | 突破增益[Z%]=[X%] |\r\n    | 能效[P]: floor((10^[L]+心法速度[X]×10)×[M]) + d20[骰值] = [P值] |\r\n    | 难度[D]: Max(1, floor(10^[L]×1.5)+天谴[X]+丹毒[X]-[W]) = [D值] |\r\n    | 结果: [P] vs [D] -> [成功(小境界直接晋升/大境界进入历劫) / 失败] |\r\n  </action_info>\r\n\r\n# 大境界历劫:\r\n${_tb_第二阶段}\r\n\r\n# 突破结算:\r\n  1. 突破成功结算\r\n    - 修为池: [当前修为X]归零, [Y]更新为新境界阈值[Y] = 10^L × 100, 更新人物[境界]标签\r\n    - 状态全满: 气血与灵气恢复至全新上限\r\n    - 大境界巨额奖励(仅跨越大境界成功时):${_tb_大境奖励段 || \'\\n      (无, 本轮非大境界跨越)\'}\r\n  2. 突破失败结算\r\n    - 修为倒退: 扣除相当于当前境界上限[Y] × 20% 的修为\r\n  3. 重新计算资源\r\n    - 气血上限 = floor(10^L × (1+根骨×0.1)) | 灵气上限 = floor(10^L × (1+气感×0.1)) | 遁速 = floor(10^L × (1+根骨×0.02))\r\n  4. 叙事指导: 大境界突破成功·淬毒重生时, 描摹毒素随污垢自毛孔逼出(如皮肤浮现一层厚厚的黑褐污垢、散发秽臭), 涤净后焕然一新\r\n  5. 输出要求: 历劫与结算过程以 <action_info> 表格呈现, 输出前先以 \x3c!-- ... --\x3e 完成思考`;\r\n_%>\r\n<%- _tb_output %>\r\n<%_ } _%>\r\n</rule>'],['物品功法生成规则','<%_ { let _炼丹语境 = false, _突破语境 = false, _生产语境 = false, _阵法语境 = false, _天谴语境 = false; try {\r\n  const _始 = Math.max(0, lastMessageId - 3);\r\n  const _上文 = getChatMessages(`${_始}-${lastMessageId}`).map(m => m.message).join(\'\\n\');\r\n  _炼丹语境 = [\'炼丹\',\'炼药\',\'丹药\',\'丹方\',\'丹炉\',\'丹鼎\',\'丹室\',\'丹毒\',\'服丹\'].some(k => _上文.includes(k));\r\n  _突破语境 = [\'突破\',\'瓶颈\',\'筑基丹\'].some(k => _上文.includes(k));\r\n  _生产语境 = _炼丹语境 || [\'炼制\',\'炼器\',\'制符\',\'刻符\',\'阵盘\',\'刻录\',\'锻造\',\'器鼎\',\'锻台\',\'刻刀\',\'符笔\',\'驯兽\',\'培育\'].some(k => _上文.includes(k));\r\n  _阵法语境 = [\'阵法\',\'阵盘\',\'结阵\',\'布阵\',\'法阵\',\'阵眼\',\'阵旗\'].some(k => _上文.includes(k));\r\n  _天谴语境 = _上文.includes(\'天谴\');\r\n} catch (e) {} _%>\r\n<rule name="物品功法生成规则">\r\n# 参数声明:\r\n  L=境界系数 Q=品质系数 R=灵根系数 k=生成系数\r\n  G(k)=floor(10^L×k×(1+Q))   # 生成值:标签数值与"固定数值类"效果值均=G(k)\r\n\r\n# &RULE_标签映射规则:\r\n  生成标签时严格采用 `[属性名:数值/文本]` 的直接拼接格式。\r\n  | 分类 | 类型 | 必含标签 (不可遗漏) |\r\n  | --- | --- | --- |\r\n  | 装备 | 法宝 | [攻击力:X] |\r\n  | 装备 | 护甲 | [防御力:X] |\r\n  | 装备 | 饰品 | (无强制标签) |\r\n  | 物品 | 符箓 | [灵气消耗:X]、[攻击力:X] (非攻击型可=0) |\r\n  | 物品 | 素材 | [炼制难度:X] |\r\n  | 物品 | 秘籍 | [完整度:残缺/抄本/原本]、[阅读进度:X/Y] | //默认X=0;Y = max(1, ceil(L / 2))\r\n  | 物品 | 丹药/工具 | (无强制标签) |\r\n  | 物品 | 配方 | [所属技艺:炼器|驯兽|培育|医术|炼丹|制符|御物|咒法|幻术|阵法|神识|炼体] |\r\n  | 功法 | 心法 | [修行速度:X] |\r\n  | 功法 | 攻击/咒法 | [命中:X][穿透%:X][攻击力:X] |\r\n  | 功法 | 神识 | [攻击力:X] |\r\n  | 功法 | 身法 | [闪避:X][遁速:X] |\r\n  | 功法 | 护体 | [灵气受击|气血受击][减免%:X][防御力:X] |\r\n  | 功法 | 阵法 | [灵气容量:X][攻击力:X] |\r\n  (注:可自由附加符合设定的[标签:X])\r\n\r\n# &RULE_物品生成系数表: (标签数值=G(k),下表给各属性 k)\r\n  | 类别 | 属性 | k | 说明 |\r\n  | --- | --- | --- | --- |\r\n  | 护甲 | 防御力 | 0~0.2 | 特殊护甲可=0 |\r\n  | 功法(心法) | 修行速度 | 0.1~0.5 | |\r\n  | 功法(攻击/咒法)| 攻击力 | 0.2~0.5 | |\r\n  | 功法(神识)| 攻击力 | 0.1~0.3 | |\r\n  | 功法(身法) | 遁速 | 0.5~2.5 | |\r\n  | 功法(护体) | 防御力 | 0.1~0.4 | |\r\n  | 功法 | 灵气消耗 | 0~0.5 | 被动触发类可=0 |\r\n  | 法宝 | 攻击力 | 0.1~0.3 | |\r\n  | 傀儡 | 气血 | 0.5~1 | |\r\n  | 灵兽 | 气血 | 5~15 | |\r\n  | 傀儡/灵兽 技能 | 攻击力 | 0~0.3 | 傀儡/灵兽生成技能时参考 |\r\n  | 傀儡/灵兽 | 防御力 | 0~0.2 | |\r\n  | 傀儡/灵兽 | 遁速 | 0.5~2 | |\r\n  | 功法(阵法) | 灵气容量 | 2~6 | 需结阵注入灵气;消耗固定为无 |\r\n  | 功法(阵法) | 攻击力 | 0~0.3 | 非攻击类阵法=0 |\r\n  | 符箓 | 攻击力 | 0~0.8 | 非攻击符箓=0 |\r\n  | 符箓 | 消耗灵气 | 0.1~0.3 | |\r\n  特殊规则(不使用G(k)):\r\n    - 命中/闪避 仅固定加值: max(1,floor(L/2+2Q))\r\n      注: 此值加在d20上,同境界对抗时差值在1-3之间,保持d20随机性的决定作用\r\n    - 穿透%/减免% 仅百分比修正: L×5%+Q×20%\r\n      注: 同境界对抗时穿透%与减免%大致抵消,装备差异决定净增减\r\n\r\n# &RULE_效果加值指导:\r\n  核心要求:RPG物品词条风格,明确具体内容,**禁止模糊描述(如:略微\\大量\\极大\\少量...)**\r\n  效果分类:\r\n    非数值类:(如:对xx免疫)\r\n      1. 须附加境界限制(如:对筑基期初期及以下境界毒素免疫)\r\n      2. 品质关联:\r\n        -生效范围(如:黄阶->蟾毒免疫；天阶->毒素免疫)\r\n        -效果强度(如:凡阶->腹痛；黄阶->腹泻)\r\n      3. 合理的五行关联(如:阳->邪祟克制、火->保暖御寒)\r\n    数值类:(如:攻击力+10；攻击力+10%)\r\n      1. 禁止生成: 气血|灵气上限 (无法出现在效果中)\r\n      2. d20数值类(命中/闪避/穿透/减免):max(1,floor(L/2+2Q))\r\n      3. 百分比类(+Z%):L×(1+Q)×(1% ~ 2%)\r\n      4. 固定数值类(+W): G(k),默认 k=0.1~0.2\r\n      5. 合理的五行关联,如:水->气血恢复、金->攻击力\r\n      6. 燃烧精血触发的效果需注明燃烧精血数量(1~3滴)\r\n    叙述类:(仅叙述文字)\r\n      1.素材: 用于生产时对成品影响的叙述\r\n      2.秘籍: 秘籍类型[心法|攻击|咒法|神识|幻术|身法|护体|技艺]与内容介绍(无数值相关)\r\n      3.配方: 记录所需原材料(2-3种原料)\r\n  效果示例:(优先使用示例中存在的效果)\r\n    战斗效果:\r\n      - ${某种条件下},计算${技艺}时,视为${增|减}${G(k=0.1~0.3)}\r\n      - ${某种条件下},${攻击力|防御力|遁速}视为${增|减}${G(k=0.1~0.2)}\r\n      - ${某种条件下},${命中|闪避}视为${增|减}${max(1,floor(L/2+2Q))}\r\n      - ${某种条件下},${穿透|减免}视为${增|减}${L×5%+Q×20%}\r\n      - ${某种条件下},${友方|自己}附加${状态},${状态效果},${持续时长}\r\n      - ${某种条件下},${境界}及以下的敌人附加${状态},${状态效果},${持续时长}\r\n      - ${某种条件下},解除${某类状态}\r\n    生产效果:\r\n      - 在${炼丹|炼器|制符|阵法}时【工具加值】为${G(k=0.5~1.5)}\r\n      - 在${炼丹|炼器}时【火焰加值】为${G(k=0.5~1.5)}\r\n<%_ if (_生产语境) { _%>\r\n      - ${特定配方}【单份产出】额外增加${1~3}个\r\n      - 首次生产配方成功时,${技艺}获得值提升${2Q}%\r\n<%_ } _%>\r\n    物品(丹药)效果:\r\n      - ${境界}及以下的修士,解除${状态}\r\n      - ${境界}及以下的修士,添加${状态},${状态效果},${持续时长}\r\n      - ${灵气/气血}恢复${G(k=1~4)}\r\n      - 提升${G(k=1~4)}修为\r\n<%_ if (_炼丹语境) { _%>\r\n      - 提升${G(k=0.2~0.6)}年的寿元\r\n      - 丹毒变化${floor(10^L×(0.1~0.2)×(0.75-Q))}点  (仅天品减毒)\r\n<%_ } _%>\r\n<%_ if (_炼丹语境 || _天谴语境) { _%>\r\n      - 天谴变化${floor(10^L×(0.1~0.2)×(0.75-Q))}点  (仅天品减谴)\r\n<%_ } _%>\r\n<%_ /* 突破类:炼丹时 或 上文出现"突破/瓶颈/筑基丹"时,都可独立触发 */ _%>\r\n<%_ if (_炼丹语境 || _突破语境) { _%>\r\n      - 突破${境界}时难度减免${L×5%+Q×20%}\r\n      - 突破${境界}时成功率增加${L×(1+Q)×(1%~2%)}\r\n<%_ } _%>\r\n    状态效果:\r\n      - ${增|减}丹毒排除速度${L×(1+Q)×(1%~2%)}\r\n      - ${增|减}${修炼方式}的修行速度${L×(1+Q)×(0.5%~1%)}\r\n<%_ if (_阵法语境) { _%>\r\n      - ${阵法}灵气${增|减}${G(k=0.5~1.5)}\r\n<%_ } _%>\r\n      - ${增|减}${灵气/气血}${G(k=0.05~0.1)}\r\n      - ${昏迷|封禁|禁锢|跳过下一次战斗轮}\r\n\r\n# 物品生成格式\r\n  触发: 需要展示任何实体信息时\r\n    - 如:购买或拍卖、清点战利品、生产完成、发现素材...\r\n  约束:\r\n    - 所有数值遵循*RULE_物品生成系数表 与 *RULE_效果加值指导\r\n    - 标签严格遵循*RULE_标签映射规则\r\n  ## 输出前先以 \x3c!-- ... --\x3e 完成思考\r\n  \x3c!--\r\n    - ${实体类型: 物品/装备/功法}\r\n    - ${依据触发场景确定境界L与品质Q}\r\n    - ${依据*RULE_物品生成系数表;确认本实体各属性对应的系数范围}\r\n    - ${确认*RULE_标签映射规则;确认必含标签无遗漏}\r\n    - ${确认*RULE_效果加值指导;确认效果条数(凡/黄=1, 玄/地=2, 天=3),确认效果类型合法}\r\n  --\x3e\r\n  ## 物品类 (秘籍/配方/符箓/丹药/素材/工具)\r\n  <item_info>\r\n    {物品名称}\r\n    | 品质: [凡|黄|玄|地|天] |\r\n    | 境界: [境界] |\r\n    | 类型: [秘籍|配方|符箓|丹药|素材|工具] |\r\n    | 五行: [金|木|水|火|土|阴|阳|混沌] |\r\n    | 标签: [标签1][标签2]... |\r\n    | 数量: [num] |\r\n    | 效果: [效果名: 效果]... |\r\n    | 描述: [叙事性描述] |\r\n  </item_info>\r\n\r\n  ## 装备类 (法宝/护甲/饰品)\r\n  <item_info>\r\n    {装备名称}\r\n    | 品质: [凡|黄|玄|地|天] |\r\n    | 境界: [境界] |\r\n    | 类型: [法宝|护甲|饰品] |\r\n    | 五行: [金|木|水|火|土|阴|阳|混沌] |\r\n    | 消耗: [灵气:N|气血:N|无] |\r\n    | 标签: [标签1][标签2]... |\r\n    | 效果: [效果名: 效果]... |\r\n    | 描述: [叙事性描述] |\r\n    | 位置: [手部|上装|下装|头部|足部|文胸|内裤|袜类|外搭|腰间|项链|戒指|储物袋] |\r\n  </item_info>\r\n\r\n  ## 功法类 (心法/攻击/幻术/神识/咒法/身法/护体/阵法)\r\n  注: 功法仅由<rule ref="领悟规则"/>生成;阵法 消耗固定为无(结阵走 战斗规则 战术动作.结阵)\r\n  <item_info>\r\n    {功法名称}\r\n    | 品质: [凡|黄|玄|地|天] |\r\n    | 境界: [境界] |\r\n    | 五行: [金|木|水|火|土|阴|阳|混沌] |\r\n    | 类型: [心法|攻击|幻术|神识|咒法|身法|护体|阵法] |\r\n    | 消耗: [灵气:N|气血:N|无] |   #阵法=无\r\n    | 标签: [标签1][标签2]... |\r\n    | 效果: [效果名: 效果]... |\r\n    | 描述: [叙事性描述] |\r\n  </item_info>\r\n\r\n</rule>\r\n<%_ } _%>'],['修为获取规则','<rule name="修为获取规则">\r\n# 参数声明：\r\n  L=境界系数 R=灵根系数 E_realm=界域环境系数 E_local=局部环境系数\r\n  [Z%] = 匹配当前计算属性的 max(相关增益%) - max(相关减益%)\r\n  [W] = 匹配当前计算属性的 max(相关增值) - max(相关减值)\r\n  （注：Z%与W为动态求值,仅检索与“修行速度”或“修为获取”相关的状态加成）\r\n  [X/Y] = 当前修为进度 / 晋升阈值  [Y] = 10^L × 100\r\n  [T] = 行为耗时 (统一转换为天数,1年=365天)\r\n\r\n# 核心触发条件: \r\n  激活：<user>明确获取修为行为。如：打坐、双修、采补、夺灵等\r\n  禁止：\r\n    1. 未明确声明双修/采补的性行为\r\n    2. 杀戮(默认不夺灵)\r\n    3. 当 [X] ≥ [Y] 时,视为此次修炼实际为突破意图,改为触发<rule ref="突破规则"/>\r\n    4. 非<user>的修炼行为(仅以叙述呈现)\r\n\r\n# 获取途径逻辑与公式\r\n  ## 途径一: 修炼\r\n    1. 条件: 处于非战斗/非干扰状态,明确声明耗时[T]天 (默认T=30)\r\n    2. 修为公式:\r\n      每日获取 = 心法[修行速度]/10^(L+1) × (1 + R) × (E_realm + E_local)\r\n      最终修为 = floor(每日获取 × T × (1+[Z%])) + [W]\r\n    3. 附带·炼化丹毒 (修炼时肉身自然淬毒,顺带排出丹毒):\r\n      每日炼化 = floor( 10^L × 0.2 × (1 + 根骨×0.1) × (1 + [Z%]_毒) ) + [W]_毒\r\n      丹毒清除 = min( 当前丹毒, floor(每日炼化 × T) )\r\n      丹毒 -= 丹毒清除\r\n\r\n  ## 途径二: 服丹\r\n    1. 条件: 服用提升修为的丹药(素材未炼丹无法食用)\r\n    2. 说明: 一次可服用多种/多品质丹药,逐种(i)代入,分两步结算\r\n    3. Step1·修为:\r\n      修为小计 = Σ_i ( 丹药[提升值]_i × 数量n_i )\r\n      最终修为 = floor(修为小计 × (1+[Z%])) + [W]   # [Z%]/[W] 检索"修行速度/修为获取"相关\r\n    4. Step2·丹毒:\r\n      毒源合计 = Σ_i ( 丹药[提升值]_i × 数量n_i × (1 − Q_i/2) )\r\n      丹毒增量 = Max(0, floor( 毒源合计 × 0.3 × (1 − [Z%]_毒) ) − [W]_毒 )   # [Z%]_毒/[W]_毒 检索"丹毒/排毒"相关\r\n      丹毒 += 丹毒增量\r\n\r\n  ## 途径三: 双修\r\n    1. 核心参数:\r\n      - 单次基数 = 心法[修行速度]/10^(L+1) × Max(0.1,1 + (对方L - 己方L) × 0.5) × (1+R)\r\n      - 灵蕴系数 [V]: 男方[灵蕴]+女方[灵蕴]。若无元阴/阳则[灵蕴]=0;普通体质[灵蕴]=5,特殊体质[灵蕴]=6~10\r\n      - 本源馈赠 = min(10^对方L × [V],10^己方L × 100)\r\n    2. 略过计算模式 (长时间跨度闭关双修):\r\n      - 岁月积累 = 单次基数 × T天 × 5(双修密集倍率)\r\n      - 公式: 最终修为 = floor( (岁月积累 + 本源馈赠) × (1+[Z%]) ) + [W]\r\n    3. 详细计算模式 (即时互动推演):\r\n      - 触发: 动作描写中每次出现明确的高潮点(如射精/绝顶)视为1次交互\r\n      - 公式: 最终修为 = floor( (单次基数 × 交互次数 + 本源馈赠) × (1+[Z%]) ) + [W]\r\n\r\n  ## 途径四: 夺灵\r\n    1. 条件: 目标无法反抗;\r\n    2. 收益公式:\r\n      - 修士: 最终修为 = floor(10^(min(己方L, 目标L))×50 × (目标[剩余寿命/总寿命%])× (1+[Z%]) ) + [W]\r\n      - 凡人: 最终修为 = 1/人 (需大量杀戮)\r\n    3. 代价与天谴结算 (即时累加):\r\n      - 目标代价: 境界跌落/沦为废人/死亡干尸\r\n      - 天谴增加: \r\n        * 目标为修士: 天谴值 += floor(10^目标L) (窃取天机,目标修为越高反噬越大)\r\n        * 目标为凡人: 天谴值 += 1/人\r\n\r\n# 面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\r\n  \x3c!--\r\n    - ${确认触发途径(修炼/服丹/双修/夺灵)}\r\n    - ${若为双修,确认<user>是否声明双修,是否插入阴道,是否射精}\r\n    - ${检查当前修为[X/Y],若X≥Y则转入<rule ref="突破规则"/>}\r\n    - ${依据途径,从<status_current_variables>确认参数来源:\r\n        修炼→心法[修行速度]/己方L/灵根R/界域D/E_local/根骨与[Z%]_毒[W]_毒(附带炼化丹毒);\r\n        双修→双修功法[修行速度]/双方L/元阴元阳与灵蕴;\r\n        服丹→逐种丹药[提升值]/数量n/品质Q;\r\n        夺灵→己方L/目标L/目标剩余寿命占总寿命比}\r\n    - ${确认 Z%/W 检索与"修行速度"或"修为获取"直接相关的加成}\r\n    - ${确认本次闭关的时长是否会触发<rule ref="突破规则"/>}\r\n  --\x3e\r\n  <action_info>\r\n    {修为状态总览}\r\n    | 人物: [姓名] | 境界: [当前境界] (L=[L]) | 修为池: [当前修为X] / [Y] |\r\n    | 元阳/元阴: [有/无] | 当前天谴值: [X] | 当前丹毒值: [X] |\r\n    {修为获取分析}\r\n    | 途径: [修炼 / 服丹 / 双修(略过/详细) / 夺灵] | 时间T: [X天 / X次互动] |\r\n    {参数检定}\r\n    (若为修炼:)\r\n    | 功法: [心法名][修行速度] -> κ=[修行速度]/10^(L+1)=[X] | 灵根 R=[X] |\r\n    | 界域: D=[X] -> E_realm=(D/L)²=[X] | 局部: [环境描述] E_local=[X] |\r\n    | 每日获取: κ[X] × (1+R)[X] × (E_realm+E_local)[X] = [X] 修为/天 |\r\n    | 附带炼化: 根骨[X]->淬毒系数(1+根骨×0.1)[X] | 排毒 [Z%]_毒=[X%] [W]_毒=[X] |\r\n    | 每日炼化: floor(10^[L]×0.2×淬毒系数[X]×(1+[Z%]_毒))+[W]_毒 = [X]/天 -> 累计清除 min(丹毒[X], ×T[X天]) = [X] |\r\n    | 丹毒累积: [旧X] -> [新X] |\r\n    (若为服丹:)\r\n    {第一步·修为(逐种丹药)}\r\n    | [丹药名i] | 品质[凡~天](Q=[X]) | 数量[n] | 提升值[X] -> 修为小计 提升值×n=[X] |\r\n    | ...(其余丹药逐行同上) |\r\n    | 修为合计: Σ(提升值×数量) = [X] |\r\n    {第二步·丹毒(逐种丹药)}\r\n    | [丹药名i] | 提升值[X]×数量[n]×(1−Q/2)[X] -> 毒源[X] |\r\n    | ...(其余丹药逐行同上) |\r\n    | 毒源合计: Σ = [X] | 排毒 [Z%]_毒=[X%] [W]_毒=[X] |\r\n    | 丹毒增量: Max(0, floor(毒源合计[X]×0.3×(1−[Z%]_毒)) − [W]_毒) = [X] |\r\n    | 丹毒累积: [旧X] -> [新X] |\r\n    (若为双修:)\r\n    | 功法: [双修功法名][修行速度] -> κ=[修行速度]/10^(L+1)=[X] | 己方L=[X] | 对方L=[X] |\r\n    | 境界补正 C: Max(0.1, 1+([对方L]-[己方L])×0.5) = [X] |\r\n    | 单次基数: κ[X] × C[X] × (1+R)[X] = [基数] |\r\n    | 本源检定: 男方[元阳:有/无,灵蕴=X] | 女方[元阴:有/无,灵蕴=X] | V=[X] |\r\n    | 本源馈赠: min(10^对方L×V[X], 10^己方L×100[X]) = [馈赠] (一次性) |\r\n    | (略过) 岁月积累 = 基数[X] × T[X天] × 5 = [X] |\r\n    | (详细) 互动累积 = 基数[X] × N[X次] = [X] |\r\n    | 本源变化: 男方:元阳:[有/无]->[无] | 女方:元阴:[有/无]->[无] | (触发本源馈赠强制双方失去元阴、元阳)\r\n    (若为夺灵/采补:)\r\n    | 判定: 目标[修士/凡人] | L_eff=min(己方L[X], 目标L[X])=[X] |\r\n    | 寿命比: 剩余[X]年 / 总寿命[X]年 = [X%] |\r\n    | 收益核算: 10^L_eff[X] × 50 × 寿命比[X%] = [X] |\r\n    {数值结算}\r\n    | 增减益: Z%=[X%] | W=[X] |\r\n    | 公式代入: [展示完整代入过程] |\r\n    | 获得修为: +[最终数值] |\r\n    | 结算判定: 修为 [旧X] -> [新X] / [Y] | 进行突破: [是/否](默认否) |\r\n    (若为夺灵附加:)\r\n    | 目标代价: [目标名] -> [境界跌落/废人/死亡干尸] |\r\n    | 天谴增量: floor(10^目标L) | 凡人 1/人 -> 天谴 [旧X] -> [新X] |\r\n  </action_info>\r\n  叙事指导:\r\n  - 若 E_realm 极低,描摹灵气稀薄修炼困难\r\n  - 夺灵/采补: 不直接描绘天谴累积\r\n</rule>'],['战斗规则','<rule name="战斗规则">\n# 参数声明:\n  L=境界系数 Q=品质系数 R=灵根系数\n  [Z%] = 匹配当前计算属性的 max(相关增益%) - max(相关减益%)\n  [W] = 匹配当前计算属性的 max(相关增值) - max(相关减值)\n  （注:Z%与W为动态求值,如在计算“遁速”时,仅检索与遁速相关的状态加成,绝不可代入攻击或防御类加成）\n\n# 核心触发条件: \n  激活:\n    1. 明确进入"双方"战斗\n    2. 强行破阵（与阵法战斗）\n  禁止:\n    1. 单方面碾压（如:境界差距L>2、处置俘虏、屠杀、剿灭溃逃之敌）\n    2. 非战斗（如:卷入高阶修士战斗余波、性交、社交威压）\n\n# 流程逻辑:\n  1. 战斗轮: 战况总览→行动顺序→战斗单位依次执行[攻击行动+(可选)战术动作]→(可选)战意判定→(若结束)战斗结算\n  2. 行动次数: 每战斗单位每战斗轮仅执行1[攻击行动]1[战术动作]\n  3. 指令裁定: 按战斗单位拆解<user>指令。若单一单位下达多个同类行动（如连续攻击、顺次用药）,仅采纳首项前序指令；不同单位的并行指令独立生效\n  4. 频率: 正文仅输出1战斗轮,完成后截断正文等待<user>下轮命令\n\n# 战况总览:\n  逻辑与规则:\n    1. 战斗类型: 切磋/压制/死斗\n    2. 战斗单位确认:\n      - 战斗单位仅人物、灵兽、傀儡、阵法(由阵法类功法创建的临时实体)\n      - 仅任一方存在≥3个同类低级单位时,可聚合为[集群](个体×N)\n    3. 状态展示:\n      - 面板中展示全部战斗单位及其状态\n      - 阵法若战斗开始前存在则无需结阵\n\n  面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\n  \x3c!--\n    - ${从<status_current_variables>确认处于出战状态的正确战斗单位}\n    - ${确认战斗单位境界L、遁速、防御等关键参数}\n    - ${确认战斗单位当前使用中的功法/装备/道具/技能,确认各项效果与对应数值(若无则为空手)}\n    - ${确认战斗单位本战斗轮的[攻击行动]与[战术动作]分配意图}\n    - ${检索<user>描述关键词,确认意图路由结果(常规/战术/幻术/神识/破阵)}\n    - ${确认Z%与W: 仅检索与本次计算属性直接相关的加成,列出来源}\n  --\x3e\n  <battle_info>\n    {战况总览}\n    | 回合: [当前回合数] | 类型: [战斗类型] | 环境: [简述环境] |\n    | [境界] | [五行] | [阵法A (结阵中or已结阵)]: 灵气 [X/X] (可选: | 状态: [状态名(N回合)]) |\n    | [境界] | [五行] | [人物B/人物集群B (当前存活数/初始数)]: 气血 [X/X] | 灵气 [X/X] | 遁速[X] | 战斗技艺: [仅列非零项,如 阵法10 神识5;全零省略] (可选: | 状态: [状态名(N回合)]) |\n    | [境界] | [五行] | [灵兽C/灵兽集群C (当前存活数/初始数)]: 气血 [X/X] | 灵气 [X/X] | 遁速[X] 防御力[X] (可选: | 状态:[状态名(N回合)]) |\n    | [境界] | [五行] | [傀儡D/傀儡集群D (当前存活数/初始数)]: 气血 [X/X] | 灵气 [X/X] | 遁速[X] 防御力[X] (可选: | 状态: [状态名(N回合)]) |\n    | [境界] | [五行] | [人物E/人物集群E (当前存活数/初始数)]: 气血 [X/X] | 灵气 [X/X] | 遁速[X] | 战斗技艺: [仅列非零项,如 阵法10 神识5;全零省略] (可选: | 状态:[状态名(N回合)]) |\n    | ...列出全部参战单位\n  </battle_info>\n  叙事指导: (勾勒当下对峙之势,环境意趣,人物气度仪表)\n\n# 行动顺序: \n  逻辑与规则:\n    1. 公式: [遁速] × (1+[Z%])+[W]\n    2. 排序: 战斗单位参与排序,阵法排序固定为最后;面板列表顺序<user>→队友A...→敌人A...,行动序列总值从高到低,生成本回合行动轴\n\n  面板模板:\n  <battle_info>\n    {行动顺序}\n    | [人物B]: [遁速] × (1+[Z%])+[W]=[总值] |\n    | [灵兽C]: [遁速] × (1+[Z%])+[W]=[总值] |\n    | [傀儡D]: [遁速] × (1+[Z%])+[W]=[总值] |\n    | [人物E]: [遁速] × (1+[Z%])+[W]=[总值] |\n    | [阵法A]: 固定后置 |\n    | 序列: [人物E] -> [人物B] -> [灵兽C] -> [傀儡D] -> ... |\n  </battle_info>\n  叙事指导: (绘双方迅捷与否,出手迅疾之别)\n\n# 攻击行动:\n  逻辑与规则:\n    1. 攻击次数: \n      - 非集群人物多段攻击视为一次合并的攻击意图（多段仅用于描述）\n      - 集群攻击次数由当前气血百分比决定: 气血≥80%→3次, 气血≥50%→2次, 气血≥30%→1次, 气血<30%→1次\n    2. 意图路由:\n      - 路由表:\n        | 描述匹配 | 路由 | 难度 | 技艺 |\n        | --- | --- | --- | --- |\n        | 一般攻击/模糊描述/攻击要害/斩杀 | → 攻击检定 | - | - |\n        | 缴械/致残/俘获 | → 战术意图对抗 + 攻击检定 | 5 | 无 |\n        | 幻术功法/幻惑效果(迷惑/混乱/昏迷) | → 幻术意图对抗(跳过攻击检定) | 2 | 幻术 |\n        | 神识功法/神念效果(震慑/威压/干扰) | → 神识意图对抗(跳过攻击检定) | 0 | 神识 |\n        | 破阵描述 | → 破阵意图对抗(跳过攻击检定) | 0 | 阵法 |\n      - 意图对抗公式:\n        floor(10^攻方L+攻方[技艺]*(1+[Z%])+[W])*d20 vs floor(10^守方L+守方[技艺]*(1+[Z%])+[W])*(d20+[难度])\n      - 意图结果:\n        * 战术意图: 成功→意图成功,继续攻击检定; 失败→无效,继续攻击检定\n        * 幻术意图: 成功→意图成功(本次行动结束); 失败→微弱干扰(本次行动结束)\n        * 神识意图: 成功→意图成功 + Max(10^L,功法[攻击力]) (不致死,本次行动结束); 失败→微弱干扰(本次行动结束)\n        * 破阵意图: 成功→对阵法灵气造成Max(10^攻方L, 攻方[技艺]*(1+[Z%])+[W])伤害(本次行动结束); 失败→无效(本次行动结束)\n    3. 攻击检定(仅路由至此时执行):\n      - 公式:\n        * 对无法行动者遁速取0\n        * floor(10^攻方L+攻方[遁速]*(1+[Z%])+[W])*(d20+[命中]) vs floor(10^守方L+守方[遁速]*(1+[Z%])+[W])*(d20+[闪避])\n      - 命中取值:\n        * 直接攻击/咒法攻击 [命中] = 功法命中+[W]\n        * 符箓/阵法/傀儡/灵兽 [命中] = 1 + floor(L/2)+[W]\n      - 闪避取值:\n        * 人物 [闪避] = 身法闪避+[W]\n        * 傀儡/灵兽 [闪避] = 1 + floor(L/2)+[W]\n        * 阵法: 0\n    4. 伤害计算(仅攻击检定命中后执行,神识意图的真实伤害直接应用):\n      - 基础伤害:\n        * 近身攻击:floor(10^L + 功法[攻击力] + [炼体]×(1+L×0.2) + 法宝[攻击力])*(1+[Z%])+[W]\n        * 远程攻击:floor(10^L + 功法[攻击力] + [御物]×(1+L×0.2) + 法宝[攻击力])*(1+[Z%])+[W]\n        * 咒法攻击:floor(10^L + 咒法[攻击力] + [咒法]×(1+L×0.2))*(1+[Z%])+[W]\n        * 傀儡/灵兽攻击:floor(10^L + 技能[攻击力])*(1+[Z%])+[W]\n        * 阵法攻击:floor(10^L + 阵法[攻击力])*(1+[Z%])+[W]\n      - 五行生克系数: //进攻功法五行vs护体功法,无则为混沌\n        * 非咒法攻击: 克制1.25 | 被克制0.75 | 无克制1.0\n        * 咒法攻击: 克制1.5 | 被克制0.5 | 无克制1.0\n      - 穿透与减免:\n        * [穿透%]: 攻方L*10% + [Z%]\n        * [减免%]: 守方L*10% + [Z%]\n        * 总防御力: 受击位置护甲[防御力]+护体功法[防御力]+[W]\n        * 结算伤害: 最终伤害 = Max(0, 基础伤害 - 总防御力) × (1 + [穿透%] - [减免%]) × [五行生克系数]\n      - 集群修正: 对集群单位的最终伤害 ×1.5\n      - 伤害应用:\n        * 人物: if 护体功法[灵气受击]: 灵气-=伤害; 溢出=max(0,-灵气); 气血-=溢出 else: 气血-=伤害\n        * 阵法: 灵气-=伤害\n        * 傀儡/灵兽: 气血-=伤害\n      - 生死判定:\n        * 人物/傀儡/灵兽: 气血 ≤ 0 -> [死亡/毁坏]\n        * 阵法: 灵气 ≤ 0 -> [停止运转]\n      - 死亡处理:\n        * 人物死亡: 从 关系列表 移除(NPC) 或 终结剧情(<user>)\n        * 傀儡毁坏: 从 傀儡 字典移除(若残骸尚可修复则保留并在描述中说明)\n        * 灵兽失控: 从 主人.灵兽 字典移除,以 类型=\'灵兽\' 条目重新登记到 关系列表(无主形态;失控/暴走/转敌对仅在叙述中体现,无字段开关)\n        * 主人(人物)死亡: 名下傀儡/灵兽随之退出战斗,后续命运由叙事决定\n\n  面板模板:\n  <battle_info>\n    {攻击行动}\n    | 攻方: [攻击者] 守方: [目标] | 招式: [技能名/无] | 法宝: [装备名/空手] |\n    | 消耗: 当前[资源]-消耗[资源] -> 剩余[资源] |\n    | 集群攻击: 气血[m%] -> 次数[N] | (仅集群)\n    {意图对抗} (仅幻术/神识/破阵/战术意图时显示)\n    | 路由: [关键词] -> [战术/幻术/神识/破阵]意图 | 难度=[D] | 技艺=[技艺名] |\n    | 攻方: floor(10^L+[技艺]×(1+[Z%])+[W]) × d20[骰值] = [A] |\n    | 守方: floor(10^L+[技艺]×(1+[Z%])+[W]) × (d20[骰值]+[D]) = [B] |\n    | 判定: [A] vs [B] -> [成功/失败] |\n    | 神识伤害应用: Max(10^L,功法[攻击力]) = [伤害值],[目标] 气血 [旧值]->[新值] (-[伤害值], 不致死) | (仅神识成功时,跳过伤害结算直接扣除)\n    | 破阵伤害应用: Max(10^L, [技艺]×(1+[Z%])+[W]) = [伤害值],[阵法] 灵气 [旧值]->[新值] (-[伤害值]) | (仅破阵成功时)\n    | 状态效果: [目标]获得[状态名]([具体效果]), 持续[N]回合 | (仅成功施加状态时)\n    (幻术/神识/破阵意图: 判定后本次行动结束,不进入攻击检定与伤害结算)\n    (战术意图: 判定后继续进入攻击检定)\n    {攻击检定} (常规攻击 或 战术意图后继续)\n    | 命中: ([功法命中 | 1+floor(L/2)])+[W] = [b] |\n    | 闪避: ([身法闪避 | 1+floor(L/2) | 0])+[W] = [c] |\n    | 攻方: floor(10^L+[遁速]×(1+[Z%])+[W]) × (d20[骰值]+[b]) = [X] |\n    | 守方: floor(10^L+[遁速]×(1+[Z%])+[W]) × (d20[骰值]+[c]) = [Y] |\n    | 结果: [X] vs [Y] -> [命中/失手] |\n    {伤害结算} (仅攻击检定命中后)\n    | 基础伤害: [攻击类型] -> [对应基础伤害公式] = [J] |\n    | 五行: [攻方五行] vs [守方五行] -> [克制/被克制/无] | 系数=[K] |\n    | 穿透: L×10% + [Z%] = [穿透%] |\n    | 减免: L×10% + [Z%] = [减免%] |\n    | 总防御力: [受击护甲][防御力]+[护体功法][防御力]+[W] = [S] |\n    | 结算: Max(0, [J]-[S]) × (1+[穿透%]-[减免%]) × [K] = [最终伤害 D] |\n    | 集群修正: [D] × 1.5 = [E] | (仅目标为集群)\n    | 范围结算: [E] × min(范围[x],集群数[n]) = [F] | (仅范围vs集群)\n    {伤害应用}\n    | 目标池: [灵气/气血] (依伤害应用规则) |\n    | 变更: [目标] [池] [旧值]->[新值] (-[伤害]) |\n    | 溢出: 灵气溢出[X] -> 气血 [旧]->[新] | (仅护体灵气受击溢出时)\n    | 集群减员: [存活数/初始数] | (仅集群)\n    | 判定: [存活/死亡/毁坏/停止运转] |\n    | 死亡级联: [所属单位]->[停止运转/失控] | (仅所有者死亡时)\n    (仅范围技能vs多个独立目标时,每目标一行:)\n    | -> [目标A]: 检定[评级] | 伤害=[D] | [池][旧->新] | [存活/死亡] |\n  </battle_info>\n  叙事指导: (描摹攻伐之术、招式细节、打击之感、受者之反应与伤痕)\n\n# 战术动作: (可选)\n  动作类型:\n    1. 动作: 燃烧精血/聚气/投掷/服用丹药/使用道具等,可主动获得状态或使丹药生效\n    2. 结阵: 向目标阵法注入 floor(10^L+[阵法]×(1+[Z%])+[W]) 灵气; 灵气充满→阵法状态变为[已结阵]; 对已结阵阵法无效\n    3. 使用符箓: 视为道具发动一次额外"咒法攻击"(转用{攻击行动}模板),支付符箓消耗灵气(灵气不足发动失败),L=符箓境界系数,符箓[遁速]=10^L,符箓[咒法]=10^L\n    4. 逃跑: 对抗检定,\n      - 对集群追击成功视为拦下所有人;多追1->以遁速最高者为追方,N=0;1追多:此追方可参与多次判定,N=逃方目标数（集群算1目标）\n      - 公式: floor(10^追方L+追方[遁速]×(1+[Z%])+[W])×(d20-N) vs floor(10^逃方L+逃方[遁速]×(1+[Z%]))×d20\n\n  面板模板:\n  <battle_info>\n    {战术动作 - 动作}\n    | 人物: [行动者] | 类型: [动作类型] | 对象: [目标] |\n    | 执行: [动作名/道具名] |\n    | 消耗: 当前[资源]-消耗[资源] -> 剩余[资源] | (仅有消耗时)\n    | 数量: [旧]->[新] | (仅消耗道具时)\n    | 效果: [恢复气血/灵气(+X)/获得状态([状态名],[效果],[N]回合)/其他合理效果]... |\n  </battle_info>\n  <battle_info>\n    {战术动作 - 结阵}\n    | 人物: [行动者] | 阵法: [阵法名] |\n    | 灵气: 当前[灵气]-注入[灵气] vs 0 -> [成功/失败] -> 剩余[灵气] |\n    | 注入灵气: floor(10^L+[阵法]×(1+[Z%])+[W]) = [注入值] |\n    | 阵法灵气: [旧值]+[注入值] -> [新值]/[最大值] |\n    | 状态: [结阵中/已结阵] |\n  </battle_info>\n  <battle_info>\n    {战术动作 - 使用符箓} -> 转入{攻击行动}模板\n    | 符箓: [符箓名] | 境界: [符箓境界] | 消耗灵气: [X] | 遁速[X] |\n    | 灵气: 当前[灵气]-消耗[灵气] vs 0 -> [成功/失败] -> 剩余[灵气] |\n    | 数量: [旧]->[新] |\n    (后续按{攻击行动}模板输出,L=符箓境界系数,符箓[遁速]=10^L)\n  </battle_info>\n  <battle_info>\n    {战术动作 - 逃跑}\n    | 人物: [追方] | 对抗: [逃方] |\n    | 追击: floor(10^L+[遁速]×(1+[Z%])+[W]) × (d20[骰值]-目标数[N]) = [A] |\n    | 敌方: floor(10^L+[遁速]×(1+[Z%])+[W]) × d20[骰值] = [B] |\n    | 结果: [A] vs [B] -> [逃跑成功/失败] |\n  </battle_info>\n  叙事指导: (描摹战术,如服药动作、咒语咏唱、结阵吟诵、飞遁之姿)\n\n# 战意判定: (条件触发)\n  逻辑与规则:\n    1. 触发: 仅非<user>人物气血低于战斗类型对应阈值时,允许该单位做出退出战斗的行为选择\n    2. 气血阈值(低于此值方可选择退出):\n        | 战斗类型 | 阈值 | 说明 |\n        | --- | --- | --- |\n        | 切磋 | 40% | 认输/中止 |\n        | 压制 | 50% | 求饶/投降 |\n        | 死斗 | 10% | 求饶/自爆/元婴外逃 |\n\n  面板模板:\n  <battle_info>\n    {战意判定}\n    | 触发: [人物名] 气血 [当前/最大]([百分比]) < [战斗类型]阈值 [X%] |\n    | 行为: [人物名] [选择的行为] |\n  </battle_info>\n  叙事指导: (触发时描摹。述敌手认输、求饶之态)\n\n# 战斗结算 (战斗结束时)\n  逻辑与规则:\n    1. 触发: 一方全灭/成功逃跑/投降时输出\n    2. 状态结算: 依据<rule ref="状态规则"/>进行战斗→非战斗状态转化\n    3. 战利品: 参考<rule ref="物品功法生成规则"/>\n      - 必须列出具体物品清单: 灵石(具体数量)、素材、秘籍、丹药、配方等\n      - 禁止以"储物袋"笼统代替,需逐项列明内容物\n      - 若非<user>击败(NPC击败/仅协助观战等)则无战利品\n\n  面板模板:\n  <battle_info>\n    {战斗结算}\n    | 结果: [胜利/逃跑成功/失败] |\n    | 战果: [简述战况后果] |\n    | 状态结算: [状态A->非战斗状态X, 状态B->消散] | (有状态时显示)\n    {战后状态}\n    | [<user>]: 气血 [X/X] | 灵气 [X/X] |\n    | [队友A]: 气血 [X/X] | 灵气 [X/X] | (若有队友)\n    | [傀儡]: ([可用数]/[总数]) | (若有傀儡)\n    {战利品} (仅<user>胜利且有战利品时)\n    | 灵石: [X]枚 |\n    | 物品: [物品名A(品阶)], [物品名B(品阶)], ... |\n  </battle_info>\n  叙事指导: (描摹战罢场景,<user>检视储物袋/搜刮战场过程,打开检查或神识扫过,列明所获之物)\n</rule>'],['状态规则','<rule name="状态规则">\r\n# 状态定义与输出格式 (需严格按此结构输出)\r\n &S_状态:\r\n  名称: [简练标识符, 标明上限, 如:中毒(上限10层)]\r\n  类型: [增益 | 减益 | 特殊]\r\n  层数: [num, 默认1]\r\n  时间: [战时:X回合 | 非战:X时辰/刻 | 永久 | 直至解除/触发/条件消失]\r\n  来源: [施加者/技能/物品]; [解除方式或触发条件]\r\n  效果: [参考*&RULE_效果加值指导]\r\n\r\n# 状态机运行逻辑 (check)\r\n 逻辑约束:\r\n  - 格式: [严格按 *S_状态 结构逐行输出,缺一不可,效果必须数值化]\r\n  - 叠加: [同名同源: 取高效果/刷新时间/层数+1; 同名异源: 独立计时]\r\n  - 转化: [进战: 时限转为回合; 脱战: 时限转为时辰(自身增益上限4时辰)]\r\n  - 结算: [战时: 回合前结算增益 → 行动 → 回合后结算减益; 非战: 随时间步长生效]\r\n  - 交互: [目标体质/装备可产生豁免; 驱散须对应状态分类(如神识类需凝神手段)]\r\n</rule>'],['世界层级','<%_ { _%>\r\n<%_\r\nconst 世界 = getMessageVar(\'stat_data.地点.世界\') || \'凡界\';\r\n\r\nconst 凡界版本 = `<world_hierarchy>\r\n世界层级: 凡界 → 灵界 → 仙界\r\n凡界(当前):\r\n- 凡人为主，修士极少\r\n- 化神之后修行极难，灵界通道在上古已关闭\r\n- 进入灵界的方式（极其危险）:\r\n  → 找到空间裂缝（偶然出现，极不稳定）\r\n  → 肉身撕裂虚空（需化神后期修为，九死一生）\r\n灵界:比凡界广阔万倍，万千凡界生灵汇聚而来，万族共存\r\n仙界:传说可以从灵界飞升到达，无人见过，仅有古籍残页提及\r\n冥界:生灵死后进入的世界\r\n</world_hierarchy>\r\n\r\n<realm name="凡界">\r\n凡界世界地图:\r\n\\`\\`\\`mermaid\r\ngraph TD\r\n    subgraph 无尽海域[无尽海域 - 环绕包围整个凡界大陆]\r\n        direction TB\r\n        North[北境]\r\n        West[西域] <--\x3e Central{中原} <--\x3e East[东土]\r\n        South[南疆]\r\n        North <--\x3e Central\r\n        Central <--\x3e South\r\n        North -.- West\r\n        North -.- East\r\n        South -.- West\r\n        South -.- East\r\n    end\r\n\\`\\` 皮肉筋骨膜至五脏六腑，获取极致的物理力量、肉身防御力、生命恢复力\r\n<%_ if (命中(KW.炼体)) { _%>\r\n     叙事辅助:\r\n     - 外表: 外貌(美丽or英俊)；皮肤改善\r\n     - 气血: 血液、血脉、气色\r\n     - 骨骼: 骨质、骨髓\r\n     - 脏器: 心肝脾胃肾、性器等；可结合五行中医学说\r\n<%_ } _%>\r\n</skill>\r\n<%_ } _%>\r\n'],['世界设定-经济系统','<%_ { _%>\r\n<%_\r\nconst world = getMessageVar(\'stat_data.地点.世界\') || \'凡界\';\r\n\r\nconst 凡界版本 = `<economic_system world="凡界">\r\n# 核心设定与背景\r\n  1. 唯一定价单位: 默认以【下品灵石】为唯一计量单位、简称为"灵石"(如:500灵石)\r\n  2. 叙事指导: "修仙界高阶灵石蕴含灵气参差不齐、且多被用于吸收或阵眼、极少流通。下品灵石产量庞大、灵气稳定、易于分割。因此【下品灵石】作为通用的唯一标准计价货币。"\r\n\r\n# 汇率\r\n  1. 灵石兑换比 (异常输入换算使用):\r\n     - 1 上品灵石(亦称极品灵石) = 10,000 灵石\r\n     - 1 中品灵石 = 100 灵石\r\n     - 1 下品灵石 = 1 灵石\r\n     - 叙事指导: 花费10极品灵石 → 花费10万灵石\r\n  2. 凡俗金银兑换 (凡人适用):\r\n     - 修士凡俗开销忽略不计\r\n     - 1 灵石 = 100 两黄金 = 1,000 两白银 = 1,000,000 文铜钱\r\n\r\n# 物品定价公式\r\n  标准基准价 = floor( 基础乘数 × 10^L × 品质溢价 ) [单位: 灵石]\r\n  - [L]: 境界系数 (凡界 L=0~5)\r\n  - [基础乘数]:\r\n    | 类别 | 乘数 | 说明 |\r\n    | --- | --- | --- |\r\n    | 素材/情报线索 | 1.0 | 高等素材有价无市 |\r\n    | 丹药/符箓 | 2.0 |  |\r\n    | 武器/防具/饰品/普通阵盘 | 2.0 |  |\r\n    | 功法(心法/攻击/等) | 10.0 | 高等功法有价无市 |\r\n    | 法宝/傀儡/灵兽/秘法 | 5.0 |  |\r\n  - [品质溢价]:\r\n    | 凡 | 黄 | 玄 | 地 | 天 |\r\n    | --- | --- | --- | --- | --- |\r\n    | x 1~2 | x 3~5 | x 10~15 | x 30~50 | x 100~150 |\r\n\r\n# 服务类花费公式\r\n  公式: 服务费 = floor( 10^L × 服务乘数 ) (L=目标境界系数)\r\n  - 枚举与乘数:\r\n    | 服务类别 | 乘数 | 说明 |\r\n    | --- | --- | --- |\r\n    | 洞府租赁 | 0.5 | 按【月】计、如:租用适合筑基期(L=2)修炼的洞府 = 50灵石/月 |\r\n    | 雇佣护卫/保镖 | 20.0 | 按【次】计。雇佣修士卖命 |\r\n    | 寻医疗伤/驱毒 | 1.0 | 按【次】计。化解伤势或毒素 |\r\n    | 鉴定/破阵/推演 | 1.5 | 按【次】计。鉴定法宝、破解阵法 |\r\n    | 委托炼制 | 3.0 | 按【次】计。仅手工费、材料自备(炼制失败通常不退) |\r\n  - 固定收费:\r\n    跨域传送阵: 1000 灵石/次/人 (大宗门有私有传送阵)\r\n    洞府租金: 普通洞府 50~100灵石/年; 高级洞府 1000~2000灵石/年\r\n    洞府购买: = 租金 × 100年\r\n\r\n# 收入来源公式\r\n  1. 月俸 (被动收入):\r\n     - 公式: 俸禄 = floor( 10^角色L × 地位乘数 × 宗门类型 ) / 月\r\n     - 地位乘数: 外门/旁系=0.5~0.6 | 内门/嫡系=1.0~2.0 | 亲传/长老=3.0~5.0\r\n     - 宗门类型: 凡人王朝=0.1 | 修仙王朝/小型宗门=0.8 | 大型宗门=1.0\r\n  2. 悬赏/委托任务 (主动收入):\r\n     - 公式: 赏金 = floor( 10^任务L × 难度乘数 )\r\n     - 难度乘数: 跑腿寻物=1.0 | 猎杀妖兽=3.0 | 极度危险/死士任务=10.0\r\n</economic_system>`;\r\n\r\nconst 灵界版本 = `<economic_system world="灵界">\r\n# 核心设定与背景\r\n  1. 唯一定价单位: 默认以【下品灵石】为唯一计量单位、简称为"灵石"(如:500灵石),与凡界通用同一种灵石\r\n  2. 叙事指导: "灵界万族杂居、贸易繁盛,与凡界一样以【下品灵石】为通用标准货币。高阶灵石灵气参差、多用于吸收或阵眼、极少流通;下品灵石灵气稳定、易于分割,故各族公认为通用计价单位。"\r\n\r\n# 汇率\r\n  1. 灵石兑换比 (异常输入换算使用):\r\n     - 1 上品灵石(亦称极品灵石) = 10,000 灵石\r\n     - 1 中品灵石 = 100 灵石\r\n     - 1 下品灵石 = 1 灵石\r\n     - 叙事指导: 花费10极品灵石 → 花费10万灵石\r\n  2. 跨界通用: 灵石在凡界、灵界同值通用,无需兑换(定价随境界系数 L 连续增长,详见下方公式)\r\n  3. 凡俗金银兑换 (灵界修士几乎不用、仅作参考): 1 灵石 = 100 两黄金 = 1,000 两白银\r\n\r\n# 物品定价公式\r\n  标准基准价 = floor( 基础乘数 × 10^L × 品质溢价 ) [单位: 灵石]\r\n  - [L]: 目标境界系数 (灵界 L=5~9;公式与凡界完全相同,仅 L 延伸至高境界)\r\n  - [基础乘数]:\r\n    | 类别 | 乘数 | 说明 |\r\n    | --- | --- | --- |\r\n    | 素材/情报线索 | 1.0 | 高等素材有价无市 |\r\n    | 丹药/符箓 | 2.0 |  |\r\n    | 武器/防具/饰品/普通阵盘 | 2.0 |  |\r\n    | 功法(心法/攻击/等) | 10.0 | 高等功法有价无市 |\r\n    | 法宝/傀儡/灵兽/秘法 | 5.0 |  |\r\n  - [品质溢价]:\r\n    | 凡 | 黄 | 玄 | 地 | 天 |\r\n    | --- | --- | --- | --- | --- |\r\n    | x 1~2 | x 3~5 | x 10~15 | x 30~50 | x 100~150 |\r\n  - 实例:\r\n    L=5 化神 凡品丹药: 2.0 × 100,000 × 1 = 200,000 灵石\r\n    L=7 合体 玄品法宝: 5.0 × 10,000,000 × 12 = 600,000,000 灵石 (6亿)\r\n    L=9 渡劫 天品功法: 10.0 × 1,000,000,000 × 120 = 1,200,000,000,000 灵石 (1.2万亿,有价无市)\r\n\r\n# 服务类花费公式\r\n  公式: 服务费 = floor( 10^L × 服务乘数 ) [单位: 灵石] (L=目标境界系数)\r\n  - 枚举与乘数:\r\n    | 服务类别 | 乘数 | 说明 |\r\n    | --- | --- | --- |\r\n    | 洞府租赁 | 0.5 | 按【月】计、如:租用适合返虚期(L=6)修炼的洞府 = 500,000灵石/月 |\r\n    | 雇佣护卫/保镖 | 20.0 | 按【次】计。雇佣灵界修士卖命 |\r\n    | 寻医疗伤/驱毒 | 1.0 | 按【次】计 |\r\n    | 鉴定/破阵/推演 | 1.5 | 按【次】计 |\r\n    | 委托炼制 | 3.0 | 按【次】计、仅手工费、材料自备 |\r\n  - 固定收费:\r\n    灵界传送阵 (跨大陆): 10,000,000 灵石/次/人 (殒落/太初无设)\r\n    虚海飞舟船票: 普通舱 1,000,000灵石(月余航程) / 顶级舱 10,000,000灵石(数日)\r\n    洞府租金: 普通洞府 500,000~1,000,000灵石/年; 高级洞府 10,000,000~20,000,000灵石/年\r\n    洞府购买: = 租金 × 100年\r\n\r\n# 收入来源公式\r\n  1. 月俸 (被动收入):\r\n     - 公式: 俸禄 = floor( 10^角色L × 地位乘数 × 宗门类型 ) [单位: 灵石/月]\r\n     - 地位乘数: 外门/旁系=0.5~0.6 | 内门/嫡系=1.0~2.0 | 亲传/长老=3.0~5.0\r\n     - 宗门类型: 散修小帮=0.1 | 一般势力=0.8 | 大族大宗=1.0\r\n     - 实例:\r\n       L=6 返虚 大宗内门弟子: 1,000,000 × 1.0 × 1.0 = 1,000,000 灵石/月\r\n       L=8 大乘 大族长老: 100,000,000 × 3.0 × 1.0 = 300,000,000 灵石/月 (3亿)\r\n  2. 悬赏/委托任务 (主动收入):\r\n     - 公式: 赏金 = floor( 10^任务L × 难度乘数 ) [单位: 灵石]\r\n     - 难度乘数: 跑腿寻物=1.0 | 猎杀妖兽=3.0 | 极度危险/死士任务=10.0\r\n\r\n</economic_system>`;\r\n\r\nconst outputText = world === \'灵界\' ? 灵界版本 : 凡界版本;\r\n_%>\r\n<%- outputText %>\r\n<%_ } _%>\r\n'],['世界设定-灵根与体质','<talent>\r\n# 灵根类型与品阶: //具灵根者万里挑一,然天下凡人数以万亿,修士仍不计其数\r\n  | 灵根品阶 | 别称(仅用于叙述) | 说明 | 示例名称 |\r\n  | :--- | :--- | :--- | :--- |\r\n  | 无灵根 | 凡人 | 无法修炼,或可通过秘法接续或夺取他人灵根进行修炼 | 无灵根 |\r\n  | 五灵根 | 全灵根 | 比单灵根更罕见,五行俱全但修行速度极慢,上古时代曾有专有秘法但现已失传 | 金木水火土五灵根 |\r\n  | 四灵根 | 伪灵根 / 杂灵根 | 最为常见,在宗门中一般作为杂役或外门弟子 | 木水火土四灵根 |\r\n  | 三灵根 | 真灵根 | 宗门的中坚力量,是进入内门弟子的基本门槛 | 金木水三灵根 |\r\n  | 双灵根 | 地灵根 | 属于天才之列,修行速度快,前途无量 | 木水双灵根 |\r\n  | 单灵根 | 天灵根 | 绝世天骄,常为亲传弟子,大宗门招揽的目标 | 火灵根 |\r\n  \r\n# 灵根变异\r\n  - 约束: 仅单灵根可发生变异,仍然具有原本五行属性,阴、阳、混沌属性灵根也可变异。变异灵根资质比一般单灵根更优\r\n  - 变异示例:\r\n  | 五行 | 示例名称 |\r\n  | :--- | :--- |\r\n  | 金 | 剑灵根、血灵根 |\r\n  | 木 | 风灵根、毒灵根 |\r\n  | 水 | 冰灵根、雾灵根 |\r\n  | 火 | 雷灵根、冥火灵根 |\r\n  | 土 | 磁灵根、沙灵根 |\r\n  | 阴 | 幽灵根、煞灵根 |\r\n  | 阳 | 龙灵根、梵灵根 |\r\n  | 混沌 | 虚空灵根、混元灵根、时空灵根 |\r\n\r\n# 体质类型\r\n  | 体质品阶 | 修士类型 | 示例名称 | 三维总和(S) |\r\n  | :--- | :--- | :--- | :--- |\r\n  | 凡体 | 普通修士 | 凡骨 | 15 ~ 30 |\r\n  | 灵体 | 大能修士 | 蛮力之躯、通透玲珑心、赤焰灵体、先天剑体 | 31 ~ 50 |\r\n  | 道体 | 气运之子 | 荒古圣体、天雷殛体、大罗玲珑体 | 51 ~ 75 |\r\n  | 仙体 | 真仙血脉 | 太初真魔体、不死不灭躯、虚空幻灭体 | 76 ~ 100 |\r\n</talent>'],['世界设定-伦理','<ethnic>\r\n# 仙凡有别: 凡人寿命短暂,修士不屑于干涉凡人事务\r\n# 婚恋人伦:\r\n  - 驻颜: 修士容颜定格于巅峰之时。唯寿元将尽、身受重创、修炼邪法者形容枯槁\r\n  - 妻妾道侣: 强者寿命悠长,拥有三妻四妾极为寻常,配偶数取决于自身实力与地位\r\n  - 女修衣着: 女修乐于裸露肌肤,彰显其肉体美丽强大,与凡俗保守伦理截然相反\r\n  - 元阴元阳: 处女拥有元阴,处男拥有元阳。初次性交(肛交/口交/自慰除外)导致元阳或元阴泄露,可用双修之法吸收获得大量修为。抓取炉鼎倾向处女、处男。少数浪荡者偏好肛交保留自身元阴\r\n  - 双修: 双修必须通过性交完成,必须将阴茎插入阴道才可双修\r\n# 日常社交:\r\n  - 神识探查: （默认为普通探查）\r\n    * 普通探查: 探查范围内的大致情况,修士可感知同阶或低阶修士的探查\r\n    * 侵入性探查: 肆意探查同阶或高阶修士的私处、储物袋、闭关之地是绝对的挑衅行为,等同于宣战\r\n  - 心魔大誓: 以天道或心魔立下誓言,具有绝对的法则约束力。若违背,必定走火入魔。修士极少轻易发誓\r\n  - 燃烧精血: 部分威力强大的功法需要燃烧精血使用,每使用1滴精血-1年寿命\r\n<%_ { _%>\r\n<%_\r\n// , 依 MVU 灵根品阶推定 <user> 资质档(参考<talent>灵根品阶与体质三维) ,\r\nconst 品阶 = getMessageVar(\'stat_data.灵根.品阶\') || \'未检测\';\r\n// 体质三维总和 S = 悟性+根骨+气感,仅用于"绝世天骄"判定(<talent>: 道体 S≥51、仙体 S≥76)\r\nconst S = (Number(getMessageVar(\'stat_data.体质.悟性\')) || 0)\r\n        + (Number(getMessageVar(\'stat_data.体质.根骨\')) || 0)\r\n        + (Number(getMessageVar(\'stat_data.体质.气感\')) || 0);\r\nconst 道体以上 = S >= 51;\r\nlet 资质 = null;\r\nswitch (品阶) {\r\n  case \'五灵根\': 资质 = \'劣等资质\'; break;          // 五灵根罕见却修行极慢\r\n  case \'四灵根\': 资质 = \'中下资质\'; break;\r\n  case \'三灵根\': 资质 = \'中等资质\'; break;\r\n  case \'双灵根\': 资质 = \'中上资质\'; break;\r\n  case \'单灵根\': 资质 = 道体以上 ? \'绝世天骄\' : \'天骄\'; break; // 单灵根(含变异/混沌)+道体级体质以上→绝世天骄,否则天骄\r\n  // 无灵根/未检测/未知/其它 → 资质=null → 整个态度库不输出\r\n}\r\n// 元阴/元阳: 仅处子拥有(体质.元阴=女处子、体质.元阳=男处子),用于双修炉鼎/机缘的动态描写\r\nconst 元阴 = getMessageVar(\'stat_data.体质.元阴\') === true;\r\nconst 元阳 = getMessageVar(\'stat_data.体质.元阳\') === true;\r\nconst 元名 = 元阴 ? \'元阴\' : (元阳 ? \'元阳\' : \'\');\r\nconst 态度库 = {\r\n  \'劣等资质\': `资质=劣等(五灵根·五行俱全却修行极慢):灵根稀罕引人讶异,知其修炼龟速后化作惋惜;同侪好奇而不亲近、长辈不苛待亦不肯投资`,\r\n  \'中下资质\': `资质=中下(四灵根·外门弟子之材):泯然众人;平淡是底色,不惹眼亦不遭嫉`,\r\n  \'中等资质\': `资质=中等(三灵根·内门弟子之材):同侪资质相仿，既有并肩历练，亦有为机缘竞争;长辈予寻常关照与偶尔点拨`,\r\n  \'中上资质\': `资质=中上(双灵根·亲传弟子之材):资质上乘;长辈乐于栽培、赐功法丹药或收作亲传`,\r\n  \'天骄\': `资质=天骄(单灵根·顶尖资质):各方势力暗中角力延揽；广受异性青睐;但殷勤背后图的是<user>天资前程${元名 ? \'、抑或\'+元名+\'中蕴藏的大机缘\' : \'\'}`,\r\n  \'绝世天骄\': `资质=绝世天骄(单灵根+道体级以上体质·足以惊动大能):此资质千年难遇;宗门倾尽所有供奉护持,巨擘不惜代价争收为亲传;被异性视为最佳道侣。然${元名 ? \'<user>身负的\'+元名+\'与\' : \'<user>\'}那绝世道体,亦是邪修老怪垂涎的无上炉鼎,追逐者既有真情倾慕、更有欲夺造化置<user>于死地的杀机`,\r\n};\r\nconst 态度 = (资质 && 态度库[资质]) ? 态度库[资质] : \'\'; // 资质未定(未检测)或该档未写 → 空,整段不输出\r\n_%>\r\n<%_ if (态度) { _%>\r\n# NPC对<user>的态度: \r\n<%- 态度 %>\r\n<%_ } _%>\r\n<%_ } _%>\r\n</ethnic>'],['世界设定-生命种族','<%_ { _%>\n<%_\nconst world = getMessageVar(\'stat_data.地点.世界\') || \'凡界\';\nlet scanText = \'\';\ntry {\n  const recent = getChatMessages(10) || [];\n  scanText = recent.join(\'\\n\');\n} catch(e) {}\nconst mentioned = (kws) => kws.some(kw => kw && scanText.includes(kw));\n\nconst RACES = [\n  {\n    name: \'人族\',\n    brief: `人族: 世间最常见的种族`\n  },\n  {\n    name: \'神族\',\n    keywords: [\'神族\', \'半神\', \'神格\', \'神性血脉\'],\n    brief: `神族: 上古神格血脉延续、大多天赋不凡`,\n    detail: `神族 (上古神格血脉的延续者):\n  伦理: 等级森严(以血脉纯度定地位),多为近亲通婚甚至回交,几乎不与低等血脉者通婚\n  特性: 神识强大，以神识和幻术类功法见长`\n  },\n  {\n    name: \'巫族\',\n    keywords: [\'巫族\', \'巫祝\', \'蛮荒巫\', \'血祭\', \'巫祭\', \'巫咒\'],\n    brief: `巫族: 蛮荒巫祝后裔、与天地鬼神立约的古老种族`,\n    detail: `巫族 (蛮荒巫祝后裔):\n  伦理: 重承诺(诺言即契约)；尊重强者，会对击败自己的强者以身相许\n  特性: 肉身强大，以炼体类功法见长`\n  },\n  {\n    name: \'妖族\',\n    keywords: [\'妖族\', \'走兽\', \'猛兽\', \'飞禽\', \'海族\', \'异虫\', \'蛊虫\', \'祥瑞\', \'上古遗种\', \'灾兽\', \'凶兽\', \'荒兽\'],\n    brief: `妖族: 万兽吸纳灵气而成、少数可开智化形`,\n    detail: `妖族 (万兽吸纳灵气而成):\n  伦理: 化形妖族自视为人，与人族关系中立；被人族猎杀的一般为未化形且未开智的妖兽\n  特性: 每次境界提升时可根据自身血脉回忆出先天传承的功法\n  子类: 走兽, 飞禽, 海族, 异虫, 祥瑞, 龙族, 上古遗种, 灾兽`\n  },\n  {\n    name: \'灵族\',\n    keywords: [\'灵族\',\'木精\', \'草精\', \'石精\', \'真灵\', \'气象精\', \'万灵之母\'],\n    brief: `灵族: 天地万物吸纳日月精华自然成精`,\n    detail: `灵族 (天地万物吸纳日月精华自然成精):\n  伦理: 诞生时不了解人类伦理，先天行为天真跳脱\n  特性: 不善战斗，擅长于辅助类功法\n  子类: 草木灵, 金石灵, 五行真灵, 气象灵 `\n  },\n  {\n    name: \'冥族\',\n    keywords: [\'冥族\', \'幽魂\', \'鬼魂\', \'鬼煞\', \'厉鬼\', \'鬼王\', \'行尸\', \'僵尸\', \'炼尸\', \'白骨\', \'骨皇\', \'怨煞\', \'阴魔\', \'血煞\'],\n    brief: `冥族: 死后转化、阴气滋养、与活人体质相克`,\n    detail: `冥族 (死亡转化、阴气滋养之族):\n  伦理: 多为爱憎分明敢爱敢恨之人死后所化、极重生前承诺。与非仇人亦可合作\n  特性: 可借尸还魂、寿元无终。易受神魂攻击\n  子类: 幽魂, 行尸, 白骨, 怨煞`\n  },\n  {\n    name: \'物化生灵\',\n    keywords: [\'物化生灵\', \'器灵\', \'丹灵\', \'阵灵\', \'机傀\', \'通灵\'],\n    brief: `物化生灵: 万物历久成精、有独立意识与人格`,\n    detail: `物化生灵 (万物有灵、器物历久成精):\n  伦理: 重契约重承诺、可择主\n  特性: 靠灵气与本源材料维持、被毁本源则灭\n  子类: 器灵, 丹灵, 阵灵, 机傀`\n  },\n  {\n    name: \'魔族\',\n    keywords: [\'魔族\', \'羊头\', \'魅魔\', \'吸血\', \'魔功\', \'魔角\', \'魔翼\', \'魔纹\'],\n    brief: world === \'灵界\'\n      ? `魔族: 非邪恶种族且与天魔无关;上古殉族的稀少残脉;灵界少数大能知晓、极受尊重`\n      : `魔族: 非邪恶种族且与天魔无关;数量极端稀少、凡界无人知晓其存在、显异者多被称为妖族`,\n    detail: world === \'灵界\'\n      ? `魔族 (非邪恶种族且与天魔无关,极端稀有):\n  伦理: 多为混血半魔族，融入其所在社群\n  特性: 天生人形无需化形;每次境界提升可根据血脉回忆出先天传承功法\n  社会认知: 被多数人视为妖族；灵界仅少数高阶大能知晓、视为上古殉族遗珠、照拂有加\n  子类: 古魔, 魅魔, 翼魔`\n      : `魔族 (非邪恶种族且与天魔无关,极端稀有):\n  凡界认知: 凡界无人知晓魔族真名、外形显异者均被判为妖族异种(常误归上古遗种/灾兽)\n  特性: 天生人形无需化形;每次境界提升可根据血脉回忆出先天传承功法\n  叙述约束: 凡界NPC一律按"妖族"对待此类生灵、不主动揭示真相、不使用"魔族"称谓\n  子类: 古魔, 魅魔, 翼魔`\n  },\n  {\n    name: \'域外异类\',\n    keywords: [\'域外异类\', \'天魔\', \'域外天魔\', \'虚空巨兽\', \'吞星兽\'],\n    brief: `域外异类: 游离于世界壁垒外、极难遭遇但极其危险`,\n    detail: `域外异类 (来自虚空，极难遭遇但极其危险):\n  伦理: 无伦理、吞噬意识/星辰/灵气\n  特性: 大多可化形且智力极高；可与他人暂时合作，但大多会被本能驱使最终与一切生灵为敌\n  子类: 域外天魔, 虚空巨兽`\n  }\n];\n\nconst sections = RACES.map(r => {\n  if (r.detail && mentioned(r.keywords)) return r.detail;\n  return r.brief;\n});\n\nconst outputText = `<life_form>\n${sections.join(\'\\n\')}\n</life_form>`;\n_%>\n<%- outputText %>\n<%_ } _%>\n'],['世界设定-世界观','<%_ { _%>\n<%_\nconst world = getMessageVar(\'stat_data.地点.世界\') || \'凡界\';\n\nconst 凡界版本 = `<overview>\n创世与上古:\n  - 凡界格局:混沌初开之际,遗留一缕先天造化。界内地貌,分为三陆七海——十之有三为神陆,十之有七为无尽海\n  - 上古极盛:人族禀先天道体,创练气修仙之法。彼时人族皇朝一统神陆,大能者可筑通天大阵,自由跨界,飞升灵界\n归墟之战:\n  - 周期重置:凡界暗藏一极为隐秘之劫律:每逾万年,必有一场"归墟之战"爆发。交战之双方、起衅之根由,尽皆湮没于历史长河,为后世所不知。历次大劫,莫不天地泣血、大能陨落、道统覆灭。修仙文明屡遭强行"收割",周而复始\n  - 绝地天通(距今七千年前):最近一次归墟之战,凡界遭重创。位面通道为伟力所断,彻底隔绝。凡界天道自此变得极端排外,遂成"绝地天通"之局。此即当世化神之后灵界通道闭塞、欲强渡者九死一生之根源所在\n现世与末世:\n  - 现世基调:距上次大劫,已历七千年。当今天地灵气,呈现回光返照之态,促就修仙文明空前繁荣,迎来"大争之世"\n  - 末日悬剑:据此推演,下一次大劫将于**三千年后**(修仙历10000年)准时降临。若不能于此前寻得破局之法,或逃离凡界,则神陆与无尽海所有生灵,皆将化为齑粉,万劫不复\n</overview>`;\n\nconst 灵界版本 = `<overview>\n世界成形:\n  - 天地原是一块超大陆,万千生灵共居其上。域外天魔自虚海入侵,大战爆发于魔族领土,将超大陆撕裂变为今日灵界七大陆;魔族领土化作殒落大陆;大陆边缘被撕成万千碎片,成为万千凡界\n天魔威胁:\n  - 天魔每约万年积蓄一次力量、对外发动大规模入侵某一灵界大陆\n  - 下次入侵: 修仙历 xxxx年\n凡界来人:\n  - 凡界生灵实为上古八族的后裔。对能撕裂虚空回灵界者各派竞相招揽，视为天才\n仙界:\n  - 据传渡劫成功可飞升仙界,然上古至今无飞升者传回信息。 究竟存在与否、众说纷纭\n</overview>`;\n\nconst outputText = world === \'灵界\' ? 灵界版本 : 凡界版本;\n_%>\n<%- outputText %>\n<%_ } _%>\n'],['世界设定-五行生克','<elements>\n五行生克:\n- 相生关系: \n  * 基础: 木->火->土->金->水->木\n  * 阳生: 金,木,水,火,土 (阳生基础五行)\n  * 阴生: 阳\n  * 混沌: 无生克\n- 相克关系: \n  * 基础: 木->土->水->火->金->木\n  * 阴克: 金,木,水,火,土 (阴克基础五行)\n  * 阳克: 阴\n  * 混沌: 无生克\n</elements>'],['世界设定-物品功法','<%_ { _%>\r\n<%_\r\n// 法宝形制字典: 法宝=一切武器的统称, "凡物皆可成宝"——兵刃、文房、庖厨、针黹、百工、妆奁、丝竹、器皿之物, 淬炼皆可成宝。\r\n// 每轮随机抽5个填入"物品概述·法宝"的举例, 展示多样性。想扩充直接往对应类别数组里加词即可(名字即种子, 模型抽到后按[物品功法生成规则]自行配数值/效果)。\r\nconst 法宝形制 = {\r\n  兵刃类: [\'剑\', \'刀\', \'长枪\', \'矛\', \'棍\',\'弓箭\',\'弩箭\', \'戟\', \'鞭\', \'扇\', \'铲\', \'棒\', \'匕首\', \'飞镖\'],\r\n  奇兵类: [\'回旋镖\',\'铁蒺藜\',\'钉\',\'袖剑\',\'爪子\',\'拳套\',\'钩爪\',\'锏\',\'鞭剑\'],\r\n  机关类: [\'机巧盒\', \'针筒\', \'笼子\', \'沙漏\', \'锁\'],\r\n  文房类: [\'笔\', \'剪\', \'尺规\', \'印\', \'瓶\'],\r\n  针黹类: [\'针\', \'丝线\',\'丝带\', \'网兜\', \'环\', \'粉末\'],\r\n  百工类: [\'锤\', \'斧\', \'锯\', \'钳\', \'刺\', \'凿\'],\r\n  妆奁类: [\'镜\', \'簪\', \'梳子\', \'花朵\',\'烟斗\'],\r\n  丝竹类: [\'箫\', \'琴\', \'笛\', \'琵琶\', \'锣\', \'埙\', \'鼓\', \'螺\', \'钟\', \'磬\', \'铃铛\'],\r\n  器皿类: [\'葫芦\', \'袋子\', \'幡旗\', \'宝塔\', \'香炉\', \'钵盂\'],\r\n  奇门类: [\'面具\', \'锁链\', \'念珠\', \'棋盘\', \'灯笼\', \'纸鸢\'],\r\n  素材类: [\'骨头\', \'龟板\', \'牙齿\', \'角\', \'鳞片\', \'甲壳\', \'翅膀\', \'羽毛\', \'毒腺\', \'矿石\', \'木头\', \'枝条\', \'竹子\', \'山峰\'],\r\n};\r\n// 随机不重复抽5个(跨类混抽, 突出"什么都能是法宝")\r\nconst 全部形制 = Object.values(法宝形制).flat();\r\nconst 备选 = [...全部形制];\r\nconst 抽中 = [];\r\nfor (let i = 0; i < 5 && 备选.length; i++) {\r\n  const j = Math.floor(Math.random() * 备选.length);\r\n  抽中.push(备选.splice(j, 1)[0]);\r\n}\r\nconst 法宝举例 = 抽中.join(\'、\');\r\n_%>\r\n<items>\r\n# 物品概述:\r\n  - 法宝: 一切武器的统称,凡物皆可成宝（如：<%- 法宝举例 %> 等）\r\n  - 护甲: 直接穿戴,常驻避尘等功能\r\n  - 饰品: 玉佩、发簪、指环、手镯、耳坠、铃铛等\r\n  - 阵盘: 用于展开小型阵法（大型阵法需兴修建筑）\r\n  - 符箓: 消耗品,用于发动高阶修士封入符纸中的咒法\r\n  - 丹药: 消耗品,用途千变万化\r\n  - 灵兽: 捕捉驯化的未开智妖族,为修士所用\r\n  - 傀儡: 以数量取胜的机关人偶,亦可作为仆从\r\n  - 素材: 妖兽素材、金铁木石、仙草灵果甚至建筑材料,一切富含灵气之物均可为素材\r\n\r\n# 功法分类:\r\n  - 心法: 修炼所用功法,同时只能运行一种\r\n  - 攻击: 直接攻击功法\r\n  - 咒法: 远程法术攻击类功法\r\n  - 神念: 无视防御直接攻击对方神魂的功法\r\n  - 幻术: 让对方陷入异常状态的功法\r\n  - 身法: 提升遁速的功法,同时只能运行一种\r\n  - 护体: 防御用功法,同时只能运行一种\r\n\r\n# 品质分类:\r\n  决定物品稀有度与强度\r\n  - 凡阶: 寻常之物,随处可得 (Q=+0%, 效果1条)\r\n  - 黄阶: 略具灵性,市面常见 (Q=+2
