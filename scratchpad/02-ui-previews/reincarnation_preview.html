<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>轮回转生面板 · 设计预览 v3</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', 'SimSun', serif;
    background: #1a1a2e; color: #e8d5b7; line-height: 1.7; padding: 22px 14px 60px;
  }
  body[data-theme='light'] { background: #f5efe1; color: #2a2520; }
  .demo-bar { max-width: 1000px; margin: 0 auto 16px; padding: 10px 16px; border: 1px dashed #a89968; border-radius: 8px; font-size: 13px; color: #a89888; background: rgba(168,153,104,0.06); }
  body[data-theme='light'] .demo-bar { color: #6a5a46; background: rgba(201,169,110,0.1); }
  .demo-bar b { color: #e8d5b7; } body[data-theme='light'] .demo-bar b { color: #2a2520; }
  .demo-switch { display: flex; gap: 10px; margin-top: 8px; }
  .demo-switch button { font: inherit; font-size: 12px; cursor: pointer; padding: 3px 14px; border-radius: 999px; border: 1px solid rgba(168,153,104,0.45); background: transparent; color: inherit; }
  .demo-switch button.active { background: #a89968; color: #1a1a2e; font-weight: 700; }

  .rc-panel { position: relative; max-width: 1000px; margin: 0 auto 22px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(155deg, rgba(20,16,32,0.92), rgba(28,22,44,0.9) 60%, rgba(20,16,32,0.94)); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 14px 44px rgba(0,0,0,0.45); }
  body[data-theme='light'] .rc-panel { background: linear-gradient(155deg, #fffdf7, #f5eedf); border-color: rgba(160,127,72,0.45); box-shadow: 0 6px 24px -8px rgba(42,37,32,0.22); }
  .rc-panel::before { content: ''; position: absolute; top:0; left:0; right:0; height:3px; background: linear-gradient(90deg, transparent, #f6ad55, transparent); }
  .rc-head { display: flex; align-items: center; gap: 10px; padding: 11px 18px; cursor: pointer; user-select: none; background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); border-bottom: 1px solid rgba(255,255,255,0.07); }
  .rc-head .rc-icon { font-size: 18px; color: #f6ad55; filter: drop-shadow(0 0 8px rgba(246,173,85,0.55)); }
  .rc-head .rc-title { flex: 1; font-size: 1.05em; font-weight: 700; letter-spacing: 2px; color: #f6ad55; }
  body[data-theme='light'] .rc-head .rc-title { color: #8a6a2f; }
  .rc-head .rc-fold { opacity: 0.6; transition: transform .3s; }
  .rc-panel.collapsed .rc-fold { transform: rotate(-90deg); }
  .rc-panel.collapsed .rc-body { display: none; }
  .rc-body { padding: 16px 20px 18px; }

  .rc-dead { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 12px; margin-bottom: 12px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-left: 3px solid #f6ad55; font-size: 0.92em; }
  .rc-dead .k { color: #a89888; } body[data-theme='light'] .rc-dead .k { color: #6a5a46; }
  .rc-dead .v { font-weight: 600; } .rc-dead .v.dead-name { color: #f6ad55; font-weight: 700; }

  .rc-deeds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .rc-deeds { grid-template-columns: 1fr; } }
  .rc-deed-col { border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.07); }
  .rc-deed-col.good { border-top: 3px solid #68d391; } .rc-deed-col.evil { border-top: 3px solid #fc8181; }
  .rc-deed-head { display: flex; gap: 6px; align-items: center; padding: 6px 12px; font-weight: 700; }
  .rc-deed-col.good .rc-deed-head { color: #68d391; } .rc-deed-col.evil .rc-deed-head { color: #fc8181; }
  .rc-deed-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 0.88em; }
  .rc-deed-row .t { flex: 1; } .rc-deed-row .p { font-weight: 700; }
  .rc-deed-row.good .p { color: #68d391; } .rc-deed-row.evil .p { color: #fc8181; }
  .rc-deed-total { display: flex; justify-content: space-between; padding: 6px 12px; font-size: 0.86em; background: rgba(255,255,255,0.04); border-top: 1px dashed rgba(255,255,255,0.1); font-weight: 600; }
  .rc-deed-total.good .sum { color: #68d391; } .rc-deed-total.evil .sum { color: #fc8181; }

  .rc-zw { display: flex; gap: 8px 18px; align-items: center; flex-wrap: wrap; margin: 12px 0; padding: 6px 12px; font-size: 0.86em; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px dashed rgba(168,153,104,0.4); }
  .rc-zw .z { color: #b794f4; font-weight: 700; } .rc-zw .w { color: #f6ad55; font-weight: 700; }

  .rc-calc { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 12px 0; }
  @media (max-width: 720px) { .rc-calc { grid-template-columns: 1fr; } }
  .rc-calc-box { padding: 10px 14px; border-radius: 10px; background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); border: 1px solid rgba(255,255,255,0.08); }
  .rc-calc-box .label { font-size: 0.76em; color: #a89888; letter-spacing: 2px; margin-bottom: 4px; }
  .rc-calc-box .formula { font-size: 0.82em; color: #c5b696; }
  .rc-calc-box .result { font-size: 1.4em; font-weight: 700; margin-top: 4px; }
  .rc-calc-box .result.penalty { color: #fc8181; } .rc-calc-box .result.verdict { color: #f6ad55; }
  .rc-grade-tag { display: inline-block; margin-top: 6px; padding: 2px 12px; border-radius: 999px; font-size: 0.78em; font-weight: 700; letter-spacing: 1px; background: rgba(104,211,145,0.16); color: #68d391; border: 1px solid rgba(104,211,145,0.4); }
  .rc-grade-tag.evil { background: rgba(252,129,129,0.16); color: #fc8181; border-color: rgba(252,129,129,0.4); }

  .rc-path { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 14px; }
  .rc-path-btn { padding: 12px 14px; border-radius: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.09); background: rgba(255,255,255,0.03); transition: all .18s ease; }
  .rc-path-btn:hover { transform: translateY(-1px); }
  .rc-path-btn .pn { font-weight: 700; letter-spacing: 1px; } .rc-path-btn .pd { font-size: 0.78em; color: #a89888; margin-top: 2px; }
  .rc-path-btn.sel { border-color: #f6ad55; box-shadow: 0 0 0 1px #f6ad55 inset; } .rc-path-btn.sel .pn { color: #f6ad55; }

  .rc-budget { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 14px; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); font-size: 0.88em; }
  .rc-budget .b-label { color: #a89888; } body[data-theme='light'] .rc-budget .b-label { color: #6a5a46; }
  .rc-budget .b-num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rc-budget .b-num.bud { color: #f6ad55; } .rc-budget .b-num.spent { color: #93dca5; }
  .rc-budget .b-num.left { color: #b794f4; } .rc-budget .b-num.over { color: #fc8181; }
  .rc-budget .b-hint { margin-left: auto; font-size: 0.76em; color: #a89888; }

  .rc-group { margin: 0 0 14px; padding: 12px 14px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); }
  body[data-theme='light'] .rc-group { border-color: rgba(160,127,72,0.18); }
  .rc-group-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 0.88em; font-weight: 700; color: #c5b696; letter-spacing: 1px; margin-bottom: 8px; }
  body[data-theme='light'] .rc-group-title { color: #6e4f1d; }
  .rc-group-title .g-note { font-weight: 400; font-size: 0.78em; color: #8a8070; }
  .rc-group-title .g-cost { margin-left: auto; font-size: 0.82em; font-weight: 600; color: #93dca5; }
  .rc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .rc-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); font-size: 0.85em; transition: all .15s ease; }
  .rc-chip:hover { border-color: rgba(255,255,255,0.25); }
  .rc-chip.sel { border-color: #f6ad55; color: #f6ad55; box-shadow: 0 0 0 1px #f6ad55 inset; }
  .rc-chip.disabled { opacity: 0.38; cursor: not-allowed; text-decoration: line-through; }
  .rc-chip .c-cost { font-size: 0.76em; font-variant-numeric: tabular-nums; }
  .rc-chip .c-cost.pos { color: #93dca5; } .rc-chip .c-cost.neg { color: #fc8181; }
  .rc-chip.sel .c-cost { color: inherit; }
  .rc-chip .c-note { font-size: 0.72em; color: #8a8070; }
  .rc-chip .c-input, .rc-custom-input, .rc-phy-editor input, .rc-textarea, .rc-status-input {
    font: inherit; font-size: 0.85em; color: #e8d5b7;
    background: rgba(10,8,20,0.45);
    border: 1px solid rgba(168,153,104,0.35);
    border-radius: 8px; padding: 5px 11px;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .rc-chip .c-input { width: 176px; }
  .rc-chip .c-input::placeholder, .rc-custom-input::placeholder, .rc-textarea::placeholder { color: #6a6255; }
  .rc-chip .c-input:focus, .rc-custom-input:focus, .rc-phy-editor input:focus, .rc-textarea:focus, .rc-status-input:focus {
    outline: none; border-color: #f6ad55;
    box-shadow: 0 0 0 2px rgba(246,173,85,0.18), 0 0 14px rgba(246,173,85,0.12);
    background: rgba(10,8,20,0.6);
  }

  /* 数量步进器 */
  .rc-qty { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
  .rc-qty-btn { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); font-size: 14px; line-height: 1; user-select: none; transition: all .15s ease; color: inherit; }
  .rc-qty-btn:hover { border-color: #f6ad55; color: #f6ad55; }
  .rc-qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .rc-qty-num { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; color: #f6ad55; }

  /* 灵根元素 */
  .rc-elems { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .rc-elem { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1em; font-weight: 700; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); transition: all .15s ease; }
  .rc-elem:hover { transform: translateY(-1px); }
  .rc-elem.sel { border-color: #f6ad55; color: #f6ad55; box-shadow: 0 0 10px rgba(246,173,85,0.3); }
  .rc-elem.disabled { opacity: 0.35; cursor: not-allowed; }
  .rc-elem.excl { border-radius: 6px; width: auto; padding: 0 12px; }
  .rc-root-sum { font-size: 0.82em; color: #c5b696; margin-bottom: 8px; }
  .rc-root-sum b { color: #f6ad55; }
  .rc-mut-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
  .rc-mut-row .lbl { font-size: 0.8em; color: #a89888; margin-right: 2px; }
  .rc-custom-input { width: 160px; font: inherit; font-size: 0.82em; padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.25); color: inherit; }

  /* 体质 tab */
  .rc-phy-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .rc-phy-tab { padding: 4px 14px; border-radius: 999px; cursor: pointer; border: 1px solid rgba(255,255,255,0.12); font-size: 0.85em; transition: all .15s ease; }
  .rc-phy-tab:hover { border-color: rgba(255,255,255,0.3); }
  .rc-phy-tab.sel { border-color: #f6ad55; color: #f6ad55; box-shadow: 0 0 0 1px #f6ad55 inset; }
  .rc-phy-presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .rc-phy-card { padding: 8px 11px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); font-size: 0.84em; transition: all .15s ease; }
  .rc-phy-card:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.2); }
  .rc-phy-card.sel { border-color: #f6ad55; box-shadow: 0 0 0 1px #f6ad55 inset; }
  .rc-phy-card .pc-name { font-weight: 700; } .rc-phy-card .pc-sub { font-size: 0.74em; color: #a89888; }
  .rc-phy-card .pc-stat { font-size: 0.76em; color: #93dca5; }
  .rc-phy-editor { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); font-size: 0.84em; }
  .rc-phy-editor .pe-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .rc-phy-editor label { color: #a89888; font-size: 0.8em; }
  .rc-phy-editor input { font: inherit; font-size: 0.84em; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.25); color: inherit; width: 64px; }
  .rc-phy-editor input.pe-name { width: 140px; }
  .rc-phy-editor input.pe-eff-name { width: 120px; } .rc-phy-editor input.pe-eff-val { width: 220px; }

  /* 物品 / 状态 */
  .rc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .rc-card { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); transition: all .15s ease; }
  .rc-card:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.2); }
  .rc-card.sel { border-color: #f6ad55; box-shadow: 0 0 0 1px #f6ad55 inset; }
  .rc-card .box { flex: 0 0 18px; height: 18px; border-radius: 4px; border: 1.5px solid rgba(255,255,255,0.35); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: #1a1a2e; }
  .rc-card.sel .box { background: #f6ad55; border-color: #f6ad55; }
  .rc-card .cd-info { flex: 1; min-width: 0; }
  .rc-card .cd-name { font-weight: 600; font-size: 0.88em; }
  .rc-card .cd-meta { font-size: 0.76em; color: #a89888; }
  .rc-card .cd-cost { font-size: 0.78em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rc-card .cd-cost.pos { color: #93dca5; } .rc-card .cd-cost.neg { color: #fc8181; }

  .rc-ghost { display: none; padding: 10px 14px; border-radius: 10px; margin: 0 0 14px; background: rgba(159,122,234,0.1); border: 1px solid rgba(159,122,234,0.35); font-size: 0.88em; }
  .rc-ghost.show { display: block; } .rc-ghost b { color: #b794f4; }

  .rc-textarea { width: 100%; min-height: 72px; font: inherit; font-size: 0.84em; padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: inherit; margin-top: 8px; resize: vertical; }

  .rc-submit { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .rc-btn { font: inherit; font-size: 0.95em; font-weight: 700; letter-spacing: 2px; cursor: pointer; padding: 8px 26px; border-radius: 999px; background: linear-gradient(135deg, #a07f48, #6e4f1d); color: #fff; border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 2px 10px rgba(160,127,72,0.35); transition: all .18s ease; }
  .rc-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(160,127,72,0.5); }
  .rc-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .rc-btn-hint { font-size: 0.8em; color: #a89888; }

  .rc-result { display: none; margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: rgba(0,0,0,0.25); border: 1px solid rgba(168,153,104,0.3); }
  body[data-theme='light'] .rc-result { background: rgba(201,169,110,0.1); }
  .rc-result.show { display: block; animation: fadein .3s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .rc-result .res-title { font-weight: 700; color: #f6ad55; letter-spacing: 1px; margin-bottom: 6px; }
  .rc-result pre { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 0.86em; color: #d8cbb3; }
  .rc-result .res-note { margin-top: 6px; font-size: 0.76em; color: #8a8070; }
</style>
</head>
<body data-theme="dark">

<div class="demo-bar">
  <b>轮回转生面板 · v3 设计预览</b> —— 种族灰置(冥族/神族/域外异类)、六道轮回仅人族、灵根/体质全套机制(仿自定义开局)、转世状态(仅叙述)。
  点数均为占位。切 #good / #bad 看正负业力。
  <div class="demo-switch">
    <button data-sample="good" class="active">正业力 · 可选福泽</button>
    <button data-sample="bad">负业力 · 必须偿报</button>
  </div>
</div>

<div id="rcPanel" class="rc-panel">
  <div class="rc-head" id="rcHead"><span class="rc-icon">☯</span><span class="rc-title">冥府审判 · 善恶评判定级</span><span class="rc-fold">▾</span></div>
  <div class="rc-body">
    <div class="rc-dead" id="rcDead"></div>
    <div class="rc-deeds">
      <div class="rc-deed-col good"><div class="rc-deed-head">✦ 善业</div><div id="rcGoodRows"></div><div class="rc-deed-total good">善业合计 <span class="sum" id="rcSumGood"></span></div></div>
      <div class="rc-deed-col evil"><div class="rc-deed-head">☠ 恶业</div><div id="rcEvilRows"></div><div class="rc-deed-total evil">恶业合计 <span class="sum" id="rcSumEvil"></span></div></div>
    </div>
    <div class="rc-zw" id="rcZw"></div>
    <div class="rc-calc">
      <div class="rc-calc-box"><div class="label">天谴罚 · 天谴/年×10</div><div class="formula" id="rcPenaltyFormula"></div><div class="result penalty" id="rcPenalty"></div></div>
      <div class="rc-calc-box"><div class="label">业力 E（预算）</div><div class="formula" id="rcEFormula"></div><div class="result verdict" id="rcE"></div><span class="rc-grade-tag" id="rcGrade"></span></div>
      <div class="rc-calc-box"><div class="label">判官断语</div><div class="formula" id="rcGradeDesc"></div></div>
    </div>

    <div class="rc-path">
      <div class="rc-path-btn sel" data-path="obey" id="rcPathObey"><div class="pn">服从判决 · 投胎轮回</div><div class="pd">饮孟婆汤入轮回井，依业力挑选福泽/偿报</div></div>
      <div class="rc-path-btn" data-path="ghost" id="rcPathGhostBtn"><div class="pn">不入轮回 · 转生冥族</div><div class="pd">折返忘川鬼域荒野，跳过福泽/偿报，保留记忆与修为</div></div>
    </div>
    <div class="rc-ghost" id="rcGhostNote"></div>

    <div id="rcFate">
      <div class="rc-budget" id="rcBudget"></div>
      <div id="rcGroups"></div>
    </div>

    <div class="rc-submit">
      <button class="rc-btn" id="rcSubmit">定 数</button>
      <span class="rc-btn-hint" id="rcHint"></span>
    </div>
    <div class="rc-result" id="rcResult">
      <div class="res-title">生成回复 + MVU 变量变更（预览）</div>
      <pre id="rcResultText"></pre>
      <div class="res-note" id="rcResultNote"></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= 前端 config（点数占位，待调） ================= */
// 判级
const GRADES = [
  { level: '七等', min: 150, title: '天眷之善', desc: '功德圆满', good: true },
  { level: '六等', min: 50, title: '大善', desc: '广积阴德', good: true },
  { level: '五等', min: 10, title: '微善', desc: '偶有善行', good: true },
  { level: '四等', min: -10, title: '功过相抵', desc: '平庸之魂', good: true },
  { level: '三等', min: -50, title: '微恶', desc: '偶有恶行', good: false },
  { level: '二等', min: -150, title: '大恶', desc: '罪业深重', good: false },
  { level: '一等', min: -Infinity, title: '极恶', desc: '罪不可恕', good: false },
];
const gradeOf = E => GRADES.find(g => E >= g.min) ?? GRADES[GRADES.length - 1];

// 种族（生命种族；sel=false 灰置不可选；妖/灵/物化/魔需输入所化物种，留空随机）

function compute(s) {
  const sumGood = s.善业.reduce((a, x) => a + x.p, 0);
  const sumEvil = -s.恶业.reduce((a, x) => a + x.p, 0);
  penalty = Math.floor((s.天谴 / s.寿命) * 10);
  E = Math.floor((sumGood + sumEvil) * (1 + s.Z)) + s.W - penalty;
  grade = gradeOf(E);
  return { sumGood, sumEvil };
}

// ================= 点数 =================
function raceCost() { return RACES.find(r => r.id === race)?.cost ?? 0; }
function destCost() { return DEST.find(d => d.id === dest)?.cost ?? 0; }
function rootCost() {
  const els = root.elements;
  if (els.includes('无')) return -100;
  if (els.includes('混沌')) return 60 + (root.mutation ? 10 : 0);
  const c = els.length;
  return c === 0 ? 0 : (ROOT_COST[c] ?? 0);
}
function phyCost() { return PHY_TIERS.find(t => t.id === phyTier)?.cost ?? 0; }
function locCost() { return LOCATIONS.find(l => l.id === loc)?.cost ?? 0; }
function memCost() { return MEMORY.find(m => m.id === mem)?.cost ?? 0; }
function itemsCost() {
  return Object.entries(itemQty).reduce((a, [id, q]) => a + (q > 0 ? itemCost(ITEMS.find(i => i.id === id), q) : 0), 0);
}
function statusCost() {
  let n = selStatus.reduce((a, id) => a + (STATUSES.find(x => x.id === id)?.cost ?? 0), 0);
  if (cusSt.on && cusSt.name.trim()) n += CUS_STATUS_COST[cusSt.type] || 0;
  return n;
}
function spent() { return raceCost() + destCost() + rootCost() + phyCost() + locCost() + memCost() + itemsCost() + statusCost(); }
const remaining = () => E - spent();
const valid = () => path === 'ghost' || remaining() >= 0;

// 灵根选择规则（照搬自定义开局 canToggleElement）：
//   混沌/无 互斥且只能单独；五灵根必须恰为金木水火土（阴阳不可参与凑五）；最多 5 元素
function canToggleEl(name) {
  const els = root.elements;
  if (els.includes(name)) return true;
  if (name === '混沌' || name === '无') return els.length === 0;
  if (els.some(e => e === '混沌' || e === '无')) return false;
  if (els.length >= 5) return false;
  if (els.length === 4) {
    const allNormal = els.every(e => ELEMS_NORMAL.includes(e));
    if (!allNormal) return false;
    if (!ELEMS_NORMAL.includes(name)) return false;
  }
  return true;
}

function renderRoot() {
  const els = root.elements;
  const elemsHtml = [...ELEMS_NORMAL, ...ELEMS_POLAR].map(el =>
    `<span class="rc-elem ${els.includes(el) ? 'sel' : ''} ${canToggleEl(el) ? '' : 'disabled'}" data-el="${el}">${el}</span>`).join('') +
    `<span class="rc-elem ${els.includes('混沌') ? 'sel' : ''}" data-el="混沌" title="混沌">混</span>` +
    `<span class="rc-elem ${els.includes('无') ? 'sel' : ''}" data-el="无" title="无灵根">无</span>`;
  let tier = '未择', cost = 0;
  if (els.includes('无')) { tier = '无灵根 · 凡骨'; cost = -100; }
  else if (els.includes('混沌')) { tier = root.mutation ? '变异上品灵根' : '上品灵根'; cost = rootCost(); }
  else if (els.length === 1 && root.mutation) { tier = '变异天灵根'; cost = rootCost(); }
  else if (els.length >= 1) { const map = { 1: '单灵根', 2: '双灵根', 3: '三灵根', 4: '四灵根', 5: '五灵根' }; tier = map[els.length]; cost = rootCost(); }
  const canMut = els.length === 1 && els[0] !== '无';
  const mutHtml = canMut ? `<div class="rc-mut-row"><span class="lbl">变异</span>${MUTATIONS.filter(m => m.el === els[0] || m.el === '混沌').map(m =>
    `<span class="rc-chip ${root.mutationId === m.id ? 'sel' : ''}" data-mut="${m.id}">${m.name}</span>`).join('')}

    ${root.mutation && !root.mutationId ? `<input class="c-input" id="mutCustomName" placeholder="变异名" value="${root.customName.replace(/"/g, '&quot;')}" />` : ''}
    </div>` : '';
  const body = `<div class="rc-elems">${elemsHtml}</div><div class="rc-root-sum">${tier} · 点数 <b>${cost > 0 ? '+' : ''}${cost}</b></div>${mutHtml}`;
  return groupShell('改变灵根', '五→四→三→双→单：0/-30/0/30/60；无灵根 −100', body);
}

}
function renderMemory() {
  return groupShell('保留记忆', '是则保留已学会功法与全部记忆', `<div class="rc-chips">${MEMORY.map(o => chipHtml(o, mem === o.id ? 'sel' : '', `data-mem="${o.id}"`)).join('')}</div>`);
}
function renderItems() {
  return groupShell('保留物品', '可调整保留数量；秘籍保留时阅读进度清零；成本=品质×数量', `<div class="rc-grid" id="rcItemsGrid">${itemsGridHtml()}</div>`);
}
function itemsGridHtml() {
  return ITEMS.map(it => {
    const q = itemQty[it.id] || 0;
    const c = itemCost(it, q);
    return `<div class="rc-card ${q > 0 ? 'sel' : ''}" data-item="${it.id}">
      <span class="box">✓</span>
      <span class="cd-info"><div class="cd-name">${it.name}</div><div class="cd-meta">${it.品质}品 · 拥有 ${it.数量}${it.秘籍 ? ' · 秘籍（阅读进度清零）' : ''}</div></span>
      <span class="rc-qty">
        <span class="rc-qty-btn" data-item-dec="${it.id}">−</span>
        <span class="rc-qty-num">${q}</span>
        <span class="rc-qty-btn ${q >= it.数量 ? 'disabled' : ''}" data-item-inc="${it.id}">+</span>
      </span>
      <span class="cd-cost pos">+${c}</span>
    </div>`;
  }).join('');
}
function renderStatuses() {
  const cusCost = cusSt.on ? (CUS_STATUS_COST[cusSt.type] || 0) : 0;
  const cusCard = `<div class="rc-card ${cusSt.on ? 'sel' : ''}" data-status="__custom__"><span class="box">✓</span><span class="cd-info"><div class="cd-name">自创状态</div><div class="cd-meta">自定义永久状态（叙述效果）</div></span><span class="cd-cost ${cusCost >= 0 ? 'pos' : 'neg'}">${cusCost > 0 ? '+' : ''}${cusCost}</span></div>`;
  const cards = STATUSES.map(x => {
    const cls = x.cost >= 0 ? 'pos' : 'neg';
    return `<div class="rc-card ${selStatus.includes(x.id) ? 'sel' : ''}" data-status="${x.id}"><span class="box">✓</span><span class="cd-info"><div class="cd-name">${x.name} <span style="font-size:0.72em;color:#8a8070">${x.type}</span></div><div class="cd-meta">${x.desc}</div></span><span class="cd-cost ${cls}">${x.cost > 0 ? '+' : ''}${x.cost}</span></div>`;
  }).join('');
  const editor = cusSt.on ? `<div class="rc-phy-editor">
    <div class="pe-row"><label>名称</label><input class="pe-name rc-status-input" id="cusName" placeholder="如：天妒之体" value="${cusSt.name.replace(/"/g, '&quot;')}" /></div>
    <div class="pe-row"><label>类型</label>${Object.keys(CUS_STATUS_COST).map(t => `<span class="rc-chip ${cusSt.type === t ? 'sel' : ''}" data-cus-type="${t}">${t}（${CUS_STATUS_COST[t] > 0 ? '+' : ''}${CUS_STATUS_COST[t]}）</span>`).join('')}</div>
    <div class="pe-row" style="align-items:flex-start"><label>效果</label><textarea class="rc-textarea rc-status-input" id="cusEff" placeholder="叙述性效果描述，如：此身与天地灵机相斥，终生修行进度减半" style="flex:1;min-height:56px">${cusSt.eff}</textarea></div>
  </div>` : '';
  return groupShell('转世状态', '永久 · 仅叙述效果；增益正分/减益负分；可自创', `<div class="rc-grid">${cards}${cusCard}</div>${editor}`);
}

// ================= 交互 =================
function bindGroups() {
  const g = $('rcGroups');

  g.addEventListener('click', e => {
    const el = e.target.closest('[data-el]');
    if (el) {
      const name = el.dataset.el;
      const isExcl = name === '混沌' || name === '无';
      if (isExcl) {
        // 混沌/无：始终可点，点击即清空其它选择（已选则再点取消）
        const i = root.elements.indexOf(name);
        root = { elements: i >= 0 ? [] : [name], mutation: false, mutationId: null, customName: '' };
      } else {
        if (!canToggleEl(name)) return;
        const i = root.elements.indexOf(name);
        if (i >= 0) root.elements.splice(i, 1); else root.elements.push(name);
      }
      if (!(root.elements.length === 1 && root.elements[0] !== '无')) { root.mutation = false; root.mutationId = null; }
      renderRootOnly(); updateBudget(); updateSubmit();
      return;
    }
    const mut = e.target.closest('[data-mut]');
    if (mut) {
      root.mutation = true;
      root.mutationId = mut.dataset.mut === 'custom' ? null : mut.dataset.mut;
      renderRootOnly(); updateBudget(); updateSubmit();
      return;
    }
    const tier = e.target.closest('[data-tier]');
    if (tier) { phyTier = tier.dataset.tier; phyPreset = null; renderPhyOnly(); updateBudget(); updateSubmit(); return; }
    const preset = e.target.closest('[data-preset]');
    if (preset) { phyPreset = preset.dataset.preset === 'custom' ? null : preset.dataset.preset; renderPhyOnly(); updateBudget(); updateSubmit(); return; }
    const rc = e.target.closest('[data-race]');
    if (rc) {
      const r = RACES.find(x => x.id === rc.dataset.race);
      if (!r || !r.sel) return;
      race = r.id; raceInput = '';
      renderGroups(); updateBudget(); updateSubmit();
      return;
    }
    const dc = e.target.closest('[data-dest]');
    if (dc && race === 'human') { dest = dc.dataset.dest; destInput = ''; renderGroups(); updateBudget(); updateSubmit(); return; }
    const lc = e.target.closest('[data-loc]');
    if (lc) { loc = lc.dataset.loc; renderGroups(); updateBudget(); updateSubmit(); return; }
    const mc = e.target.closest('[data-mem]');
    if (mc) { mem = mc.dataset.mem; renderGroups(); updateBudget(); updateSubmit(); return; }
    const inc = e.target.closest('[data-item-inc]');
    if (inc) {
      const it = ITEMS.find(i => i.id === inc.dataset.itemInc);
      if (it && (itemQty[it.id] || 0) < it.数量) { itemQty[it.id] = (itemQty[it.id] || 0) + 1; refreshItems(); updateBudget(); updateSubmit(); }
      return;
    }
    const dec = e.target.closest('[data-item-dec]');
    if (dec) {
      const id = dec.dataset.itemDec;
      if (itemQty[id]) { itemQty[id] -= 1; if (itemQty[id] <= 0) delete itemQty[id]; refreshItems(); updateBudget(); updateSubmit(); }
      return;
    }
    const item = e.target.closest('[data-item]');
    if (item) {
      const it = ITEMS.find(i => i.id === item.dataset.item);
      if (!it) return;
      if ((itemQty[it.id] || 0) > 0) delete itemQty[it.id];
      else itemQty[it.id] = it.数量;
      refreshItems(); updateBudget(); updateSubmit();
      return;
    }
    const st = e.target.closest('[data-status]');
    if (st) {
      const id = st.dataset.status;
      if (id === '__custom__') {
        cusSt.on = !cusSt.on;
        if (!cusSt.on) { cusSt.name = ''; cusSt.eff = ''; }
        renderRootOnly(); updateBudget(); updateSubmit();
        return;
      }
      const i = selStatus.indexOf(id);
      if (i >= 0) selStatus.splice(i, 1); else selStatus.push(id);
      markCards(); updateBudget(); updateSubmit();
      return;
    }
    const cusType = e.target.closest('[data-cus-type]');
    if (cusType) { cusSt.type = cusType.dataset.cusType; renderRootOnly(); updateBudget(); updateSubmit(); return; }
    const addEff = e.target.closest('#phyAddEff');
    if (addEff) { phyCustom.effects.push({ name: '', value: '' }); renderPhyOnly(); return; }
  });

  g.addEventListener('input', e => {
    if (e.target.id === 'raceInput') { raceInput = e.target.value; return; }
    if (e.target.id === 'destInput') { destInput = e.target.value; return; }
    if (e.target.id === 'destArea') { destArea = e.target.value; return; }
    if (e.target.id === 'mutCustomName') { root.customName = e.target.value; return; }
    if (e.target.id === 'phyName') { phyCustom.name = e.target.value; return; }
    if (e.target.id === 'phyWu') { phyCustom.悟性 = Math.max(0, +e.target.value || 0); }
    if (e.target.id === 'phyGen') { phyCustom.根骨 = Math.max(0, +e.target.value || 0); }
    if (e.target.id === 'phyQi') { phyCustom.气感 = Math.max(0, +e.target.value || 0); }
    if (e.target.id === 'cusName') { cusSt.name = e.target.value; updateBudget(); updateSubmit(); return; }
    if (e.target.id === 'cusEff') { cusSt.eff = e.target.value; return; }
    if (e.target.dataset && e.target.dataset.eff) {
      const i = +e.target.dataset.eff;
      if (e.target.dataset.k === 'n') phyCustom.effects[i].name = e.target.value;
      else phyCustom.effects[i].value = e.target.value;
    }
  });
}

function renderRootOnly() {
  const g = $('rcGroups'); g.innerHTML = '';
  const d = document.createElement('div');
  d.innerHTML = `${renderRace()}${renderRoot()}${renderPhysique()}${race === 'human' ? renderDest() : ''}${renderLocation()}${renderMemory()}${renderItems()}${renderStatuses()}`;
  g.appendChild(d);
  renderPhyEffects();
}
function renderPhyOnly() { renderRootOnly(); }
function renderPhyEffects() {
  const box = $('phyEffects');
  if (!box) return;
  const t = PHY_TIERS.find(x => x.id === phyTier);
  box.innerHTML = phyCustom.effects.map((ef, i) =>
    `<div class="pe-row"><label>效果</label><input class="pe-eff-name" data-eff="${i}" data-k="n" placeholder="效果名" value="${ef.name.replace(/"/g, '&quot;')}" /><input class="pe-eff-val" data-eff="${i}" data-k="v" placeholder="数值/描述" value="${ef.value.replace(/"/g, '&quot;')}" /><span class="rc-chip" data-del-eff="${i}" style="color:#fc8181">✕</span></div>`).join('');
  box.querySelectorAll('[data-del-eff]').forEach(x => x.addEventListener('click', () => { phyCustom.effects.splice(+x.dataset.delEff, 1); renderPhyOnly(); }));
}

function markCards() {
  document.querySelectorAll('[data-status]').forEach(el =>
    el.classList.toggle('sel', selStatus.includes(el.dataset.status) || (el.dataset.status === '__custom__' && cusSt.on)));
}
function refreshItems() {
  const grid = $('rcItemsGrid');
  if (grid) grid.innerHTML = itemsGridHtml();
  else renderRootOnly();
}

function updateBudget() {
  if (path === 'ghost') return;
  const sp = spent(), left = remaining();
  $('bBud').textContent = `${E}`;
  $('bSpent').textContent = `${sp}`;
  const le = $('bLeft'); le.textContent = `${left}`;
  le.className = 'b-num ' + (left >= 0 ? 'left' : 'over');
  $('bHint').textContent = E >= 0
    ? (left >= 0 ? '可用点数挑选福泽；也可选偿报抵价' : '已超预算，请取消福泽或补选偿报')
    : (left >= 0 ? '已达偿报要求，可再补福泽（若预算允许）' : `业力为负，尚需 ${-left} 点偿报`);
}
function updateSubmit() {
  const v = valid();
  $('rcSubmit').disabled = !v;
  $('rcHint').textContent = path === 'ghost'
    ? '已定：转生冥族，保留记忆与修为，直接生成回复。'
    : (v ? `预算剩余 ${remaining()} 点，可定数。` : `预算超支 ${-remaining()} 点，无法定数。`);
  $('rcResult').classList.remove('show');
}
function renderBudget() {
  $('rcBudget').innerHTML = `
    <span class="b-label">善恶预算</span><span class="b-num bud" id="bBud"></span>
    <span class="b-label">已用</span><span class="b-num spent" id="bSpent"></span>
    <span class="b-label">剩余</span><span class="b-num left" id="bLeft"></span>
    <span class="b-hint" id="bHint"></span>`;
}

// ================= 路径 =================
$('rcPathObey').addEventListener('click', () => { path = 'obey'; renderPath(); renderGroups(); updateBudget(); updateSubmit(); });
$('rcPathGhostBtn').addEventListener('click', () => { path = 'ghost'; renderPath(); renderGroups(); updateBudget(); updateSubmit(); });

// ================= 定数 =================
function summarize() {
  const parts = [];
  const r = RACES.find(x => x.id === race);
  parts.push(`种族→${r.name}${r.input && raceInput ? `（${raceInput}）` : ''}[${r.cost > 0 ? '+' : ''}${r.cost}]`);
  if (root.elements.length) {
    const 品 = root.elements.includes('无') ? '无灵根' : root.elements.includes('混沌') ? '混沌' : root.elements.join('');
    parts.push(`灵根→${品}${root.mutation ? `·${root.mutationId ? MUTATIONS.find(m => m.id === root.mutationId).name : (root.customName || '自拟变异')}` : ''}[${rootCost() > 0 ? '+' : ''}${rootCost()}]`);
  }
  const t = PHY_TIERS.find(x => x.id === phyTier);
  const phyName = phyPreset ? PHY_PRESETS[phyTier].find(p => p.id === phyPreset).name : (phyCustom.name || '自拟');
  parts.push(`体质→${t.id}·${phyName}[+${t.cost}]`);
  if (race === 'human' && dest) {
    const d = DEST.find(x => x.id === dest);
    parts.push(`六道→${d.name}${destInput ? `（${destInput}）` : ''}${destArea ? `：${destArea}` : ''}[${d.cost > 0 ? '+' : ''}${d.cost}]`);
  }
  parts.push(`位置→${LOCATIONS.find(l => l.id === loc).name}[+${locCost()}]`);
  if (mem === 'yes') parts.push('保留记忆[+30]');
  const kept = Object.entries(itemQty).filter(([, q]) => q > 0);
  if (kept.length) parts.push('保留物品→' + kept.map(([id, q]) => `${ITEMS.find(i => i.id === id).name}×${q}`).join('、') + `[+${itemsCost()}]`);
  if (selStatus.length) parts.push('转世状态→' + selStatus.map(id => STATUSES.find(x => x.id === id).name).join('、') + `[${statusCost()}]`);
  if (cusSt.on && cusSt.name.trim()) parts.push(`转世状态→自创·${cusSt.name}（${cusSt.type}：${cusSt.eff || '未描述'}）[${CUS_STATUS_COST[cusSt.type] > 0 ? '+' : ''}${CUS_STATUS_COST[cusSt.type]}]`);
  return parts.join('；') || '未作选择';
}

$('rcSubmit').addEventListener('click', () => {
  const s = S;
  const { sumGood, sumEvil } = compute(s);
  if (path === 'ghost') {
    $('rcResultText').textContent = [
      `【转生定论 · 不入轮回】`,
      `亡魂：${s.name}（年${s.years} · ${s.realm}）｜死因：${s.cause}`,
      `业力 E = ${E} → ${grade.level} · ${grade.title}，但拒绝饮孟婆汤。`,
      `---`,
      `判官宣判后，<user>折返忘川南岸【鬼域荒野】，种族变为冥族，保留记忆与修为，踏入幽冥生涯线。请据此展开后续。`,
    ].join('\n');
    $('rcResultNote').textContent = '（MVU：种族→冥族；保留 功法/记忆/修为；关系列表好感=0、道侣=false）';
  } else {
    const txt = summarize();
    const 秘籍 = (itemQty['it5'] || 0) > 0 ? '；上古秘境残卷阅读进度→0' : '';
    const memTxt = mem === 'yes' ? '，保留已学会功法与全部记忆' : '，功法清空、记忆归零';
    $('rcResultText').textContent = [
      `【转生定论 · 投胎轮回】`,
      `亡魂：${s.name}（年${s.years} · ${s.realm}）｜死因：${s.cause}`,
      `善恶：Σ善 ${sumGood} / Σ恶 ${sumEvil} ｜ 修正 Z[+${(s.Z * 100).toFixed(0)}%] W[+${s.W}] ｜ 天谴罚 ${penalty}`,
      `业力 E = ${E} → ${grade.level} · ${grade.title}（${grade.desc}）`,
      `所择命途：${txt}`,
      `消耗 ${spent()} / 预算 ${E} 点，剩余 ${remaining()}。`,
      `---`,
      `请据此展开冥府宣判与投胎剧情，严格落实所选命途效果${秘籍}${memTxt}，并结合转生设定推进故事。`,
    ].join('\n');
    const keptCount = Object.values(itemQty).reduce((a, q) => a + (q > 0 ? 1 : 0), 0);
    $('rcResultNote').textContent = `（MVU 变更：物品清空${keptCount ? '→恢复所选' + keptCount + '种' : ''};${memTxt.replace('，', ';')}; 关系列表各条目好感度=0、道侣=false；种族/灵根/体质/位置/状态按所选更新${秘籍}）`;
  }
  $('rcResult').classList.add('show');
});

// ================= 初始化 =================
$('rcHead').addEventListener('click', () => $('rcPanel').classList.toggle('collapsed'));
document.querySelectorAll('.demo-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.demo-switch button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S = SAMPLES[btn.dataset.sample];
    resetState();
    render();
    history.replaceState(null, '', '#' + btn.dataset.sample);
  });
});
const initial = location.hash.replace('#', '');
if (SAMPLES[initial]) {
  document.querySelectorAll('.demo-switch button').forEach(b => b.classList.toggle('active', b.dataset.sample === initial));
  S = SAMPLES[initial];
}
renderBudget();
render();
bindGroups();
renderPhyEffects();
</script>
