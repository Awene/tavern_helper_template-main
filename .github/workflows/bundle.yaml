name: bundle

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 人物细化界面会在构建期读取角色卡仓库中的提示词与世界书规则。
      # 保持与本地两个仓库互为同级目录的布局，否则 webpack 无法解析这些 ?raw 导入。
      - name: Checkout Cultivation-Card-Game build inputs
        run: git clone --depth 1 --branch main https://github.com/Awene/Cultivation-Card-Game.git ../Cultivation-Card-Game

      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all frontends
        run: pnpm build
      - name: Only keep 角色卡示例 in dist for template upstream
        if: github.repository == 'StageDog/tavern_helper_template'
        run: |
          mv dist/角色卡示例 角色卡示例
          rm -rf dist
          mkdir dist
          mv 角色卡示例 dist/
      - name: Remove 示例 in dist for templated repository
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'

      # 自动打版本 tag, 从而让 jsdelivr 基于版本号在 12h 内更新缓存而不是用非版本号的 7d 缓存
      - id: autotag
        if: github.repository != 'StageDog/tavern_helper_template'
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          with-v: true

      # 上游模板原本在这里有一步 `git push --delete origin <上一个 tag>`, 已移除。
      #
      # 删旧 tag 会直接打死已经发出去的角色卡: 玩家导入的正则里钉死的是发布当时的 tag
      # (如 @v1.0.26 的 dist/修仙状态栏/index.html), 一旦该 tag 被删, jsdelivr 立刻 404,
      # 那些没有及时重新导入新版卡的玩家, 状态栏和自定义开局会当场变成空白。
      #
      # 保留历史 tag 的成本只是 refs 多几个, 换来的是老版本卡永远能继续跑。
      # jsdelivr 的缓存目的靠"每次发版都有新 tag"就已经达成, 不需要删旧的。
