# 修仙界编年时间轴（固定剧本事件）
#
# 每一条事件包含以下字段：
#   时间区间:
#     起: { 年, 月, 日 }   事件可见起始时间（含）
#     止: { 年, 月, 日 }   事件可见结束时间（含）
#   地点:   完整地点层级，世界·地域·具体地点。示例：凡界·中原·问道仙宗
#   类别:   原传闻 20 选 1
#           修仙界要闻: 大派动向 / 仙人行迹 / 宗门战事 / 灵脉异变 / 道庭法令
#           秘境异闻:   秘境传闻 / 高额悬赏 / 妖兽异动 / 通缉魔修 / 宝物现世
#           江湖逸闻:   风流韵事 / 千里同心 / 缘分将至 / 邂逅预兆 / 恩怨流转
#           宗门内务:   同门轶事 / 师长动向 / 门内任务 / 资源调配 / 内部秘辛
#   内容:   事件文字描述（80~120 字为宜）
#   难度:   适配境界区间，如 "练气前期-练气后期"。表示参与此事件的合理修为门槛
#
# UI 显示规则：
#   - 玩家当前 [年.月.日] 落在 [起, 止] 之间时，该事件出现在「传闻」页
#   - 不再分类筛选，所有当前生效的事件按起始时间从早到晚平铺
#
# 添加新事件时，请保持 YAML 缩进与字段名一致

- 时间区间:
    起: { 年: 7203, 月: 1, 日: 1 }
    止: { 年: 7203, 月: 6, 日: 30 }
  地点: 凡界·中原·问道仙宗
  类别: 大派动向
  内容: 问道仙宗开启「流芳岛百草峰」常规招新，弟子可申报四堂入门考核；同期琉璃丹宗派出长老巡山，传授浅显丹道。
  难度: 练气前期-练气后期

- 时间区间:
    起: { 年: 7203, 月: 2, 日: 1 }
    止: { 年: 7203, 月: 4, 日: 30 }
  地点: 凡界·北境·寒鸦岭
  类别: 妖兽异动
  内容: 寒鸦岭夜枭群异变，啄食过路修士神识；附近散修门派悬赏，凡剿杀夜枭王者可换取一枚二阶妖丹。
  难度: 练气中期-筑基前期

- 时间区间:
    起: { 年: 7203, 月: 3, 日: 15 }
    止: { 年: 7204, 月: 3, 日: 14 }
  地点: 凡界·东土·玉清坊
  类别: 高额悬赏
  内容: 玉清坊放出榜文：化神中期魔修「血面尊」遁入东土，凡提供其行踪线索者，赏中品灵石五百，斩首者另议。
  难度: 元婴后期-化神后期
